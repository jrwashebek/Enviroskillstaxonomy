# Typing lint lexicon (ADR-0003 T-1/T-4; SPEC §18.4): L1/L2 text must not name an L4 product or an L5 instrument.
# A tool CLASS may be named when it changes the work condition ("validate AI detections", "GIS", "UAS"), so only
# products, vendors and named instruments are listed. Seeded from DC's L4 seed (docs/research/data-craft/
# tools_layer_proposal.csv), PS's examples (ADR-0003 dissent) and SC's instrument registry
# (docs/research/statecraft/policy_landscape_2026.csv). WP-04 (DC) and WP-10 (SC/LM) extend it; scripts/validate_v2.py
# also adds every `productExamples` entry of data/v2/tools/tools.jsonl automatically.
# `cs: true` = case-sensitive (acronyms). Licence: CC0-1.0.
version: 0.1.0
applies_to:
  Competency: [prefLabel, statement, definition]
  Task: [statement, prefLabel]
  Indicator: [statement]
  KnowledgeStatement: [statement]
  Enactment: [note]                       # products only; enactments may describe an authority basis
