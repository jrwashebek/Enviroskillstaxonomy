# Proposed computed-view rule (WP-08; CR-FH-001 asks CA to register it in vocab/rules/). Licence: CC0-1.0.
ruleId: job-family-membership
version: 0.1.0
status: proposed
steward: FH (definition, WP-08) · DE (implementation at integration)
decidedIn: [ADR-0006, ADR-0016, ADR-0020, ADR-0021]
computes: Navigation-only membership of RoleProfiles in JobFamilies. Membership is never stored on any record.
definition: >
  For each role, weight each competency target by its importance (targets of the TX-A floor are excluded). A role is a
  member of a family when (a) the importance-weighted share of its targets that fall on the family's anchor
  competencies is at least `minShare`, or (b) the role's homeModule is one of the family's modules and that share is at
  least `minShareInModule`. A role may belong to several families. Roles with lifecycle proposed or emerging are
  members but flagged `whatsComing`. Held records are never read.
parameters:
  minShare: 0.20
  minShareInModule: 0.10
  excludeTargets: [seed:DC-CAND-01, seed:DC-CAND-02, seed:DC-CAND-13, seed:DC-CAND-05]
  families:
    seed:fh-family-f01-forest-management:
      modules: [forest]
      anchors: [seed:v1-1.3.1, seed:v1-1.3.2, seed:v1-1.3.3, seed:v1-1.3.4, seed:v1-1.3.5, seed:FH-C02, seed:PS-C23, seed:FC-C26]
