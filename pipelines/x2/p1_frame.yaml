# Provisional P1-corridor task frame for X2 (WP-09). Licence: CC0-1.0.
# Until WP-08 authors the 13 P1 role profiles (task bundles), a task is in the P1 frame when it supports a
# competency named for a P1 role (R01-R13, corridors COR-1/2/3) in docs/decisions/mvp_role_set.csv or in the WP
# sections that build those roles. The O*NET candidate pool of each task is the union of the O*NET-SOC codes that
# X3 (data/v2/crosswalks/onet-soc/2019) maps to those roles with a positive, non-negated predicate (ADR-0022 X2:
# candidates restricted to the role family's O*NET-SOC pool). Replace this file with the WP-08 task bundles when
# they exist; the frame then becomes exactly the bundled tasks of the P1 roles. Judgment basis: [J] IA.
