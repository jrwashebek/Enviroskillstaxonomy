# Map from WP-15 claims-register rows (docs/methods/claims_register.csv) to the release records the explorer renders.
# Owner: CP (WP-12). Read by lib/model.mjs (to label or suppress) and tools/check-output.mjs (to verify).
# Rule (WP15_SIGNOFF.md §2.1-2.2): a record tied to an `unverified` row renders only as its title plus
# "Unverified — not for citation (claims register <id>)", with no status, date or event detail; a signal tied to such a
# row is withheld entirely and only counted (its headline is the claim; package review issue 2); a `held` row's records
# never render. The check fails if an unverified or held row used by the explorer has no entry here.
# `withheld: true` (WP-16, ADR-0031 §8; package re-check N2): the release bundle leaves the row's records out
# (data/v2/governance/release_withheld.yaml), so they cannot render; the check then fails if any of the row's
# `withheld_phrases` appears on any page, or if a withheld record is present in the release.
# Licence: CC0-1.0.
version: 1
source: docs/methods/claims_register.csv
signoff: docs/methods/WP15_SIGNOFF.md
rows:
  NEPA-09: {instruments: [seed:ins/dot-nepa-procedures, seed:ins/epa-nepa-procedures], withheld: true, withheld_phrases: ["Department of Transportation NEPA procedures", "Environmental Protection Agency NEPA procedures"]}
  ESA-02: {instruments: [seed:ins/esa-4d-4b2-rules], withheld: true, withheld_phrases: ["blanket 4(d) rule elimination"]}
  ESA-03: {instruments: [seed:ins/esa-s4-s7-regs-2025], withheld: true, withheld_phrases: ["restoring the 2019 framework"]}
  CWA-02: {instruments: [seed:ins/florida-404-assumption], withheld: true, withheld_phrases: ["Florida assumption of the CWA section 404"]}
  DISC-03: {instruments: [seed:ins/sec-climate-disclosure], withheld: true, withheld_phrases: ["SEC climate-related disclosure rules"]}
  REG-01: {instruments: [seed:ins/epermit-act], withheld: true, withheld_phrases: ["ePermit Act"]}
  REG-02: {instruments: [seed:ins/long-term-gna-act], withheld: true, withheld_phrases: ["Long-term Good Neighbor Authority Act"]}
  REG-03: {instruments: [seed:ins/co-hb26-1205], withheld: true, withheld_phrases: ["HB26-1205"]}
  REG-04: {instruments: [seed:ins/fix-our-forests-act], withheld: true, withheld_phrases: ["Fix Our Forests Act"]}
  REG-05: {instruments: [seed:ins/ghgrp-reconsideration], withheld: true, withheld_phrases: ["Greenhouse Gas Reporting Program reconsideration"]}
  # The role-level copy of the same signal (data/v2/signals/2026/s2a-change-view-atoms.jsonl) carries the same claim.
  REG-06: {instruments: [seed:ins/obbba-ira-rescissions], signals: [seed:sig/foresight/ws-10-obbba-ira-rescissions, seed:sig/foresight/ws-10-obbba-ira-rescissions/R09-restoration-project-lead], withheld: true, withheld_phrases: ["IRA conservation"]}
  REG-07: {instruments: [seed:ins/tx-hb-3923], withheld: true, withheld_phrases: ["HB 3923"]}
  # Baseline event days dated by LM judgment (evidenceLabel J on the event): the date is suppressed.
  REG-08: {events_with_evidence_label: [J, S]}
  # Base instruments registered without events: no status is rendered ("status not recorded").
  REG-09: {instruments_without_events: true}
  # Held: no record reaches the release; listed so the check knows the row is handled.
  TRB-01: {held: true}
# Signals that cite a source shared with an unverified row but state a different, verified claim (checked by CP):
exempt_signals:
  emst:core/SIG-NHFHG9M: "cites SC-009 for PermitAI availability (NEPA-08, verified-partial), not the DOT/EPA procedures claim (NEPA-09)"
