# EMST v2 L0 vocabulary — subsectors (44 in 9 clusters), polyhierarchical (ADR-0018)
# Generated from docs/research/domain-bench/subsector_coverage_map.csv (DB); definitions are DB's [J] synthesis pending module SME review.
scheme: subsectors
title: Environmental subsectors
schemeVersion: 1.0.0-draft
status: draft
lastReviewed: '2026-10-23'
decidedIn:
- ADR-0018
- ADR-0002
steward: CA with DB
license: CC0-1.0
description: 'Which environmental system or regulatory regime a task, competency or role concerns. Polyhierarchical:
  a record may carry several subsector IDs. Cluster X lists cross-cutting practice areas that are CORE, enacted
  in every module (X06 laboratory also has a module, MOD-18, for the analyst job family).'
clusters:
  - {notation: W, prefLabel: "Water"}
  - {notation: P, prefLabel: "Pollution control and materials"}
  - {notation: H, prefLabel: "Environmental health"}
  - {notation: E, prefLabel: "Energy and extractives"}
  - {notation: C, prefLabel: "Climate, resilience and hazards"}
  - {notation: M, prefLabel: "Markets, finance and corporate"}
  - {notation: L, prefLabel: "Lands and living resources"}
  - {notation: U, prefLabel: "Built environment"}
  - {notation: X, prefLabel: "Cross-cutting environmental practice (core practice areas, not modules)"}
