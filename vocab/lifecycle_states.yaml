# EMST v2 L0 vocabulary — lifecycle states, protect overlay, editorial statuses, use tiers and validation statuses (ADR-0015, ADR-0010, ADR-0024)
scheme: lifecycle_states
title: Lifecycle and status vocabularies
schemeVersion: 1.0.0-draft
status: draft
lastReviewed: 2026-10-25
decidedIn: [ADR-0015, ADR-0010, ADR-0024, ADR-0029, ADR-0032]
steward: CA with FS, IO, DE
license: CC0-1.0
description: >
  Editorial status (is the record released and its ID stable?) and lifecycle state (how established is this work in
  the world?) are independent. Lifecycle describes the WORK in the sector; validationStatus describes the EMST RECORD
  (rc.1 fix pass, ADR-0032, change request CR-CA-001; review M7). Lifecycle state never caps or raises a use tier: the
  effective tier is capped by validationStatus, IO's level rules and the display gate (effective-use-tier@1.1.0).
  Thresholds are FS starting values, recalibrated after the first annual Signals Review. A record in L1-L4 may be
  `proposed` or `emerging` only with a `lifecycleBasis` that meets the state's entry_test (E-LIFECYCLE-BASIS);
  otherwise it is `watch`.

lifecycle_states:
  - notation: watch
    prefLabel: Watch
    lives_in: "L5 WatchItems (signal cluster + hypothesized entity), and L1-L4 records drafted ahead of the evidence: a role, competency or other record whose work is hypothesized but does not meet the `proposed` entry test (ADR-0032)."
    meaning: Something may be forming; the work is not yet shown to exist in the sector.
    review_by_months: 12
    lapses_without_new_evidence: true
    entry_threshold: "≥ 2 signals, or one high-priority signal."
  - notation: proposed
    prefLabel: Proposed
    lives_in: L1–L4 (persistent ID; non-normative flag)
    meaning: A draft definition exists, composed from L2 tasks, and the entry test is met.
    review_by_months: 12
    entry_threshold: "≥ 3 independent signals of ≥ 2 types from ≥ 2 sector actors, or one mandate with an effective date."
    entry_test:
      any_of:
        - {test: signals, min_independent_signals: 3, min_signal_families: 2, min_sector_actors: 2,
           independence: "pairwise disjoint providers, upstreamSource and processingChain (change-indicator@1.1.0 ER-1); signals of one observationId count once"}
        - {test: mandate, requires: "an Instrument whose DriverEvents include an `effective` event dated on or before the test date"}
    required_fields_for_roles: [evidenceSignals, feederRoles, horizon, scenarioSensitivity, reviewBy, counterSignal]
  - notation: emerging
    prefLabel: Emerging
    lives_in: L1–L4
    meaning: Observable in work, and the entry test is met.
    review_by_months: 24
    entry_threshold: "≥ 10 postings or PDs across ≥ 2 actor types in 12 months, or a named operating programme; feeder roles identified."
    entry_test:
      any_of:
        - {test: postings-pds, min_postings_or_pds: 10, min_actor_types: 2, window_months: 12,
           counts_from: "evidence signals with signalFamily postings-pds: measure.n summed over distinct observations, sectorActor distinct"}
        - {test: operating-programme, requires: "a named operating programme with at least one E-labelled source that resolves"}
      also_for_roles: "feederRoles[] has at least one entry"
  - notation: established
    prefLabel: Established
    lives_in: L1–L4
    meaning: "Long-standing work in the sector; EMST content validation is tracked separately in validationStatus."
    meaning_before_2026_10_25: "Validated and stable (withdrawn by CR-CA-001: it conflated the work with the record; ADR-0032)."
    review_by_months: 36
    entry_threshold: "Long-standing work: ≥ 30 postings or PDs across ≥ 3 actor types over 12 months, or a major employer's classification or PD standard, or v1 content carried from established practice. No validation requirement: validation is validationStatus."
  - notation: declining
    prefLabel: Declining
    lives_in: L1–L4
    meaning: Demand falling or the task substituted (flagged; development de-prioritized).
    review_by_months: 24
    entry_threshold: "Demand share down ≥ 30% over 24 months, or the substitution-confirmation checklist met. Protect check mandatory."
  - notation: withdrawn
    prefLabel: Withdrawn
    lives_in: L1–L4 (ID and crosswalks kept; never reused)
    meaning: "No longer current (no use tier: the record is not for use)."
    entry_threshold: "Below threshold for 36 months, no protect flag, and Editorial Board (CA during Phase 4) approval."
  - notation: lapsed
    prefLabel: Lapsed
    lives_in: L5
    meaning: Watch item expired without new evidence.
  - notation: merged
    prefLabel: Merged
    lives_in: L1–L4
    meaning: Absorbed into another ID; redirects.

l4_state_mapping:
  description: DC's L4 tool lifecycle maps onto the shared states.
  watch: watch
  active: established
  legacy: declining
  retired: withdrawn

protect_overlay:
  definition: Stored governance decision (never computed) preventing withdrawal of a capability whose loss would be irreversible or dangerous.
  criteria_two_of:
    - "Failure would be severe: life safety, legal duty, irreversible ecological harm, or broken trust."
    - "Reproducing the capability takes 5 years or more."
    - "Supply is fragile in two or more scenarios (SC1–SC4)."
  effects:
    - "Cannot move to withdrawn without Editorial Board approval plus sector consultation."
    - "Priority for knowledge capture and formation design."
  tribal_rule: "Protect decisions on Tribal-related content require Tribal Council consent."

editorial_statuses:
  - {notation: draft, definition: "Being authored; uses a seed: key; may change freely."}
  - {notation: candidate, definition: "Persistent ID minted; in a frozen review packet (rc release)."}
  - {notation: published, definition: "Released; ID and meaning stable."}
  - {notation: deprecated, definition: "Still valid but discouraged; successor recommended."}
  - {notation: superseded, definition: "Meaning replaced; replacedBy required; remains resolvable."}
  - {notation: withdrawn, definition: "Removed without successor; resolves to a tombstone with explanation."}

use_tiers:
  description: "Effective use tier = min(declared ceiling, validationStatus evidence cap, IO level rules, display gate for any tag shown). Lifecycle state does not cap the tier (effective-use-tier@1.1.0; ADR-0032); withdrawn, lapsed and merged records have no tier."
  values:
    - {notation: exploratory, definition: "Foresight, 'what's coming', curriculum exploration; not for decisions.", aliases: [AS exploratory]}
    - {notation: describe, definition: "Workforce analytics, planning, curriculum mapping.", aliases: [IO describe/plan]}
    - {notation: develop, definition: "Training, task books, IDPs, self-assessment.", aliases: [IO develop, AS training-grade]}
    - {notation: select, definition: "Hiring and promotion — only as input to the employer's own job analysis.", aliases: [IO select/promote, AS selection-grade]}
  indicator_use_classes: [describe, develop, select]
  indicator_use_classes_note: "Indicator.useClass is a use tier other than exploratory (SPEC §5.3; CR-DE-001). The effective tier is computed by vocab/rules/effective-use-tier@1.0.0.yaml."

validation_statuses:
  - {notation: seed-v1, definition: "Migrated from v1 as seed content; not validated."}
  - {notation: draft, definition: "Authored or rewritten in v2; not yet reviewed."}
  - {notation: reviewed, definition: "Reviewed by editors and craft or module leads."}
  - {notation: panel-retained, definition: "Retained by a pre-registered Delphi or SME panel at the exact Lawshe critical value."}
  - {notation: job-analysis-confirmed, definition: "Confirmed by a composition-corrected job-analysis survey for a function cluster, with linkage to critical tasks."}
  - {notation: criterion-supported, definition: "Criterion-related, transportability or validity-generalization evidence exists for a stated use."}

reliability_gate:
  statistic: Krippendorff's alpha (level-appropriate), bootstrap 95% CI, decided on the lower bound
  production: ">= 0.80"
  tentative: "0.667 – 0.80 (shown with a tentative marker)"
  not_shown: "< 0.667"

changeNote:
  - date: '2026-10-25'
    change: CR-CA-001
    note: >
      `established` redefined as long-standing work in the sector (validation is validationStatus); `watch` may label
      L1-L4 records whose work does not meet the `proposed` entry test; max_use_tier removed from every state
      (lifecycle no longer caps the use tier); machine-readable entry_test added for proposed and emerging, checked by
      scripts/validate_v2.py (E-LIFECYCLE-BASIS). Decided in ADR-0032 (rc.1 fix pass; review M7).
