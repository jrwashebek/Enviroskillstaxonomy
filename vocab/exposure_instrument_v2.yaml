# EMST v2 L0 vocabulary — exposure and change instrument, codebook v2 (ADR-0008)
scheme: exposure_instrument
title: EMST exposure and change instrument — codebook v2
schemeVersion: 2.0.0-draft
instrument_id: emst-exposure@2.0
status: draft
lastReviewed: 2026-10-25
decidedIn: [ADR-0008, ADR-0028, ADR-0007, ADR-0029, ADR-0032]
steward: CA with LM, FS, FC, DC, IO
license: CC0-1.0
description: >
  Every exposure judgment is an ExposureAssessment record about one L2 task, pinned to the SHA-256 of the exact
  task text rated, attributed to a rater type and pseudonymous rater, dated, with method and confidence. Three
  constructs are recorded separately and never fused into one code. v1 values (A/Ac/H/S/V; tacit; P/C/X; AI/Ro/Cv;
  horizon) migrate as v1-analyst prior evidence only; their mapping to this codebook is given at the end.

constructs:
  technical_exposure:
    construct: a
    unit: task
    scenario_conditioned: false
    definition: Could current technology perform or substantially speed the task at equal quality? Dated; by vector.
    vectors:
      - {notation: llm-cognitive, definition: "Language and reasoning models acting on text, code, images and documents."}
      - {notation: robotics, definition: "Physical automation and robotic systems performing manipulation or locomotion."}
      - {notation: sensing, definition: "Instruments, imagery, acoustic arrays, camera traps, eDNA and sensor networks replacing in-person observation."}
      - {notation: convergent, definition: "Operationally inseparable combination of the above (v1 Cv rule retained)."}
    levels:
      - {notation: E0, intensityRank: 0, definition: "No meaningful reduction in time at equal quality."}
      - {notation: E1, intensityRank: 2, definition: "Time cut by at least half at equal quality with the technology alone (aligns with Eloundou E1)."}
      - {notation: E2, intensityRank: 1, definition: "Time cut by at least half only with complementary software or system integration built on the technology (close to Eloundou E2)."}
      - {notation: E3, intensityRank: 3, definition: "Technology can perform the full task end to end at equal quality under current conditions.",
         note: "EMST E3 is NOT Eloundou et al.'s E3 (their E3 is exposure through image capabilities). Do not join EMST E3 to Eloundou E3 labels."}
    ordinal_order: [E0, E2, E1, E3]
    ordinal_order_note: >
      Intensity order (CR-IO-003, ADR-0029): E1 (time halved with the technology alone) is more direct exposure than
      E2 (halved only with complementary software or systems). Codes are labels, not ranks: ordinal alpha and every
      sorted display or computed distribution use this order, with nominal alpha reported alongside.
    intensity_rank_note: >
      `intensityRank` (0-3) gives each code's position in ordinal_order, so a consumer sorts or compares by rank and
      never by the code's digit (rc.1 fix pass, ADR-0032; review M8). Only E1 aligns with an Eloundou level by
      definition; E2 is close to Eloundou E2; EMST E3 has no Eloundou counterpart.
  deployment_mode:
    construct: b
    unit: task × sector actor
    scenario_conditioned: false
    definition: Who executes the task where it is actually deployed now (current deployment, not projected trajectory — v1's A/V rule retained).
    modes:
      - {notation: human-executes, definition: "No deployed tool performs any part of the core task.", v1_equivalent: "H (descriptive part only)"}
      - {notation: assisted, definition: "Human performs the task with tools that support it.", v1_equivalent: A}
      - {notation: compressive, definition: "Substantial time compression with the human reviewing and certifying the output. A task-level rating of time compression; headcount effects are NEVER a task property.", v1_equivalent: Ac}
      - {notation: supervises-system, definition: "The system executes and the human supervises and intervenes. Requires deployment evidence.", v1_equivalent: V}
      - {notation: system-executes, definition: "The system executes the task without routine human review. Requires deployment evidence.", v1_equivalent: S}
    deployment_stages: [none, pilot, deployed-limited, deployed-scaled]
    strategy_tags:
      - {notation: substitution, definition: "Adoption pathway that removes human performance of the task."}
      - {notation: augmentation, definition: "Adoption pathway that keeps human performance and speeds it."}
      - {notation: augmentation-for-formation, definition: "Augmentation that also frees senior time for mentorship and protects the learning substrate (robust in all four scenarios, FS)."}
  outcome:
    construct: c
    unit: role variant or organization (staffing); task (scenario rows)
    scenario_conditioned: true (scenario rows only)
    staffing_outcome_values: [grow, stable, compress, decline, insufficient-evidence]
    scenario_rows:
      applies_to: "Only tasks above the exposure threshold: any vector at E1, E2 or E3, or deployment mode compressive or higher, or a flagged formation task (CR-IO-003)."
      demand_direction: [up, flat, reshape, external, down]
      reproduction_risk: [L, M, H]
      scenario_ids: [SC1, SC2, SC3, SC4]

supporting_task_attributes:
  - {field: fieldDependency, defined_in: vocab/crafts.yaml}
  - {field: formationDependency, defined_in: vocab/crafts.yaml}
  - {field: tacitExperienceRequirement, values: [Hi, Med, Lo], note: "Assessed independently and used as a predictor; never inferred from mode."}
  - {field: accountabilityConstraint, definition: "Law requires a human in responsible charge (descriptive), with basis."}
  - {field: shouldRemainHumanReason, definition: "Normative reason (e.g. accountability, legitimacy) kept separate from descriptive fields."}
  - {field: governedData, values: [none, tribal, personal, confidential-business]}

rules:
  - {id: "XR-01@2.0", rule: "Code blind to the parent competency, domain, craft and any prior label. (Drops v1 R1's expectation clause.)"}
  - {id: "XR-02@2.0", rule: "Record descriptive and normative judgments in separate fields. v1 'H' decomposes into fieldDependency + deployment mode + shouldRemainHumanReason."}
  - {id: "XR-03@2.0", rule: "'compressive' is a task-level time-compression rating; headcount compression is recorded only as a role or organization staffing outcome."}
  - {id: "XR-04@2.0", rule: "'supervises-system', 'system-executes' and 'deployed now' claims require deployment evidence (registered deployment or observed directive use); otherwise code 'compressive' with sWatch = true. v1's four S calls migrate this way."}
  - {id: "XR-05@2.0", rule: "Governed data: a task handling confidential Tribal information or Indigenous knowledge carries governedData = tribal; its mode may be 'assisted' or 'compressive' only where the Tribe authorizes AI use, otherwise 'human-executes'. Re-code v1 6.5.1 T3, 5.3.2 T3, 5.3.3 T2."}
  - {id: "XR-06@2.0", rule: "Never attach a single external match label; aggregate across matched O*NET tasks weighted by match type and similarity, and report dispersion and a no-external-analogue flag."}
  - {id: "XR-07@2.0", rule: "Assess module tasks (including robotics-exposed subsectors) before publishing any sector-wide exposure conclusion."}

external_measures:
  ingest_as_assessments:
    - {measure: "Eloundou et al. E-labels (human and GPT-4) and T-rubric", unit: "O*NET task (27.x)", note: "aggregate; never single-match"}
    - {measure: "Anthropic Economic Index task usage and collaboration-mode shares", unit: "O*NET task", releases: "six numbered reports 2025-02-10 to 2026-06-26; labor_market_impacts 2026-03-05; robot_exposure 2026-09-30 (first robotics calibrator)", licence: "data CC BY (README)", note: "insufficient-evidence rule; disclosure and triangulation required"}
    - {measure: "Microsoft 'Working with AI: Measuring the Applicability of Generative AI to Occupations' (v6)", unit: "IWA via O*NET task → DWA → IWA"}
    - {measure: "BLS AI exposure categories (theoretical vs observed)", unit: "occupation", release: "2025–35 projections, 2026-08-27", note: "official comparator"}
    - {measure: "OMB federal AI use-case inventory deployment stage", unit: "function × agency", cadence: annual}
  context_only: [AIOE, LM-AIOE, Webb, "ILO Working Paper 140 (2025-05-20)", "WEF Future of Jobs 2025", PwC, MGI]
  benchmarks_only: ["Brynjolfsson, Chandar and Chen 'Canaries' (Aug 2026 revision; 22–25-year-olds ~19% below trend by June 2026; descriptive)", "Humlum–Vestergaard"]
  triangulation_rule: "No change indicator may rest on a single vendor's data."

v1_migration_mapping:
  status: documentation only
  note: >
    Since the rc.1 fix pass (ADR-0032; review M8) this mapping is NOT applied to records: v1-analyst ExposureAssessments
    keep v1 codes only in `v1Values` and carry no construct (a), (b) or (c) field (no deploymentMode, sWatch or
    tacitExperienceRequirement). v1 auto_type was an automation-type judgment that records no deployment, so mapping it
    onto construct (b) would present it as observed deployment. The table says how a reader may relate the codes.
  automation_type: {A: "deploymentMode=assisted (split by vector: physical tool-assisted work vs LLM-assisted desk work)", Ac: "deploymentMode=compressive", H: "fieldDependency + deploymentMode=human-executes + shouldRemainHumanReason (where normative)", V: "deploymentMode=supervises-system if deployment evidence, else compressive + sWatch", S: "deploymentMode=compressive + sWatch (XR-04)"}
  tacit_density: "tacitExperienceRequirement (prior evidence)"
  career_ladder_position: "not migrated as a task property; derived from role profiles (prior evidence kept)"
  vector: {AI: llm-cognitive, Ro: robotics, Cv: convergent, none: "no vector recorded"}
  horizon: "dropped; replaced by dated assessments and deployment stage"
  cld_flag_and_severity: "recomputed at role/pathway level; v1 R9 severity kept as expert overlay prior"
  flags: [text_misaligned, reconstructed_d2, d2_divergent, reconciled_d6_2026_03, normative_h, pre15a_hybrid]
