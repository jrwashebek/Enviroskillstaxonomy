# EMST computed-view rule (SPEC §14.3; ADR-0021; CR-DE-003). Normative definition; code in `implementation`.
ruleId: counts
version: 1.0.0
status: active
steward: DE (implementation) · CA (definition)
decidedIn: [ADR-0021, ADR-0029, CR-DE-003]
computes: Release counts. Every count in release notes, README status and dashboards comes from this view (P-DE-13); none is typed by hand.
inputs: [released records (after the release gate), release-gate exclusions]
definition: >
  Over the records that pass the release gate: count by `type`; Competency by `competencyType` (unset counted as
  'unset') and by `module`; Competency, Task and RoleProfile by `lifecycleState`; `coreCompetencies` = Competency
  records with `module = core` whose `status` is neither superseded nor withdrawn; `excluded` = records removed by
  the release gate, by reason (held Tribal-related records reported only as a count, ADR-0007 §D).
outputs:
  view: views/counts.json
  fields: "ruleId, ruleVersion, buildCommit, release, byType, competenciesByKind, competenciesByModule, byLifecycle, coreCompetencies, excluded"
parameters: {}
implementation: scripts/build_release.py#Builder.views
changeNote:
  - {date: '2026-10-23', note: "Registered from the implementation (CR-DE-003)."}
