# EMST computed-view rule (SPEC §5.9, §14.2-§14.3; ADR-0006 §5, ADR-0021; CR-FH-001 #1). Normative definition; code in `implementation`.
# Registered by the CA from FH's proposed file pipelines/views/rules/job-family-membership@0.1.0.yaml (parameters copied
# verbatim); this file is now the normative copy and FH's file is a working copy only.
ruleId: job-family-membership
version: 0.1.0
status: interim
steward: FH (definition proposal and parameters, WP-08) · DE (implementation) · CA (definition)
decidedIn: [ADR-0006, ADR-0016, ADR-0020, ADR-0021, ADR-0030, CR-FH-001, CR-CP-001]
reference_implementation: pipelines/views/job_families.py (FH, WP-08; authoring tool, never run by CI)
computes: Navigation-only membership of RoleProfiles in JobFamilies. Membership is never stored on any record.
inputs: [released RoleProfile, JobFamily and Competency records]
definition: >
  For each role, weight each competency target by its importance, but only where that target's importance is
  job-analysis-confirmed (display-gate@1.1.0 job_analysis_rule); otherwise every target weighs 1. Targets of the TX-A
  floor are excluded. A role is a member of a family when (a) the weighted share of its targets that fall on the
  family's anchor competencies is at least `minShare`, or (b) the role's homeModule is one of the family's modules and
  that share is at least `minShareInModule`. A role may belong to several families. Roles with lifecycle proposed or
  emerging are members but flagged `whatsComing`. Held records are never read.
outputs:
  view: views/job_families.json
  fields: "family, members[{role, basis, share, whatsComing}], ruleId, ruleVersion, buildCommit"
implementation: scripts/build_release.py#Builder.views (to be ported by DE from the reference implementation; RULINGS_FOR_DE.md §19)
changeNote:
  - {date: '2026-10-23', note: "Registered from FH's proposal; importance weights only when job-analysis-confirmed (CR-CP-001 B4; ADR-0030)."}
