# EMST v2 L0 vocabulary — change types, role-signal types, signal directions and driver tags (ADR-0028, ADR-0015, ADR-0009)
scheme: change_types
title: Change vocabularies
schemeVersion: 1.0.0-draft
status: draft
lastReviewed: 2026-10-25
decidedIn: [ADR-0028, ADR-0015, ADR-0009, ADR-0008, ADR-0029, ADR-0032]
steward: CA with LM, FS, IA
license: CC0-1.0
description: >
  Vocabularies for describing change in work and content. Editorial change-request types (E, C, S, D, X, T) are in
  vocab/evidence_labels.yaml#change_types. Lifecycle states are in vocab/lifecycle_states.yaml.

content_change_types:
  description: How a competency, task or role is changing in the world (team schema 5.2 change_type; used on candidates and signals).
  values:
    - {notation: new, definition: "Work that did not exist or had no analogue (e.g. no O*NET task analogue) and is appearing."}
    - {notation: emerging, definition: "Work observable in a growing number of settings but not yet established."}
    - {notation: transforming, definition: "Established work whose task bundle, tools or standards are changing materially."}
    - {notation: stable, definition: "Established work without material change."}
    - {notation: declining, definition: "Work whose demand share is falling or whose tasks are being substituted."}

role_signal_types:
  description: Team schema 5.3 signal_type for role-level signals.
  values:
    - {notation: new-role, definition: "A role is forming that did not exist before."}
    - {notation: transforming-role, definition: "A role's task bundle or standards are changing materially."}
    - {notation: declining-role, definition: "Demand for a role is falling."}
    - {notation: merging-roles, definition: "Two or more roles are combining (incl. organizational consolidations)."}
    - {notation: splitting-role, definition: "A role is dividing into distinct roles."}
    - {notation: skill-shift, definition: "The competency mix of a role is shifting without a title change."}
    - {notation: entry-path-at-risk, definition: "The entry roles or formation tasks that feed a role are disappearing (career-ladder destruction or fiscal/policy contraction)."}

signal_directions:
  values: [augment, automate, new, grow, decline, stable, reshape, indeterminate]
  direction_confidence: [low, med, high]
  definitions:
    indeterminate: >
      The stored data do not establish a direction (rc.1 fix pass, ADR-0032; data-method review M6). REQUIRED when the
      interval of the difference (measure.difference.ci95) includes 0, when a stated sensitivity check erases or
      reverses the effect (measure.difference.sensitivity.ci95 includes 0, or the method says so), when the measure
      points against the stated direction, or, for projection-family signals, when the absolute and the
      all-occupation-relative directions disagree. An indeterminate signal never counts toward a change indicator.
    stable: "The data show no material change and the interval of the difference excludes a material change; an interval that merely includes 0 is indeterminate, not stable."

driver_tags:
  description: Every signal and change indicator carries driver attribution so fiscal and policy shocks do not masquerade as AI effects.
  values:
    - {notation: AI, definition: "Artificial intelligence (LLM, ML, agents)."}
    - {notation: sensing-tech, definition: "Sensors, imagery, eDNA, acoustic arrays, camera traps."}
    - {notation: automation-robotics, definition: "Physical automation and robotics, process control."}
    - {notation: policy-reform, definition: "Changes in law, rules, policy or procedure."}
    - {notation: fiscal, definition: "Appropriations, budget cuts, grants, hiring freezes for budget reasons."}
    - {notation: demographic, definition: "Retirements, age structure, labour supply."}
    - {notation: climate, definition: "Climate-driven workload and hazard change."}
    - {notation: market, definition: "Private demand, disclosure markets, prices."}
    - {notation: workforce-capacity, definition: "Hiring rules, staffing levels, reorganizations and classification changes that change capacity to perform."}
    - {notation: other, definition: "Other driver, described in the record."}

horizons:
  values: [now, 1-3y, 3-5y, 5-10y, 10y+]

steep_v_categories: [social, technological, economic, environmental, political, values]

signal_reliability:
  description: >
    ChangeSignal.sourceGrade (renamed from `reliability` in the rc.1 fix pass, ADR-0032; review m9): an Admiralty-style
    grade of the SOURCE (A-D). It is not a statistical reliability and says nothing about rater agreement.
  values:
    - {notation: A, definition: "Primary official or peer-reviewed source; directly observed."}
    - {notation: B, definition: "Credible secondary source with traceable primary basis."}
    - {notation: C, definition: "Single secondary or practitioner report."}
    - {notation: D, definition: "Unverified, anecdotal or vendor claim."}

signal_statuses:
  description: ChangeSignal.signalStatus (SPEC §5.14; ADR-0028 §1; renamed from `status`, CR-DE-001 #1).
  values:
    - {notation: watch, definition: "Recorded and shown in the 'what's coming' view; moves no indicator."}
    - {notation: active, definition: "Reviewed and eligible to count under vocab/rules/change-indicator@1.0.0.yaml; signalFamily and a listed independenceKey are required."}
    - {notation: retired, definition: "No longer current; kept for provenance; never counted."}

change_indicator_kinds:
  description: Kinds of computed change indicator (vocab/rules/change-indicator@1.0.0.yaml).
  values:
    - {notation: role-change, definition: "Change indicator on a role profile or role variant."}
    - {notation: skill-change, definition: "Change indicator on a task or competency."}

signal_families:
  description: >
    ChangeSignal.signalFamily (ADR-0028 §2-§3; CR-LM-001 #1). The evidence rule needs two independent families pointing
    the same way; two indices built on the same data family count as one. counts_toward lists the indicator kinds a
    family may count toward; an empty list means context only.
  values:
    - {notation: capability, counts_toward: [role-change, skill-change], definition: "What technology can do on the work (capability benchmarks, exposure indices)."}
    - {notation: observed-use, counts_toward: [role-change, skill-change], definition: "Observed use of technology on the work (usage data)."}
    - {notation: deployment, counts_toward: [role-change, skill-change], definition: "Registered or observed deployments (e.g. AI use-case inventories); registeredDeployment marks a registered one."}
    - {notation: postings-pds, counts_toward: [role-change, skill-change], definition: "Job postings and position descriptions (duties text, volume)."}
    - {notation: headcount, counts_toward: [role-change, skill-change], definition: "Workforce counts, accessions, separations and entry-grade shares."}
    - {notation: plan-requirements, counts_toward: [role-change, skill-change], definition: "Requirements written into plans, permits and programmes (e.g. monitoring components)."}
    - {notation: worker-report, counts_toward: [role-change, skill-change], definition: "Structured reports from practitioners (sentinels, surveys)."}
    - {notation: policy, counts_toward: [role-change], definition: "Policy and state HR events; counts toward role-change indicators only, never toward skill-change indicators (ADR-0028 §3)."}
    - notation: projection
      counts_toward: []
      definition: "Official or third-party projections; context only."
      confidence_cap: {when: "crosswalkMinMatchType broader than skos:closeMatch (broadMatch, narrowMatch, relatedMatch)", cap: low, decidedIn: ADR-0032}
      direction_rule: >
        Direction is read against the all-occupation baseline stored in measure.baseline: grow when the projected change
        exceeds the baseline, decline when it is negative and below the baseline, indeterminate when the absolute and
        the relative readings disagree (0 <= change < baseline) (ADR-0032; review M6).
    - {notation: workload, counts_toward: [], definition: "Workload measures (e.g. fire acres, case backlogs); context only."}

independence_keys:
  description: >
    Upstream data providers behind each ChangeSignal.independenceKey (CR-LM-001 #2; steward LM). ChangeSignal.independenceKey
    is an ENUMERATION generated from the `key` values below (rc.1 fix pass, ADR-0032; review M5): a key not listed here
    is rejected at every signal status (E-INDEPENDENCE-KEY-UNLISTED); there is no "own provider" fallback. Providers
    alone do not establish independence: change-indicator@1.1.0 ER-1 also requires disjoint `upstreamSource` and
    disjoint `processingChain` (below). The first twelve keys were carried from docs/methods/ci/evidence_rule.py#PROVIDERS
    on 2026-10-23 [J: LM; BLS lineage E: V4-07]; the keys added on 2026-10-25 name the provider of the source each
    signal cites [J: LM code held by the D-DATA agent; sources in docs/**/sources.csv]. Agency self-reports share the
    provider federal-agency-self-report, and readings of enacted appropriations share congress-appropriations, so they
    never count as independent of each other.
  keys:
    - {key: anthropic-economic-index, providers: [anthropic]}
    - {key: anthropic-labor-market-impacts, providers: [anthropic]}
    - {key: anthropic-robot-exposure, providers: [anthropic]}
    - {key: ms-working-with-ai, providers: [microsoft]}
    - {key: eloundou-gpts-are-gpts, providers: [openai-eloundou]}
    - {key: bls-ai-exposure-theoretical, providers: [felten-raj-seamans, openai-eloundou, eisfeldt]}
    - {key: bls-ai-exposure-observed, providers: [anthropic, microsoft]}
    - {key: pnnl-openai-draftnepabench, providers: [pnnl, openai]}
    - {key: ombegov-ai-inventory, providers: [omb-agency-self-report, federal-agency-self-report]}
    - {key: opm-ehri-fwd, providers: [opm-ehri]}
    - {key: gao-opm, providers: [opm-ehri]}
    - {key: openlmp-usfs-western-plans, providers: [openlmp]}
    # added 2026-10-25 (rc.1 fix pass; ADR-0032): every key a stored signal uses
    - {key: bls-ep-2025-35, providers: [bls-employment-projections], note: "BLS Employment Projections 2025-35, Table 1.2 (LM-145)"}
    - {key: conservation-job-board, providers: [conservation-job-board], note: "Postings counts reported from the Conservation Job Board (LM-130; V1-14)"}
    - {key: agency-ai-strategy, providers: [federal-agency-self-report], note: "An agency's own AI strategy under OMB M-25-21 (FS-031)"}
    - {key: credential-launch, providers: [credential-provider-announcement], note: "A provider's announcement of a new credential or programme (FS-027)"}
    - {key: earth-fire-alliance, providers: [earth-fire-alliance], note: "Operator announcements as reported in news (FS-011)"}
    - {key: federal-register-pipeline, providers: [federal-rulemaking-record], note: "Federal issuances and rulemaking stages (LM-111, LM-112, LM-116)"}
    - {key: fs-data-discontinuity, providers: [noaa, climate-central], note: "Discontinued federal dataset and its non-federal revival (FS-037)"}
    - {key: mercor-listing, providers: [mercor], note: "A single vendor listing (FS-038)"}
    - {key: nifc-imsr, providers: [nifc], note: "NIFC Incident Management Situation Report (FS-034)"}
    - {key: trade-press-consulting, providers: [trade-press], note: "Trade-press reports of firm activity (FS-008)"}
    - {key: fs-fiscal, providers: [congress-appropriations, naisma], note: "Grey-literature reading of enacted rescissions (FS-036)"}
    - {key: crs-appropriations, providers: [congress-appropriations, crs], note: "CRS overview of enacted appropriations (LM-126)"}
    - {key: pnnl-permitai, providers: [pnnl], note: "PNNL PermitAI tools (LM-110; SC-009); shares provider pnnl with pnnl-openai-draftnepabench"}

processing_chain_steps:
  description: >
    ChangeSignal.processingChain lists the judgment-bearing steps between the upstream source and the stored value or
    target (rc.1 fix pass, ADR-0032; review M5): who coded or transcribed it, which crosswalk set attached it to its
    target, which classifier or lexicon produced a count. Each entry is `<step>:<id>`. Two signals that share any entry
    are NOT independent under change-indicator@1.1.0 ER-1, whatever their providers: one LLM coder, one unreviewed
    crosswalk or one keyword classifier gives correlated errors. Deterministic arithmetic (a bootstrap script) is not a
    step. When a human verifies a step, the verifier's pid: replaces the agent in that entry.
  values:
    - {notation: coder, definition: "The person or agent that coded, transcribed or attached the value (an emstagent: model agent or a pid:)."}
    - {notation: crosswalk, definition: "The mapping set and version that attached the observation to its target (e.g. crosswalk:emst-x3-soc@0.1.0)."}
    - {notation: classifier, definition: "A keyword lexicon, typing scheme or classifier that produced the counted category (e.g. classifier:wp10-omb-keyword-families@0.2.0)."}
    - {notation: linker, definition: "An automated text-to-taxonomy linker (lexical-linker provenance)."}
    - {notation: transcription, definition: "Manual or agent transcription of a published figure, when separate from the coder."}

observations:
  description: >
    One observation (the same source, release, measure, value and periods) may be attached to several targets. Every
    ChangeSignal carries `observationId`; records that share it share every observation field (E-OBSERVATION-INCONSISTENT),
    and counts of evidence report DISTINCT observations, never records (rc.1 fix pass, ADR-0032; review M5).
  id_form: >
    obs-<12 lowercase hex>: the first 12 hex digits of the SHA-256 of the canonical JSON of {upstreamSource,
    measure.value, measure.denominator (measure.name for OpenLMP derivations), observedPeriod.end, and the observed
    subject where the value alone does not identify it (SOC code, keyword family or coordination tag)}, as minted by
    docs/build/rc1-fix/fix_signals.py; readings encoded twice under different names are folded by an inspected alias
    list there. Stored as an identity: the validator checks that records of one observationId share upstreamSource and
    measure.value (E-OBSERVATION-INCONSISTENT) and warns when identical readings carry two IDs (W-OBSERVATION-SPLIT); it
    does not recompute the hash.

signal_external_targets:
  description: >
    ChangeSignal targets that are not EMST entity types (CR-LM-001 #4). Occupation-grain signals (BLS, O*NET-SOC) are
    NOT a target type: they attach to role profiles or variants through the X3 path with crosswalkPath and
    crosswalkMinMatchType.
  values:
    - notation: organization
      id_schemes: ['opm-agency:<code>', 'census-gov:<id>']
      definition: >
        A government employer identified by an official code. Never a Tribal government, Tribal organization or Tribal
        enterprise (ADR-0007 V3); never a named NGO or private firm (use aggregates by sector actor and industry);
        measures with n < 5 are suppressed (ADR-0012). Organization signals inform staffing-outcome and entry-path
        context and never move a role change indicator directly.
