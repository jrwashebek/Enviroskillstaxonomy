# EMST CI (WP-01). Every push and pull request: schema current with vocab/, all data valid (JSON Schema + cross-record
# rules incl. Tribal hold, personal data, typing lint, IO's indicator lint (validation/lint_indicators.py),
# computed-field-in-source, registry append-only, module/core namespaces, v1 completeness), migration deterministic,
# release build reproducible (tests/test_build_release.py), tests.
# Actions are pinned by commit SHA (CP supply-chain guidance); bump with the tag noted in the comment.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0                       # the registry append-only check compares with the merge base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -q -e ".[dev]"
      - name: v1 baseline reproduces byte for byte from legacy/
        run: python scripts/extract_v1.py --check
      - name: Schema and JSON-LD context current with vocab/
        run: python scripts/build_schema.py --check
      - name: Registry base for the append-only check
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git cat-file -e "$base:data/v2/ids/registry.csv" 2>/dev/null; then
            git show "$base:data/v2/ids/registry.csv" > "$RUNNER_TEMP/registry.base.csv"
          else
            : > "$RUNNER_TEMP/registry.base.csv"
          fi
      - name: Validate all data (cross-record rules)
        run: python scripts/validate_v2.py --registry-base "$RUNNER_TEMP/registry.base.csv" --json "$RUNNER_TEMP/validation.json"
      - name: IO indicator lint report (WP-11; the gate is validate_v2, which runs the same linter with v1 seeds as warnings)
        continue-on-error: true
        run: python validation/lint_indicators.py data/v2 --tools-lexicon data/v2/tools/tools.jsonl
      - name: v1 migration is deterministic and X1 is current
        run: python scripts/migrate_v1.py --check
      - name: Tests (seeded-violation fixtures, minting, migration, reproducible build)
        run: python -m pytest -q
      - name: README status block current (generated)
        continue-on-error: true                # informational while many agents write data concurrently
        run: python scripts/update_readme_status.py --check
      - name: Keep the validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: validation-report
          path: ${{ runner.temp }}/validation.json
          if-no-files-found: ignore
