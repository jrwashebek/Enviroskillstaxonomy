# Curated search synonyms for the EMST public-interface prototype (search.js, key `syn`).
#
# Every row is editorial vocabulary chosen by the prototype's data engineer (an AI agent), not EMST release data and
# not reviewed by a practitioner. Each row says what a person might type (`term`) and what the search should also
# look for (`expansions`). Expansions are one-way: add a second row for the other direction where it helps.
#
#   source:     always "editorial (prototype)".
#   kind:       abbreviation | opm-series-nickname.
#   confidence: omitted when the usage is ordinary and well established; "low" when usage varies by agency or era.
#   note:       why a row is low confidence, or what it is for.
#
# For OPM series rows the build adds the series title from the EMST OPM series register (SeriesRecord) to the
# expansions, so official titles are never typed by hand here. A series code that is not in the register fails
# the build.
# Licence: CC0-1.0.
version: 1
rows:
  # ---------------------------------------------------------------- abbreviations and field shorthand
  - {term: Rx burn, expansions: [prescribed fire, prescribed burn, prescribed burning], kind: abbreviation, source: editorial (prototype)}
  - {term: Rx fire, expansions: [prescribed fire, prescribed burn], kind: abbreviation, source: editorial (prototype)}
