note:
  en: 'Local and state environmental health programmes inspect food establishments, public pools and spas, housing, institutions and similar premises against health and sanitary codes: findings are ranked by public-health risk factor, operators are educated on site, and the inspector may order immediate correction or closure when an imminent health hazard exists, setting the conditions for reopening. Inspector standardization against a trainer and risk-based inspection frequencies are programme features. Plan review and site evaluation before permitting stay in SL-C07.'
