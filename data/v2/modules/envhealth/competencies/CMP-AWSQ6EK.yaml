id: emst:envhealth/CMP-AWSQ6EK
type: Competency
prefLabel:
  en: Review plans and evaluate sites for environmental health permits
altLabel:
  en:
  - Environmental health plan review
  - Onsite wastewater site evaluation
  - Food establishment plan review
  - Sanitarian plan review
definition:
  en: 'Deciding before construction or operation whether a proposed food establishment, onsite wastewater system, private well, public pool or similar facility can meet health codes: checking submissions, reviewing plans and design calculations, evaluating soils and separation distances in the field, setting approval conditions and deciding variances, practised by local and state environmental health programmes. Excludes routine and complaint inspections of operating facilities, which are the envhealth enactment of core SL-C03, outbreak investigation (LC-C-07) and laboratory analysis.'
statement:
  en: Checks permit submissions for completeness, reviews facility plans and design calculations against health codes, evaluates soils, separation distances and site conditions in the field, sets approval conditions that a pre-opening or final inspection can verify, and decides variances with the equivalent protection required, before construction or operating permits are issued.
