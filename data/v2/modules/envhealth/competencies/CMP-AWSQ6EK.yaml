editorialNote:
  en: 'WP-06: Survivor for EH inspections and plan reviews; absorbs DB-C27 (same task core). Home of role R26 environmental health specialist. REHS/RS (issued by NEHA, V3-08) and state sanitarian registration are Credential gates that define legal scope in some states (ADR-0006 rule 3a), not levels. Code editions (food code, pool code) are L5 instruments. Basis [E] for the function in state and local classes (SL-035, SL-052, SL-060); [J] for content. | S2 close-out B (A6 DB; ADR-0030 §3.2 duplicate scan). Refocused on plan review and site evaluation for environmental health permits: its inspection core repeated core SL-C03, so the routine and complaint inspection tasks (T1, T4, T5, T6) and their indicators now belong to the envhealth enactment of SL-C03 (emst:envhealth/ENA-59YSQRG), with health-code indicator variants and imminent-hazard closure. Survivor for EH plan reviews; absorbs DB-C27. REHS/RS registration is a Credential, not a level (T-8). Module record, so the core count does not change. R26 role profile still targets SL-C07; WP-08 to add the SL-C03 target. Basis [J].'
