id: seed:LC-C-07
type: Competency
prefLabel:
  en: Investigate outbreaks, complaints and emerging environmental health hazards to control exposure
altLabel:
  en:
  - Environmental health investigation
  - Foodborne and waterborne outbreak investigation
  - Vector and zoonotic disease control
definition:
  en: Hypothesis-driven field investigation of environmental causes of illness and exposure (foodborne, waterborne, vector-borne and zoonotic disease, harmful algal blooms, mold and other emerging hazards) with epidemiologists and laboratories, and selection of control measures. Excludes routine code inspection (SL-C07) and population-level risk assessment (core v1 6.7.1).
statement:
  en: Investigates complaints, case clusters and outbreaks with epidemiologists and laboratories by collecting samples, interviewing staff and reviewing records to identify contributing factors; runs vector surveillance; selects and verifies control measures; and issues advisories when exposure thresholds are exceeded, documenting each step in the investigation record.
