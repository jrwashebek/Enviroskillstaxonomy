id: emst:envhealth/CMP-HDA7HQX
type: Competency
prefLabel:
  en: Plan and run extreme heat preparedness and response programmes
altLabel:
  en:
  - Extreme heat preparedness
  - Heat health action planning
definition:
  en: 'Local and state programmes that reduce heat-related illness and death: mapping heat vulnerability, planning and activating cooling resources, alerts and outreach, coordinating protections for outdoor workers and high-risk residents, and evaluating outcomes with health partners. Excludes building energy design and general climate adaptation planning (core v1 1.5.3).'
statement:
  en: Maps heat vulnerability from temperature, health, housing and population data; prepares a heat response plan with activation thresholds; activates cooling resources, alerts and outreach when thresholds are met; and evaluates each season's response with health surveillance data in an after-action report that changes the next plan.
