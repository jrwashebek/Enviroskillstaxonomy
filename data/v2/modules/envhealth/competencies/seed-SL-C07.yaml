id: seed:SL-C07
type: Competency
prefLabel:
  en: Conduct environmental public health inspections and plan reviews
altLabel:
  en:
  - Sanitarian inspection
  - Environmental health specialist inspection
  - Retail food and onsite wastewater programme inspection
definition:
  en: Risk-based inspection of food establishments, onsite wastewater systems, private wells, recreational water, institutions and housing against sanitary and health codes, with review of construction plans and permit applications for those facilities, practised by local and state environmental health programmes. Excludes outbreak investigation (LC-C-07) and laboratory analysis.
statement:
  en: Inspects regulated facilities and premises against health codes, prioritizing findings by public-health risk; reviews plans and site evaluations before construction or operating permits are issued; educates operators; orders correction or closure where an imminent hazard exists; and documents findings to the standard needed for follow-up and enforcement.
