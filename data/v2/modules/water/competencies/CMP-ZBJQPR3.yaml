id: emst:water/CMP-ZBJQPR3
type: Competency
prefLabel:
  en: Assure public water system compliance with drinking water requirements
altLabel:
  en:
  - Drinking water primacy compliance
  - Public water system supervision
  - Lead and copper compliance analysis
definition:
  en: Determining which drinking water requirements apply to each public water system, tracking monitoring and reporting, conducting sanitary surveys and directing corrective action and public notification, practised from the regulator side (primacy agency) or as a utility's compliance lead. Excludes treatment operation and plant design.
statement:
  en: Determines the monitoring, contaminant-limit and treatment-technique requirements that apply to a public water system, tracks its monitoring and reporting, conducts sanitary surveys, reviews service-line inventories and sampling plans, and directs corrective action and public notification when a system falls out of compliance.
