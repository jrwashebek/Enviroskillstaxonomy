id: seed:v1-4.7.1
type: Competency
prefLabel:
  en: Install green stormwater infrastructure to design specifications
altLabel:
  en:
  - Green infrastructure installation
  - Bioretention and permeable pavement installation
definition:
  en: Field construction and establishment of green stormwater infrastructure (bioretention, swales, permeable pavement, green roofs and similar measures) so that the installed measure matches its design and functions as intended. Covers grading, media and plant installation, erosion control during construction and as-built verification. Excludes design and long-term inspection (DB-C09).
statement:
  en: 'Builds green stormwater infrastructure to design specifications: sets grades and elevations, places engineered media and plants, protects the work from sediment during construction and verifies by field tests that the installed measure infiltrates and drains as designed before handover.'
