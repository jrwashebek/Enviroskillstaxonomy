id: seed:DB-C01
type: Competency
prefLabel:
  en: Operate drinking water treatment processes to meet water quality targets
altLabel:
  en:
  - Drinking water treatment operation
  - Water treatment operator in responsible charge
definition:
  en: Running a drinking water treatment plant's unit processes, from raw-water intake to finished water entering distribution, so that finished water meets health-based and aesthetic targets. Covers process testing, dosing and setpoint control, supervision of automated control, upset response and the process record. Excludes distribution operation, laboratory accreditation work and plant design.
statement:
  en: Controls coagulation, clarification, filtration, disinfection and corrosion control by reading plant conditions, running process tests and adjusting setpoints; supervises automated control; responds to raw-water changes and upsets; and keeps a process record that shows finished water met its targets and withstands regulatory review.
