editorialNote:
  en: 'WP-06: Survivor for drinking-water process operation; absorbs LC-C-05 (sensor-supported operation) and SL-C05 (responsible-charge operation). Operator certification is a Credential gate issued by state programmes, with standardized exams from Water Professionals International (formerly ABC) in many states (V3-08); it is never a proficiency level (ADR-0003 T-8). Fieldcraft here is plant-floor sensory judgment (DB report s.3.3). Levels follow the generic scale; certification grade tied to system classification is recorded on role variants. Basis [J]: DB Phase 2, operator need-to-know criteria (unverified, DB-020).'
