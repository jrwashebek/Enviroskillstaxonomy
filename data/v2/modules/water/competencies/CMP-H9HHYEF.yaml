prefLabel:
  en: Inspect stormwater control measures from construction through long-term maintenance
altLabel:
  en:
  - Construction stormwater inspection
  - Post-construction stormwater control verification
  - MS4 inspection
definition:
  en: Field inspection and verification of erosion and sediment controls on construction sites and of permanent stormwater control measures, including green infrastructure, over their lifecycle, with direction of corrective maintenance under a municipal or state stormwater programme. Excludes design of control measures and programme management.
statement:
  en: Inspects construction erosion and sediment controls and permanent stormwater control measures, judges whether each functions as designed, directs corrective maintenance, verifies completion and documents findings to the standard needed to support enforcement under a stormwater programme.
