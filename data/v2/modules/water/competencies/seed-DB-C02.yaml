id: seed:DB-C02
type: Competency
prefLabel:
  en: Operate wastewater treatment and resource-recovery processes to permit limits
altLabel:
  en:
  - Wastewater treatment operation
  - Water resource recovery facility operation
definition:
  en: Running a municipal or industrial wastewater treatment plant's biological, physical-chemical and solids-handling processes so that effluent meets discharge permit limits and biosolids, reclaimed water and recovered energy meet their quality requirements. Covers process control, upset and wet-weather response and the operating record. Excludes collection-system operation and facility design.
statement:
  en: Controls biological treatment, nutrient removal, solids handling and digestion by interpreting laboratory and online data and adjusting process controls; responds to toxic loads and wet-weather flows; and keeps an operating record showing that effluent met permit limits and that biosolids and recovered resources met their requirements.
