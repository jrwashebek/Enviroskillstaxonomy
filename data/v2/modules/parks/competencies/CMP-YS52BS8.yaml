type: Competency
prefLabel:
  en: Monitor and steward wilderness character
altLabel:
  en:
  - Wilderness character monitoring
  - Minimum requirements analysis
  - Wilderness stewardship
definition:
  en: Establishing baselines and monitoring trends in wilderness character qualities (untrammeled, natural, undeveloped, solitude or primitive recreation) and applying minimum-requirements analysis to proposed administrative actions in designated wilderness. Excludes general recreation planning (IA-CC-02).
statement:
  en: Establishes a wilderness character baseline from indicator measures, monitors and reports trends, and completes minimum-requirements analyses for proposed administrative actions, documenting alternatives and their effects on each quality so that decisions protect wilderness character.
