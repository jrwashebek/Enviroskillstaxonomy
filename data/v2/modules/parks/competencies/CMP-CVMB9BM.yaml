prefLabel:
  en: Plan and manage recreation opportunity and visitor use
altLabel:
  en:
  - Recreation opportunity spectrum planning
  - Visitor use management
  - Travel management
definition:
  en: Classifying recreation settings, estimating visitor use and capacity, designating motorized and non-motorized routes, monitoring social and resource indicators and choosing management actions, including permit and reservation systems, to sustain resources and visitor experiences. Excludes facility construction and trail building (core v1 4.2.5).
statement:
  en: Assigns recreation setting classes, estimates use and capacity from counts and indicators, designates routes that separate conflicting uses, monitors resource and social indicators against thresholds, and selects actions such as permits or reservations when conditions degrade, documenting the evidence behind each decision.
