type: Competency
prefLabel:
  en: Assess and design for scenic resources
altLabel:
  en:
  - Scenery management
  - Visual resource management
  - Viewshed analysis
definition:
  en: Applying scenic integrity or visual quality objectives to the design and evaluation of projects, including viewshed analysis from key observation points, contrast rating and design changes that keep projects within scenic objectives. Excludes landscape architecture design of facilities sealed by a licensed professional.
statement:
  en: Runs viewshed analyses from key observation points and checks them in the field, rates the visual contrast of proposed projects against scenic objectives, and recommends design changes that bring projects within those objectives, documenting the evidence for each finding.
