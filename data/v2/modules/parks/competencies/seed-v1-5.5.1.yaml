id: seed:v1-5.5.1
type: Competency
prefLabel:
  en: Provide visitor information, orientation and safety messaging in parks and protected areas
altLabel:
  en:
  - Visitor information services
  - Visitor contact station operations
definition:
  en: 'Front-line visitor contact at parks, trailheads and visitor centres: orienting visitors to routes, conditions, regulations and hazards, tailoring safety information and recommendations to each visitor''s plans and abilities, and logging questions and incidents to improve messaging. Excludes formal interpretation programmes (core v1 5.1.3) and law enforcement.'
statement:
  en: Orients visitors to routes, current conditions, regulations and hazards, tailors safety information and trip recommendations to each visitor's stated plans and abilities, checks posted and online information against current conditions, and logs questions and incidents so that messaging gaps are found and fixed.
