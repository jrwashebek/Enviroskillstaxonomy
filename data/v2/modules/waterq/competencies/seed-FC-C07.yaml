id: seed:FC-C07
type: Competency
prefLabel:
  en: Assess stream channel form and function in the field
altLabel:
  en:
  - Stream geomorphic assessment
  - Fluvial geomorphology field assessment
definition:
  en: Measuring and interpreting channel geometry, substrate, bankfull indicators, habitat units and riparian condition, recognizing channel evolution stage and process drivers, and using the results to design and monitor restoration. Excludes hydraulic design of structures by a licensed engineer.
statement:
  en: Surveys channel cross-sections, profile and substrate, identifies bankfull indicators and channel evolution stage, classifies habitat units and riparian condition, and interprets the processes driving channel change, so that restoration targets and monitoring metrics rest on field evidence.
