definition:
  en: Forecasting water demand and supply under drought and climate scenarios, preparing drought contingency and integrated resource plans, administering water-right or allocation decisions and evaluating conjunctive use, reuse and storage options. Excludes utility treatment operation (water module) and flood hazard mapping.
statement:
  en: Forecasts demand and supply under drought and climate scenarios, prepares drought contingency and integrated resource plans with triggers and actions, evaluates water-right or allocation applications against availability and priority, and compares conjunctive-use, reuse and storage options by yield, cost and reliability.
