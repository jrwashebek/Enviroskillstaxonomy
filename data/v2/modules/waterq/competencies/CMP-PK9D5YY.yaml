id: emst:waterq/CMP-PK9D5YY
type: Competency
prefLabel:
  en: Delineate wetlands and other aquatic resources in the field
altLabel:
  en:
  - Wetland delineation
  - Aquatic resource delineation
  - Jurisdictional determination support
definition:
  en: Determining wetland and other aquatic resource boundaries from vegetation, hydric soil and hydrology indicators under the federal manual and regional supplements, completing data forms, mapping boundaries and supporting jurisdictional determinations and permit applications. Excludes the jurisdictional determination itself, which depends on the current definition of regulated waters (L5).
statement:
  en: Identifies vegetation, hydric soil and hydrology indicators at paired sample points, completes data forms, places and maps boundaries with survey-grade positioning, and checks modelled wetland maps against field evidence, so that delineations support jurisdictional and permit decisions and pass field verification.
