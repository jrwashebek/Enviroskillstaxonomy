definition:
  en: Quantifying pollutant loads to impaired waters and their loading capacity, allocating loads among point and nonpoint sources with a margin of safety, and building watershed implementation and monitoring plans with stakeholders. Excludes discharge permit drafting (SL-C02 waterq enactment) and water quality standards setting.
statement:
  en: Quantifies pollutant loads and a waterbody's loading capacity from monitoring data and watershed models, allocates loads among point and nonpoint sources with an explicit margin of safety, and builds an implementation plan with stakeholders that assigns reductions, practices and monitoring, documenting the analysis so it withstands review.
