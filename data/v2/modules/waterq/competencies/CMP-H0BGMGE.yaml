definition:
  en: 'Reviewing, approving and tracking mitigation banks, in-lieu fee programmes and permittee-responsible mitigation: credit-debit methods, performance standards, financial assurances, credit release and long-term management, practised by reviewers, bank sponsors or advisors, with emerging biodiversity-credit methods as an extension. Excludes voluntary carbon credit integrity (markets module).'
statement:
  en: Calculates the mitigation required for permitted impacts with credit-debit methods, reviews bank and in-lieu fee instruments, verifies credit release against monitoring and inspection, keeps the credit ledger reconciled and evaluates emerging habitat-credit methods, so that each credit transaction is documented and defensible.
