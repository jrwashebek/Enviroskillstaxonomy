definition:
  en: Designing and interpreting aquifer tests, well logs and groundwater monitoring, delineating wellhead and source-water protection areas, evaluating contaminant transport toward supply wells, and applying well construction and injection-well requirements. Excludes contaminated-site cleanup decisions (waste module DB-C20).
statement:
  en: Designs and interprets aquifer tests and groundwater monitoring, builds conceptual hydrogeologic models, delineates wellhead and source-water protection areas, evaluates contaminant transport toward supply wells and reviews well construction and injection applications, so that drinking water sources are protected on documented evidence.
