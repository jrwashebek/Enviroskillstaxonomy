  en: 'Reskills journey-level fire operations staff into continuous fire intelligence: predicting fire behaviour, fusing and adjudicating detections, producing maps and forecasts, ground-truthing automated products and briefing uncertainty to incident leaders (LC-PW-03 branch B). The target role is emerging (mvp_role_set.csv). Exploratory.'
