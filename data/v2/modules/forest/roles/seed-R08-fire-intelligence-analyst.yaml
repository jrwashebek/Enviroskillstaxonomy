id: seed:R08-fire-intelligence-analyst
type: RoleProfile
prefLabel:
  en: Fire intelligence analyst (continuous operations)
definition:
  en: Emerging year-round role that fuses satellite, camera, sensor, weather and resource data into operational fire intelligence, adjudicates automated detections, predicts spread with stated confidence, tracks forecast skill and briefs duty officers and incident leaders.
functionStatement:
  en: Give fire managers timely, validated intelligence on fire activity and expected behaviour, with its confidence stated, so that resources are ordered on evidence.
