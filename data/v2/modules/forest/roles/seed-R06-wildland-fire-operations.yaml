id: seed:R06-wildland-fire-operations
type: RoleProfile
prefLabel:
  en: Wildland fire operations (crew to supervisor)
definition:
  en: 'Operational fire role from crew member to crew supervisor: constructing and holding fireline, firing and mop-up, saw and hand-tool work, fire weather and behaviour observation, crew safety and emergency response, and, at senior levels, size-up, tactical direction and crew development. Position qualifications are credential gates, not levels.'
functionStatement:
  en: Contain and control wildland fire safely with ground tactics, keeping crews within the safety margins of observed fire behaviour.
