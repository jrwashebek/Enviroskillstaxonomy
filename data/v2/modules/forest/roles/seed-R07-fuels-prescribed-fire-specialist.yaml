prefLabel:
  en: Fuels and prescribed fire specialist
definition:
  en: Role that assesses fuels, designs and supervises fuels treatments, writes and executes burn plans, makes go/no-go decisions, plans smoke management with air regulators, evaluates fire effects and treatment effectiveness, and works with landowners and partners across ownerships.
