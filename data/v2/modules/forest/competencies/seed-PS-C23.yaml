definition:
  en: Implementing and evidencing conformance of forest management and fiber sourcing with voluntary forest certification standards, preparing for and responding to audits, and verifying chain-of-custody records. Scheme names are L4 standards. Excludes the forest management planning itself (v1 1.3.5).
statement:
  en: Builds the records and procedures that evidence conformance with each requirement of a forest certification standard, audits operations internally, answers external audit nonconformities with corrective action and evidence, and verifies fiber-sourcing records for chain of custody.
