id: seed:FC-C08
type: Competency
prefLabel:
  en: Monitor rangeland condition with calibrated field indicators
altLabel:
  en:
  - Rangeland monitoring
  - Rangeland health assessment
  - Core indicator monitoring
definition:
  en: Measuring standardized quantitative indicators (cover, canopy gap, soil stability, height) and qualitative rangeland health attributes against ecological site references, calibrating with other observers and integrating remote-sensing cover products and permittee knowledge. Excludes grazing authorization decisions (IA-CC-01).
statement:
  en: Measures standardized cover, canopy-gap and soil-stability indicators on monitoring plots, completes qualitative rangeland health assessments against ecological site references, calibrates with other observers until results agree, and checks remote-sensing cover products against plot data, so that monitoring results support grazing and restoration decisions.
