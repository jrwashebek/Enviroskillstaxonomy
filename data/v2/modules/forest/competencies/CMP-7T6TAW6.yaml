  en: Prepare and administer timber sale, stewardship and partner implementation agreements
altLabel:
  en:
  - Timber sale administration
  - Stewardship contracting
  - Partner implementation agreements
definition:
  en: Translating silvicultural or restoration prescriptions into sale layouts, appraisals, contract and agreement specifications, and administering them through inspection and enforcement for the contract term, including stewardship contracts and partner implementation agreements. Excludes agreement design between governments as a whole (core SC-C08).
statement:
  en: Turns prescriptions into sale layouts, appraisals and contract or agreement specifications, prepares partner implementation agreements, inspects operations against specifications and enforces contract remedies through the term, so that work on the ground matches the prescription and the agreement holds.
