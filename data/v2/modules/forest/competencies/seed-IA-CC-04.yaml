prefLabel:
  en: Plan, maintain and decommission resource road and trail transportation systems
altLabel:
  en:
  - Forest road management
  - Travel analysis
  - Road decommissioning
definition:
  en: Planning the resource road and trail system (travel analysis, minimum system), locating and specifying roads and trails to minimize resource effects, specifying drainage and crossing practices for maintenance and reconstruction, and prescribing storage or decommissioning of unneeded roads. Excludes trail construction itself (core v1 4.2.5) and road engineering design sealed by a licensed engineer.
statement:
  en: Analyzes the road and trail system to recommend a minimum system, locates alignments in the field to avoid erosion and stream crossings, specifies drainage, surfacing and crossing practices for maintenance and reconstruction, and prescribes storage or decommissioning of unneeded roads, documenting resource effects and costs.
