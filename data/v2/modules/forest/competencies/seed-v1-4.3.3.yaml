id: seed:v1-4.3.3
type: Competency
prefLabel:
  en: Design fuels treatments that reduce wildfire hazard and verify their effects in the field
altLabel:
  en:
  - Fuels management
  - Hazardous fuels reduction
definition:
  en: Assessing fuels, designing mechanical, prescribed fire, grazing and other fuels treatments, supervising their implementation to residual specifications and verifying effects on fuels and expected fire behaviour, including field verification of mapped fuels. Excludes prescribed fire execution (v1 4.3.2) and community wildfire plans as a whole.
statement:
  en: Assesses fuels with field sampling and verified fuel maps, designs treatments that change expected fire behaviour where it matters, supervises implementation to residual fuel and canopy specifications and re-measures fuels after treatment, so that effectiveness and maintenance needs are known.
