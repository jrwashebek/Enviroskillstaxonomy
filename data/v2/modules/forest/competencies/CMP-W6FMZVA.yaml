id: emst:forest/CMP-W6FMZVA
type: Competency
prefLabel:
  en: Project stand development under alternative treatments with calibrated growth models
altLabel:
  en:
  - Stand dynamics and growth modelling
  - Growth and yield projection
definition:
  en: Applying knowledge of stand development to project growth, yield and structure under alternative treatments and disturbance with growth models calibrated and checked against local remeasurement data, and stating the uncertainty of projections. Excludes writing the prescription itself (v1 1.3.1).
statement:
  en: Classifies stand development stage from field data, projects growth, yield and structure under alternative treatments with growth models calibrated to local remeasurement plots, and reports projections with their assumptions and uncertainty so that prescriptions and harvest schedules rest on tested expectations.
