type: Competency
prefLabel:
  en: Plan, authorize and monitor livestock grazing on shared rangelands
altLabel:
  en:
  - Grazing permit administration
  - Allotment management planning
  - Range management
definition:
  en: Designing allotment management (stocking rate, season, duration, rotation and range improvements), authorizing and adjusting grazing permits from monitoring, and resolving non-compliance with permittees on public and shared rangelands. Excludes the indicator measurement itself (FC-C08).
statement:
  en: Designs allotment management with permittees, sets utilization and riparian objectives, monitors them during the season, adjusts permit terms and annual instructions from monitoring results and resolves non-compliance, so that grazing meets resource objectives and each decision rests on documented evidence.
