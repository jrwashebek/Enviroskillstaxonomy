editorialNote:
  en: 'v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): move-to-module → MOD-11 forest. Rationale: Survivor for prescribed fire; absorbs 4.2.3; separates planning from execution tasks and adds supervising UAS ignition (FC verdict); FS stress test suggests protect; relates to TN-C06 (held). Role verdicts considered: FC:change|IA:change. WP-06: Survivor for prescribed fire; absorbs v1 4.2.3 (crew-level prescribed burning) to give one prescribed-fire competency from crew member to burn boss; separates planning from execution and adds supervising uncrewed-aircraft ignition (FC verdict). Burn boss and other positions are Credential gates; state certified burn manager licences likewise. FS stress test suggests protect: listed for the Editorial Board, not set. Relates to TN-C06, which is held (ADR-0007) and not authored here. Smoke management is enacted from DB-C15. Basis [J].'
