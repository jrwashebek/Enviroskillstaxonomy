id: seed:v1-4.3.2
type: Competency
prefLabel:
  en: Conduct prescribed fire from burn planning through ignition, holding and evaluation
altLabel:
  en:
  - Prescribed fire planning and execution
  - Prescribed burning
  - Burn boss practice
definition:
  en: 'Planning and conducting prescribed fire to meet ecological or fuels objectives: writing burn plans, test-firing and go/no-go decisions, ignition (hand and aerial, including supervising uncrewed-aircraft ignition), holding, monitoring against the prescription and evaluating effects, from crew member to burn boss. Excludes smoke management decisions by air regulators (air module DB-C15).'
statement:
  en: Writes burn plans with objectives, prescription and contingencies; checks conditions and decides go or no-go from a test fire; ignites by hand or supervises aerial ignition to the firing plan; monitors fire behaviour, weather and smoke against the prescription; and evaluates effects so that later burns improve.
