id: emst:forest/CMP-P9MQCDF
type: Competency
prefLabel:
  en: Inventory forest resources to stated precision with field plots and remote sensing
altLabel:
  en:
  - Forest mensuration and inventory
  - Timber cruising
definition:
  en: Measuring trees and stands and designing and running forest inventories and timber cruises that estimate volume, structure, composition, carbon or habitat attributes to a stated precision, integrating field plots with remote sensing and judging where plots remain necessary. Excludes growth projection (v1 1.3.3).
statement:
  en: Measures trees to protocol, designs inventories and cruises with sampling intensity matched to the precision required, integrates field plots with airborne lidar and other imagery, and checks crews' measurements, reporting estimates with their sampling error so that decisions rest on known precision.
