id: emst:forest/CMP-6DHWV8B
type: Competency
prefLabel:
  en: Plan forest management and timber harvests to meet ecological and economic objectives
altLabel:
  en:
  - Timber management planning
  - Forest management planning
  - Harvest scheduling
definition:
  en: Preparing forest management plans and harvest schedules that sustain timber, habitat, water and other values, laying out harvest units on the ground and monitoring operations against best management practices. Excludes sale contract administration (FH-C02) and public land-use plans (core v1 6.2.3).
statement:
  en: Prepares forest management plans and harvest schedules that balance timber yield with habitat, water, recreation and carbon objectives, lays out units and leave areas on the ground, and monitors operations against best management practices, so that plans can be executed and checked on the ground.
