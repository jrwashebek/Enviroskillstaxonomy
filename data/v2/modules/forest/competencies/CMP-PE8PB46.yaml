definition:
  en: Continuous integration of satellite detections, camera feeds, sensor and public reports, weather, fuels and resource status into situational awareness and briefings for initial attack, resource ordering and public warning, including adjudication of automated detections and tracking of prediction accuracy. Excludes fire behaviour prediction for a single incident (v1 4.3.4).
statement:
  en: Integrates detections, camera feeds, weather, fuels and resource status into a continuously updated picture, adjudicates automated fire detections before resources are ordered, briefs duty officers and incident commanders, and tracks the accuracy of detections and predictions against outcomes, reporting systematic errors.
