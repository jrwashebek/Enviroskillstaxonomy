id: seed:DB-C19
type: Competency
prefLabel:
  en: Conduct environmental site assessment and site characterization
altLabel:
  en:
  - Phase I and Phase II environmental site assessment
  - Site characterization
  - Conceptual site model development
definition:
  en: 'Assessing whether and how a property is contaminated: records review, reconnaissance and interviews; design and execution of soil, groundwater, soil-gas and sediment sampling; and construction and updating of a conceptual site model across media, with judgment of whether data are usable for the decision. Excludes remedy selection (DB-C20) and transaction due diligence sign-off (PS-C13).'
statement:
  en: Identifies potential contamination from records, reconnaissance and interviews; designs sampling that tests the conceptual site model; logs and samples soils, groundwater and soil gas in the field; and updates the model with each data set, stating which gaps still prevent a remedy decision and whether the data are usable.
