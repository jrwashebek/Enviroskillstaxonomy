type: Competency
prefLabel:
  en: Conduct environmental due diligence for property transactions
altLabel:
  en:
  - Phase I environmental site assessment
  - All appropriate inquiries
  - Transaction screen
definition:
  en: 'Assessing a property before acquisition or financing to the inquiry standard that conveys landowner liability protection: records and database review, site reconnaissance, interviews and judgment of which findings are recognized environmental conditions, with scoping of follow-up sampling. Excludes site characterization sampling (DB-C19).'
statement:
  en: Reviews historical, regulatory and physical-setting records, inspects the property and adjoining uses, interviews owners and users, determines which findings are recognized environmental conditions and scopes follow-up sampling, signing the findings as the qualified environmental professional where the standard requires it.
