id: seed:DB-C17
type: Competency
prefLabel:
  en: Administer extended producer responsibility and materials-management programmes
altLabel:
  en:
  - Extended producer responsibility administration
  - Packaging EPR compliance
  - Producer responsibility organization oversight
definition:
  en: Implementing producer responsibility and materials-management requirements, from the regulator side (review of producer responsibility organization plans, needs assessments, performance targets, eco-modulated fees and report audits) and from the regulated side (keeping a producer's product data and filings complete across jurisdictions). Excludes facility operation and general waste reduction programmes.
statement:
  en: Reviews producer responsibility programme plans and needs assessments against performance and convenience requirements, sets or checks targets and fee modulation, audits producer reports, and, on the regulated side, compiles a producer's material data and filings for every jurisdiction where requirements apply.
