id: emst:waste/CMP-0HYDZPS
type: Competency
prefLabel:
  en: Plan and run waste reduction programmes for facilities and communities
altLabel:
  en:
  - Waste reduction and zero waste programmes
  - Source reduction programmes
definition:
  en: Characterizing waste streams and designing source-reduction, reuse, separation and organics programmes for a facility, institution or community, engaging generators to change practice and tracking generation and diversion to show whether waste fell. Excludes facility operation (DB-C16) and producer-responsibility administration (DB-C17).
statement:
  en: Characterizes waste streams through audits, designs source-reduction, reuse, separation and organics programmes, engages generators to change practice and tracks generation and diversion against baseline, so that the programme can show whether it reduced waste and where to act next.
