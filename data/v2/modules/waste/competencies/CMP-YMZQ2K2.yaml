prefLabel:
  en: Regulate solid waste and materials management facilities
altLabel:
  en:
  - Solid waste facility permitting and inspection
  - Landfill regulation
definition:
  en: Regulator-side permitting, inspection and enforcement at landfills, transfer stations, recycling, composting, scrap tire and other materials facilities, including review of design, operating, financial assurance, closure and post-closure plans. Excludes facility operation (DB-C16) and hazardous waste facility permits (SL-C02 waste enactment).
statement:
  en: Reviews solid waste facility applications and design, operating, closure and post-closure plans, sets and checks financial assurance, inspects facilities for permit compliance and reviews their monitoring reports, so that authorizations are enforceable and conditions are verified in the field and in the record.
