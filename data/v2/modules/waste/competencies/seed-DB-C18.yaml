id: seed:DB-C18
type: Competency
prefLabel:
  en: Determine hazardous waste status and manage generator compliance
altLabel:
  en:
  - Hazardous waste determination
  - Hazardous waste generator compliance
  - RCRA generator compliance
definition:
  en: Facility-side determination of whether wastes are hazardous by listing and characteristic, and management of accumulation, labelling, manifesting, land disposal restriction notices, universal waste, contingency planning and personnel training so that each determination is documented and the facility passes inspection. Excludes treatment, storage and disposal facility operation and regulator inspection.
statement:
  en: Determines whether each waste stream is hazardous from process knowledge and laboratory data, manages accumulation areas, labelling and shipments with complete manifests and notices, maintains the contingency plan and trains personnel for their duties, documenting every determination so that the facility's record withstands inspection.
