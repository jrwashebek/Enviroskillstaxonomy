id: emst:waste/CMP-TZ5WEA7
type: Competency
prefLabel:
  en: Conduct material flow analysis for facilities, supply chains and regions
altLabel:
  en:
  - Material flow analysis
  - Industrial ecology accounting
definition:
  en: Building mass-balanced accounts of material stocks and flows for a facility, supply chain or region, reconciling data from several sources with stated uncertainty, and using the accounts to locate losses and compare material-efficiency and circularity scenarios. Excludes product life-cycle assessment (core v1 3.7.3).
statement:
  en: Builds mass-balanced material flow accounts for a facility, supply chain or region, reconciles conflicting data sources with stated uncertainty, and models scenarios that show how proposed interventions change virgin-material demand, losses and disposal.
