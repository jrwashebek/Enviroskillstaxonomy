id: seed:DB-C20
type: Competency
prefLabel:
  en: Select remedies for contaminated sites and oversee cleanup through long-term stewardship
altLabel:
  en:
  - Remedy selection and remedial design oversight
  - Remediation project management
  - Long-term stewardship of contaminated sites
definition:
  en: Evaluating remedial alternatives against cleanup criteria, selecting and specifying remedies, overseeing contractors during implementation and optimization, and managing institutional controls, periodic reviews and closure; in public programmes, also administering cleanup funds and cost recovery. Excludes site characterization (DB-C19) and emergency hazardous materials response.
statement:
  en: Compares remedial alternatives against cleanup criteria, cost and acceptance, selects and specifies the remedy, oversees contractors against the approved design and safety plan, uses performance data to optimize or transition the remedy, and manages institutional controls, periodic reviews, closure and cleanup-fund administration.
