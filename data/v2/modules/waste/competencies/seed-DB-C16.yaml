prefLabel:
  en: Operate solid waste collection, processing and disposal systems to permit conditions
altLabel:
  en:
  - Solid waste operations management
  - Landfill operations
  - Materials recovery facility operations
definition:
  en: Planning and operating municipal solid waste collection, transfer, materials recovery, organics processing and landfill systems, including cell operations, cover, leachate and landfill gas control and contamination management, so that facilities meet permit conditions and diversion goals. Excludes regulatory oversight of facilities (SL-C14) and producer-responsibility administration (DB-C17).
statement:
  en: Plans collection and processing service, runs landfill cells, cover, leachate and gas systems, manages inbound contamination and supervises automated sorting, so that facilities meet their permit conditions and diversion goals and the operating record withstands regulator inspection.
