id: emst:waste/CMP-BCC0MGW
type: Competency
prefLabel:
  en: Develop materials-management strategies that keep products and materials in use
altLabel:
  en:
  - Circular economy strategy
  - Reverse logistics and closed-loop systems
  - Take-back programme design
definition:
  en: Assessing where products and materials leave productive use and designing reuse, repair, take-back, reverse-logistics, industrial-symbiosis and recycled-content strategies for an organization, community or region, with evaluation of environmental and economic effects. Excludes producer-responsibility administration (DB-C17) and facility operation (DB-C16).
statement:
  en: Identifies where products and materials leave productive use, designs take-back, reverse-logistics, reuse and industrial-symbiosis strategies with their collection and processing routes, and compares the strategies' environmental and economic effects so that the chosen strategy can be tracked against stated targets.
