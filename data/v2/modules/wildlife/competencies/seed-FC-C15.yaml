id: seed:FC-C15
type: Competency
prefLabel:
  en: Capture, handle and mark wildlife and fish humanely and safely
altLabel:
  en:
  - Wildlife capture and handling
  - Fish tagging
  - Chemical immobilization
definition:
  en: Planning and conducting live capture of wildlife and fish (traps, nets, electrofishing, chemical immobilization where authorized), handling, marking and tagging with minimal stress and injury, and managing zoonotic and personal safety risks under animal-care protocols and permits. Excludes survey design and population analysis.
statement:
  en: Captures animals with methods suited to the species and site, immobilizes them where authorized while monitoring vital signs, marks or tags them and records biological data while minimizing handling time and stress, and applies zoonotic and personal safety precautions, following the animal-care protocol and permit conditions.
