id: emst:wildlife/CMP-59HFMXB
type: Competency
prefLabel:
  en: Operate fish hatchery and aquatic propagation programmes
altLabel:
  en:
  - Fish hatchery operations
  - Aquatic propagation
  - Conservation hatchery management
definition:
  en: Managing broodstock, spawning and genetics, fish health, rearing conditions, marking and release so that hatchery production meets recovery or harvest objectives and its contribution can be evaluated. Excludes fishery regulation (v1 1.4.5) and aquaculture for food production.
statement:
  en: Spawns broodstock to the genetic management plan, monitors fish health and treats disease under veterinary direction, adjusts feeding, density and water flow to growth and water-quality targets, and marks and releases fish to the release plan so that returns can be evaluated.
