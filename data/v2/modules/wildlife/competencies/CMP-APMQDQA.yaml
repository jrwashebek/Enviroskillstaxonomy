prefLabel:
  en: Set harvest regulations and manage game populations from survey and harvest data
altLabel:
  en:
  - Wildlife population and harvest management
  - Season and bag-limit setting
  - Game management
definition:
  en: 'Managing hunted and trapped wildlife populations toward stated population and harvest objectives: designing and running population and harvest surveys, estimating abundance, recruitment and harvest rates with their uncertainty, recommending seasons, bag limits and quotas through the agency''s regulation process, and evaluating each season against the objectives. Excludes fish populations and fisheries harvest (v1 1.4.5, DB-C49), protected-species consultation (FH-C01), population dynamics as a knowledge area (v1 1.4.1) and wildlife capture and handling (FC-C15).'
statement:
  en: Designs and runs population and harvest surveys, estimates abundance, recruitment and harvest rates with their uncertainty, recommends seasons, bag limits and quotas that meet stated population and harvest objectives through the agency's regulation process, and evaluates each season's outcome against those objectives before the next cycle.
