id: emst:wildlife/CMP-6S8JA64
type: Competency
prefLabel:
  en: Implement international wildlife and fisheries conservation agreements
altLabel:
  en:
  - International conservation agreements
  - Wildlife trade controls
  - Migratory species agreements
definition:
  en: 'Carrying out a government''s or organization''s commitments under international and bilateral conservation agreements (wildlife trade, migratory species, transboundary habitats and shared fish stocks): reporting, transboundary coordination and trade-permit findings. Excludes domestic consultation duties and agreements with domestic governments.'
statement:
  en: Prepares implementation reports under international conservation agreements from monitoring and management records, coordinates transboundary habitat and population actions with counterpart agencies, and makes the findings that wildlife-trade permits require, documenting how each commitment is met.
