editorialNote:
  en: 'v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): move-to-module → MOD-12 wildlife. Rationale: International conservation agreements (CITES, migratory species, transboundary fisheries) are L02/L03-specific with low US workforce share; US-Tribal treaty rights are a different subject, owned by TN-C01 (held). Role verdicts considered: TN:add. WP-06: Moved to MOD-12 (L02/L03-specific, low US workforce share). Domestic rights-based subjects raised in the v1 verdicts belong to a held competency (TN-C01; ADR-0007) and are not authored here. Agreement names are L5 instruments. Basis [J].'
