id: emst:wildlife/CMP-0FWSASP
type: Competency
prefLabel:
  en: Manage fish populations and habitats to stated conservation and harvest objectives
altLabel:
  en:
  - Fisheries management
  - Inland fisheries management
definition:
  en: Assessing inland fish populations and their habitats and setting harvest regulations, stocking and habitat actions that meet conservation and recreation objectives, then evaluating the results. Excludes formal stock assessment modelling for commercial or interjurisdictional stocks (DB-C49) and hatchery operation (FH-C10).
statement:
  en: Samples fish populations to estimate abundance, size and age structure, growth and mortality; identifies the habitat and water-quality factors limiting them; recommends harvest regulations, stocking or habitat actions that fit stated objectives; and evaluates the response so that management is adjusted on evidence.
