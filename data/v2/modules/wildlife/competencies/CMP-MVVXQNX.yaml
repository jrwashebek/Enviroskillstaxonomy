definition:
  en: Integrating catch, survey, observer and electronic-monitoring and biological data into stock assessment models, including data-limited methods, characterizing uncertainty and advising managers on catch limits and reference points through scientific review. Excludes inland fishery regulation-setting (v1 1.4.5).
statement:
  en: Fits stock assessment models to catch, survey and biological data, applies data-limited methods where data are sparse, checks automated monitoring data against observer samples, characterizes uncertainty and presents catch advice and reference points to scientific review, answering reviewers with documented analyses.
