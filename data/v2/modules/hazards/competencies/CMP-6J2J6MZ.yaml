type: Competency
prefLabel:
  en: Develop hazard mitigation plans and fundable mitigation projects
altLabel:
  en:
  - Hazard mitigation planning
  - Mitigation grant development
  - Benefit-cost analysis for mitigation
definition:
  en: Preparing a jurisdiction's hazard mitigation plan (hazard and risk assessment, capability assessment, strategy and actions agreed with stakeholders) and turning plan actions into scoped projects with benefit-cost analyses and funding applications. Excludes floodplain permit administration (DB-C43) and response operations.
statement:
  en: Assesses hazards and risk for a jurisdiction, builds a mitigation strategy and action plan with stakeholders, scopes projects with their alternatives and constraints, and prepares benefit-cost analyses and funding applications, so that the plan meets approval criteria and its projects are eligible for the funding available.
