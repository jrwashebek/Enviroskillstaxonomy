id: emst:hazards/CMP-S73NCC7
type: Competency
prefLabel:
  en: Conduct rapid post-disaster field assessments
altLabel:
  en:
  - Post-disaster rapid assessment
  - Damage assessment
  - Burned area and flood field verification
definition:
  en: 'Rapid, safe field assessment of burned, flooded, storm-damaged or landslide-affected areas: verifying remotely sensed damage and severity maps on the ground, identifying immediate hazards and prioritizing stabilization and protective actions for response and recovery. Excludes long-term rehabilitation (forest module v1 4.3.5) and structural engineering evaluation.'
statement:
  en: Assesses affected areas quickly and safely, verifies remote damage and severity maps at field plots, identifies immediate hazards such as debris-flow paths, hazard trees and spills, and prioritizes stabilization and protective actions, documenting geolocated findings that incident command and recovery planners can act on.
