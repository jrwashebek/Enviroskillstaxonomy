id: emst:hazards/CMP-KBE89GF
type: Competency
prefLabel:
  en: Administer local floodplain management regulations and flood insurance programme requirements
altLabel:
  en:
  - Floodplain administration
  - NFIP community floodplain management
  - Community Rating System coordination
definition:
  en: 'Local and state floodplain administration: permit review against floodplain ordinances, substantial-damage and substantial-improvement determinations, elevation certificate and map-change records, compliance inspection and community rating activities that keep a community in good standing in the flood insurance programme. Excludes mitigation planning (DB-C40) and flood modelling for map revisions.'
statement:
  en: Reviews development in flood hazard areas against the floodplain ordinance, makes substantial-damage and substantial-improvement determinations, checks elevation certificates and map changes, inspects completed structures and documents community rating activities, so that permit decisions withstand audit and appeal and the community keeps its programme standing.
