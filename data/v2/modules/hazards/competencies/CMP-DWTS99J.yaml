id: emst:hazards/CMP-DWTS99J
type: Competency
prefLabel:
  en: Conduct environmental and historic preservation review for disaster recovery and mitigation projects
altLabel:
  en:
  - Environmental and historic preservation review
  - EHP review
definition:
  en: Environmental, historic preservation, floodplain, wetland and species review of disaster recovery and hazard mitigation projects funded through emergency management programmes, under compressed timelines, including project conditions and verification at closeout. Excludes general environmental review outside disaster programmes (core SL-C08) and the historic preservation review practice itself (core DB-C50).
statement:
  en: Determines the review each recovery or mitigation project needs, applies floodplain, wetland, species and historic preservation requirements under compressed timelines, writes project conditions into awards, coordinates required consultations and verifies completed work against conditions, so that funded projects proceed lawfully and their records withstand audit.
