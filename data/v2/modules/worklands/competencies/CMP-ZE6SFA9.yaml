  en: Working with farmers, ranchers and forest landowners to inventory resource concerns, evaluate conservation practice alternatives against practice standards and the owner's objectives, write conservation plans and contracts, and verify installed practices before programme payment. Excludes regulatory permitting and practice engineering design.
statement:
