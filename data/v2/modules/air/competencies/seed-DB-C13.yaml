id: seed:DB-C13
type: Competency
prefLabel:
  en: Operate ambient air monitoring networks to regulatory quality-assurance criteria
altLabel:
  en:
  - Ambient air monitoring quality assurance
  - Air monitoring network operation
  - Source testing and continuous emissions monitoring oversight
definition:
  en: Siting, operating, calibrating and auditing regulatory ambient monitors and validating their data, together with oversight of source testing and continuous emissions monitors and the correction and integration of low-cost sensor and satellite data, while keeping regulatory and non-regulatory data distinct. Excludes emissions inventories and modelling (DB-C14).
statement:
  en: Sites, operates, calibrates and audits regulatory monitors; validates and certifies data against quality-assurance criteria; oversees stack tests and continuous emissions monitor certification; and corrects low-cost sensor data against collocated reference monitors, documenting each step so the data withstand certification, audit and public scrutiny.
