prefLabel:
  en: Build emissions inventories and air quality models for attainment planning
altLabel:
  en:
  - Emissions inventory development
  - Air quality modelling
  - Attainment planning
definition:
  en: Compiling point, area, mobile and natural source emissions inventories, running or reviewing dispersion and photochemical models, and developing control strategies and attainment demonstrations for areas that do not meet air quality standards, including review of applicants' modelling in permits. Excludes ambient monitoring operation (DB-C13) and permit drafting (SL-C02 air enactment).
statement:
  en: Compiles emissions inventories with documented methods, runs or reviews dispersion and photochemical models, and develops control strategies and attainment demonstrations with stated assumptions and uncertainty, so that the plan shows how and when an area will meet air quality standards and withstands regulatory and public review.
