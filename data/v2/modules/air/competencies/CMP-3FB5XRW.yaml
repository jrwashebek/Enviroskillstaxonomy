prefLabel:
  en: Plan smoke management for prescribed and managed fire within air quality requirements
altLabel:
  en:
  - Smoke management
  - Prescribed fire smoke coordination
  - Exceptional events demonstration
definition:
  en: 'Coordination between fire managers and air regulators that lets prescribed and managed fire proceed while smoke impacts stay within air quality requirements: burn-window and dispersion assessment, burn-day decisions, public health messaging and exceptional-event documentation. Excludes burn execution (forest module, v1 4.3.2).'
statement:
  en: Assesses burn windows against dispersion forecasts, existing air quality and sensitive receptors; prepares or decides burn-day approvals; coordinates public health messaging; verifies smoke forecasts during burns; and documents smoke-affected monitoring days, so that fire use proceeds within applicable air quality requirements.
