editorialNote:
  en: 'Seeded from DB Phase 2 register row DB-CR-081 (subsectors L07|C03). Each qualification is certified by the employing agency after task-book evaluation, not issued by the standards body (LC-104). The standard is revised annually and was updated in January 2026, changing some position names; USWFS-USFS aligned federal qualification standards take effect January 2027 (NWCG is not a party to that alignment) (V3-13, LC-103). Gate type: required by agency and interagency policy for incident and prescribed-fire assignments, not by statute or regulation, so closureType is ''voluntary'' under the vocabulary''s definition (CR-LC-001 proposes an employer-or-policy-mandated value). Holding a qualification is a gate, not a proficiency level (ADR-0004 §8). Issuer verified by V3/LC sources. A credential is a gate on tasks and role variants, never a proficiency level (ADR-0003 T-8).'
