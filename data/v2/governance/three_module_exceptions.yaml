# recurrence is reported as I-THREE-MODULE-RECURRENCE). Transversal practice and knowledge areas are exempt.
# Rows are added only by the CA (later the Editorial Board). Row fields:
#   competency (seed key or emst ID), modules [namespaces enacted], rationale, decidedBy (pid:… or CA),
#   decidedOn (YYYY-MM-DD), reviewBy (YYYY-MM-DD), decidedIn (ADR or DECISION_LOG id)
# On 2026-10-23 no core competency has one or two module enactments (docs/build/WP-06/three_module_coverage.csv), so
