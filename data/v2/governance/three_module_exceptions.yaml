# Three-module rule exception register (ADR-0003 G-4; ADR-0018 §6; CR-DB-001 #1; ADR-0030 §1.3).
# Read by scripts/validate_v2.py (W-THREE-MODULE on drafts, E-THREE-MODULE from candidate on): a live core practice
# competency whose live module Enactments name only one or two distinct modules must have a row here, or gain a third
