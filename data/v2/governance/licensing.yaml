# Licensing state read by scripts/validate_v2.py and scripts/build_release.py (ADR-0013). Licence: CC0-1.0.
# v1Dedication: the project lead's written CC0 dedication of the v1 text (questions_for_project_lead.md Q2).
#   pending  -> records carrying v1 wording use license LicenseRef-EMSTv1-PendingDedication and are EXCLUDED from
#               the CC0 data files of every release (IDs, structure and crosswalks only), per the Q2 default.
#   granted  -> set only when the dedication is recorded; add `v1DedicationRecord` (decision or commit reference).
v1Dedication: pending
v1DedicationRecord: null
licences:
  data_and_standard_text: CC0-1.0          # LICENSE-DATA
  narrative_publications: CC-BY-4.0        # LICENSE-PUBLICATIONS
  code: Apache-2.0                         # LICENSE
  v1_derived_text_pending: LicenseRef-EMSTv1-PendingDedication
  tribal_namespaces: contributor-chosen    # ADR-0013 §6; excluded from bulk CC0 unless opted in
