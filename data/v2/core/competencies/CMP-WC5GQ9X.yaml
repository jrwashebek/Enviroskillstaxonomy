id: emst:core/CMP-WC5GQ9X
type: Competency
prefLabel:
  en: Manage risk in uncontrolled field environments
definition:
  en: 'Recognizing and controlling hazards at field work sites before and during work: job hazard analysis tied to the actual site; lookouts, communications, escape routes and safety zones; stop-work calls; heat, smoke and environmental-exposure illness; lone and pair work; and hazards from automated systems working near people. Excludes organization-wide safety culture (TX-C), safety programme administration and medical response.'
statement:
  en: Identify the actual hazards at a field site before and during work and control each, including terrain, weather, heat and smoke, wildlife, traffic, equipment and automated systems near people; set escape routes and stop-work criteria; brief crews on that day's hazards; and stop work when conditions change.
