id: seed:v1-2.2.3
type: Competency
prefLabel:
  en: Assure the quality of environmental data from collection to release
altLabel:
  en:
  - Data quality control and validation
definition:
  en: 'The capability to design and run quality assurance and quality control for environmental data from collection to release: protocols, checks, audits, flagging and correction rules, including the design, tuning and audit of automated checks on sensor and batch data. Field calibration and sample handling stay field craft.'
statement:
  en: 'Designs and runs quality assurance and control for environmental data from collection to release: writes QA protocols; applies range, consistency and completeness checks; audits datasets; designs, tunes and audits automated anomaly flags and corrections on sensor and batch data; records every flag and correction; and trains others on validation rules.'
editorialNote:
