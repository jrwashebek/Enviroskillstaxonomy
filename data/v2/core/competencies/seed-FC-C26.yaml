id: seed:FC-C26
type: Competency
prefLabel:
  en: Assess tree risk and structural condition
definition:
  en: Evaluating tree defects, failure likelihood, targets and consequences with standard visual and diagnostic methods in parks, recreation sites, rights-of-way, urban forests and field work sites; recommending mitigation; and documenting assessments for liability. Tree risk assessment qualifications are credential gates. Excludes arboricultural treatment and utility vegetation programme management (energy module).
statement:
  en: Evaluate tree defects, failure likelihood, targets and consequences with standard visual and diagnostic methods, verify remote risk indications on the ground, recommend mitigation, and document assessments so they can support liability review.
