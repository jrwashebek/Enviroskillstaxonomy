definition:
  en: The capability of an action agency, or of a consulting wildlife or fisheries agency, to determine and document a proposed action's effects on listed species and designated critical habitat and to complete interagency consultation, carrying its terms into the action. Excludes species status assessments for listing decisions.
statement:
  en: Determines whether a proposed action may affect listed species or designated critical habitat, prepares the biological assessment, consults the wildlife or fisheries agency to reach concurrence or an opinion, and carries the resulting terms, conservation measures and reporting duties into the action's design and decision.
