prefLabel:
  en: Apply systems thinking across ecological, institutional and technical systems
altLabel:
  en:
  - Systems thinking
  - Social-ecological systems analysis
definition:
  en: 'Represents an environmental problem as interacting ecological, institutional and technical systems: maps components, flows, feedbacks, delays and leverage points, traces how an intervention propagates (including unintended and cross-boundary effects), and uses the map to choose, sequence and monitor actions. Excludes the disciplinary knowledge of any single system (knowledge areas) and formal simulation modelling (Data Craft practice).'
statement:
  en: Maps an environmental problem as interacting ecological, institutional and technical systems, identifies feedbacks, delays, trade-offs and leverage points, traces how a proposed action propagates across system and jurisdictional boundaries, and uses that analysis to choose, sequence and monitor actions.
