definition:
  en: 'The capability to secure, document and administer rights to use land for environmental, infrastructure and conservation purposes: title and encumbrance research, negotiation of easements, options, leases, acquisitions and exchanges, right-of-way and special-use authorizations on public land, landowner relations and compensation, and monitoring of the terms. Appraisal and land surveying as licensed practices are referenced, not covered.'
statement:
  en: Researches title and encumbrances; negotiates easements, options, leases, acquisitions and exchanges with landowners and agencies; processes right-of-way and special-use applications against plan decisions and required review; maintains landowner relations and resolves complaints; and monitors and enforces the terms of the rights held.
