editorialNote:
  en: 'S2 close-out A (A7, PS code; reviewer A5 SC, the same agent''s other code). Survivor: absorbs IA-CC-06 (conduct lands and realty actions; candidate_disposition.csv). Land rights, rights-of-way and realty recur in public lands, utilities, transportation, energy and land trusts (G-4); public realty specialists and private land agents share the work, which makes it a mobility bridge (PS report §3). Lands and realty is one of seven functions found missing in land management plan requirements [E: IA-033]. Module enactments for forest, water and parks are DB''s (ADR-0018 §4).'
