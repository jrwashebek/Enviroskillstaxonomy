id: seed:v1-4.1.2
type: Competency
prefLabel:
  en: Detect and record wildlife by direct observation, sign and standardized surveys
definition:
  en: Detecting, identifying and recording wildlife presence, abundance and behaviour through visual and aural observation, sign (tracks, scat, nests, feeding remains) and standardized survey methods, including deploying passive detectors to protocol. Excludes live capture and handling (wildlife module) and statistical estimation of abundance (data craft).
statement:
  en: Run standardized wildlife surveys and interpret sign to detect, identify and count animals, recording detections, uncertainty and survey conditions so that occupancy and abundance analyses can rely on them; adjust survey effort when weather, access or animal behaviour depart from protocol assumptions.
