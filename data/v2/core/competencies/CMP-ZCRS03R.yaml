editorialNote:
  en: 'S2 close-out B (A8 LC with IO review; ADR-0030 §3.1 M3). Rewritten in place as the survivor for supervision of staff and volunteers: absorbs v1 3.5.2 (remote and hybrid teams) and v1 5.4.3 (volunteer programmes), which are workforce contexts of supervision; the volunteer tasks are kept with a park, land-trust and community-science context. Formation-of-others link to TX-D (v1 7.2.2) through the development-plan task (contributing) and an ATT-FOR indicator; labour-agreement indicator per the SL verdict. Crosswalk to OPM general competencies and the current executive core qualifications goes through X9, not parallel definitions (FH verdict). v1 Expert indicators naming influence or recognition are retired (B03). Needed at senior levels of every P1 role. Basis [J].'
