id: emst:core/CMP-PPCA1B6
type: Competency
prefLabel:
  en: Design and deliver environmental education programmes
altLabel:
  en:
  - Educational program development
  - Curriculum design for environmental education
  - Environmental literacy programmes
  - Outdoor education
definition:
  en: 'Designing, delivering and evaluating structured environmental learning experiences for school, youth and adult audiences: setting learning objectives, aligning curricula with the education standards that apply, designing lessons and field experiences, preparing materials, managing programme logistics and safety, assessing learning and improving the programme from evidence. Absorbs curriculum design (v1 5.4.2) and the instructional-design remainder of immersive learning (v1 2.7.2). Excludes workforce learning and formation design (v1 7.2.2, TX-D), interpretation for visitors (v1 5.1.3) and community-science protocols (v1 5.4.4).'
statement:
  en: Sets learning objectives for an audience, designs lessons, curricula and field experiences aligned with the education standards that apply, prepares materials and manages logistics and safety, delivers or supports delivery, assesses what participants learned, and revises the programme from that evidence.
