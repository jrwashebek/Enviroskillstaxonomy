definition:
  en: The capability to prepare, monitor, amend and close out contracts, grants, cooperative and intergovernmental agreements and routine purchases so that deliverables, payments and changes comply with the instrument and the procurement and financial-assistance requirements that apply. Agreement design across jurisdictions is a separate competency.
statement:
  en: Prepares scopes of work and agreement documents for contracts, grants, cooperative agreements and intergovernmental instruments; selects the instrument type that fits the relationship; monitors deliverables, invoices and compliance with terms and cross-cutting requirements; and amends or closes out agreements with a complete file.
