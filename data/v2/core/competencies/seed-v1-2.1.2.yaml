id: seed:v1-2.1.2
type: Competency
prefLabel:
  en: Analyze remotely sensed data to map and monitor environmental conditions
altLabel:
  en:
  - Remote sensing data analysis
  - Earth-observation analysis
definition:
  en: The capability to turn satellite, airborne and drone imagery and other remotely sensed data into maps and change estimates of environmental condition with a stated accuracy. It covers preprocessing, classification, change detection, accuracy assessment against independent reference data and, at higher levels, transfer testing of pretrained Earth-observation models and embeddings. Platform operation is L4 fluency.
statement:
  en: Processes and interprets satellite, airborne and drone imagery and other remotely sensed data to map land cover, vegetation, water, disturbance and change; designs accuracy assessment against independent reference data; reports accuracy by class and condition; and, where pretrained Earth-observation models or embeddings are used, tests their transfer to local ecosystems and guards against circular validation.
editorialNote:
  en: 'Rewritten by WP-04. Absorbs DC-CAND-10 (EO foundation models and embeddings as L3 indicators; model families in L4) per candidate_disposition merge-into v1:2.1.2. Accuracy assessment with independent reference data is the anchor (DC disposition). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): rewrite → core | practice | WF-ASSESS (DC). Rationale: Durable share high; absorbs DC-CAND-10 (EO foundation models at L4 indicators); accuracy assessment with independent reference data as anchor (DC disposition). Role verdicts considered: DC:change.'
