definition:
  en: The capability of a regulatory authority's inspector to plan and conduct inspections of facilities, sites or activities, gather evidence to an evidentiary standard, document findings of fact against permit conditions and rules, and start the response the enforcement policy sets. Excludes building the enforcement case, which is a separate competency.
statement:
  en: Plans and conducts announced or unannounced inspections of facilities, sites or activities against permit conditions and applicable rules; observes, measures and samples to evidentiary standard; documents findings of fact; and issues or recommends compliance assistance, notices of violation or referral as the program's enforcement response policy directs.
