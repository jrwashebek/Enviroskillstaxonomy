editorialNote:
  en: 'WP-05 (A5 SC; SL reviewed). Survivor for regulatory inspection: absorbs FC-C04, DB-C24 (part), FH-C11 (part) and the authority half of v1 6.1.2. Inspection is the modal state and local environmental task (TX EPS and NRS, PA EPS, FL DEP) [E: SL-050, SL-078, SL-059]. Field craft and statecraft are both defining (findings of fact that must hold in an enforcement proceeding; codebook E4). Indicators adapted in part from IO exemplar rewrites for v1 6.1.2. Mirror: DB-C26 (facility compliance management, regulated party). S2 close-out A (A5 SC; CR-SC-001 #3): mirror links migrated from docs/build/WP-05/mirror_links.csv. | S2 (CR-FC-001 ruling; FC as WP-08 contributor, SC review pending): field-performance anchors of merged candidate FC-C04 added: adaptation-in-place task emst:core/TSK-WKBE5ZJ (G-2), L2 beyond-checklist indicator, L1 field-measurement integrity indicator, L2 assisted imagery check (links FC-C02 ground-truthing); contributing links from the sampling task to FC-C24 and FC-C16 and from the site inspection task to v1-4.4.4-A. FC-C04 lineage is recorded here because derivedFrom takes v1 keys only.'
