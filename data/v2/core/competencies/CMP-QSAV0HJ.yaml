id: emst:core/CMP-QSAV0HJ
type: Competency
prefLabel:
  en: Ground-truth remote-sensed, modelled and AI-generated outputs in the field
definition:
  en: Planning and collecting field reference data to test maps, model outputs and automated classifications (burn severity, canopy and fuels, habitat, land cover, mortality, detections); keeping reference observations blind to predictions; coding the causes of disagreement; and feeding corrections back to analysts and model owners. Excludes accuracy statistics and model correction as such (data craft) and the stewardship of reference datasets for model training (FS-C04).
statement:
  en: Plan and collect field reference data, blind to predictions, to test maps, model outputs and automated classifications; code the field cause of each mismatch; quantify agreement with an analyst; and decide from field evidence where a product is fit for a stated management use.
