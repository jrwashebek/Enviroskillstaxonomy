id: seed:FC-C03
type: Competency
prefLabel:
  en: Adjudicate automated species detections using field-formed identification expertise
definition:
  en: Reviewing identifications suggested by automated classifiers of images, audio and genetic detections at program volume; accepting, rejecting or escalating them; recognizing look-alikes and regional or seasonal implausibility; targeting field confirmation; and documenting decisions so models can be retrained. Excludes building and evaluating the classifier (data craft) and single-record identification (species identification).
statement:
  en: Review species identifications suggested by automated image, audio and genetic detection at program volume; accept, reject or escalate each using field-formed identification expertise; target field confirmation where needed; and document decisions in a form usable for model retraining.
