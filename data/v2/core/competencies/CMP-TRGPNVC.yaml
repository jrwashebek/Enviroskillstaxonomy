id: emst:core/CMP-TRGPNVC
type: Competency
prefLabel:
  en: Environmental and natural resource economics
definition:
  en: The body of knowledge on market and non-market valuation of natural resources and environmental quality, welfare measures, discounting and the economics of externalities, as used to underpin economic analysis of environmental decisions and ecosystem-service assessment.
statement:
  en: Knowledge of market and non-market valuation methods (revealed and stated preference, benefit transfer), welfare measures, discounting, externalities and public goods, and the distributional effects of environmental decisions, as used in economic analysis of decisions, ecosystem-service assessment and budget planning.
