id: seed:v1-5.1.3
type: Competency
prefLabel:
  en: Interpret natural and cultural resources for visitors and community audiences
altLabel:
  en:
  - Environmental interpretation
  - Interpretive materials development
  - Heritage interpretation
  - Interpretive planning
definition:
  en: 'Helping visitors and community audiences find meaning in natural and cultural features through theme-based programmes, guided walks, talks, signs, exhibits and digital media: researching accurate content, designing for the audience and the site, delivering or producing the interpretation, testing it with users and evaluating whether it worked, including interpretive planning for a site. Cultural content is interpreted only from sources cleared for public use with the communities whose heritage it is. Excludes visitor orientation and safety messaging (v1 5.5.1, parks), environmental education programmes (v1 5.4.1) and communicating technical findings (v1 5.1.1).'
statement:
  en: Researches accurate natural and cultural content, builds programmes, walks, signs, exhibits and digital media around a clear theme for the intended audience and site, delivers or produces them, tests materials with users, and evaluates whether audiences made the intended connections, revising the interpretation from that evidence.
