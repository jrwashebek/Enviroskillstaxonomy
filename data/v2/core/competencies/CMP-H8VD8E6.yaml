editorialNote:
  en: 'S2 close-out A (A5 SC with SL; reviewers A3 FC and A4 DC). Survivor of the adaptive management cycle (ADR-0030 §3.1 M4): absorbs v1 3.1.5 (performance monitoring and evaluation) and the durable remainder of 3.4.5 (results and spending transparency; its dashboards and platforms go to L4). Plan, monitor, evaluate and adjust is one cycle in environmental programmes, as in the Conservation Standards (altLabel). Generic programme evaluation referenced from O*NET/ESCO (G-8); private delivery metrics stay with PS-C03. The 3.1.5 task seeds re-pointed by DE are rewritten here. Seed note kept: v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): carry → core | practice | WF-LEARN. Rationale: Adaptive management planning is environmental-specific and cited in plans for decades.'
