definition:
  en: 'The capability to run plan, monitor, evaluate and adjust cycles for environmental programmes and projects: set performance measures and decision triggers, use monitoring results to evaluate effectiveness, adjust plans and work plans when triggers are met, record what was learned and report results and spending transparently. Generic evaluation methods are referenced, not covered; private project delivery metrics are a separate competency.'
statement:
  en: Sets performance measures and decision triggers for a programme or project, uses monitoring results and new science or stakeholder input to evaluate effectiveness, adjusts plans and annual work plans when triggers are met, records lessons learned, and reports results and spending to funders and the public in a form they can check.
