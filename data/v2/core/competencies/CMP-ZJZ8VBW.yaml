id: emst:core/CMP-ZJZ8VBW
type: Competency
prefLabel:
  en: Build and validate automated detection and classification models for environmental observations
altLabel:
  en:
  - Machine learning for environmental applications
  - Computer vision and acoustic classification
definition:
  en: The capability to train, tune and validate learned models that detect, classify or count species, habitats and features in imagery, sound and sensor data, with validation against ground truth, error reported by condition and outputs fit for human review. Model architectures, libraries and pretrained detectors are L4.
statement:
  en: Trains, tunes and validates learned models that detect, classify or count species, habitats and features in imagery, acoustic recordings and sensor data; assembles and documents training data; validates against independent ground truth with spatially or temporally blocked hold-outs; reports error by class and condition; and sets thresholds so that outputs can be reviewed.
editorialNote:
  en: 'Rewritten by WP-04 with a method-neutral title (G-5); absorbs v1 2.6.1 (computer vision) and 2.6.2 (acoustic AI: thresholds and occupancy from detections; acoustic survey design and recorder deployment go to FC-C01/FC-C03). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): rewrite → core | practice | WF-ASSESS (DC). Rationale: Durable share medium; method-neutral title per G-5; absorbs computer vision (2.6.1) and acoustic AI (2.6.2) with ground-truth validation anchors (DC disposition). Role verdicts considered: DC:change.'
