id: emst:core/CMP-62YG1FR
type: Competency
prefLabel:
  en: Protect sensitive ecological, cultural and personal information in data products
altLabel:
  en:
  - Sensitive-data protection
definition:
  en: The capability to determine and document the sensitivity of rare-species locations, cultural-resource information, personal data and information held under data-holder agreements; to apply generalization, withholding or controlled access proportionate to the risk without altering the stored record; and to check derived products, including AI training sets and summaries, for leakage.
statement:
  en: Determines and documents the sensitivity of rare-species locations, cultural-resource information, personal data and information held under data-holder agreements; applies generalization, withholding or controlled access proportionate to the risk; never alters the stored record; records reasons and review dates; and checks derived products such as maps, model outputs, AI summaries and training sets for leakage.
editorialNote:
  en: 'Candidate ID DC-CAND-07 (candidate_disposition.csv). Candidate DC-CAND-07 (core-v2.0; X07). Indicators touching Tribal data or Indigenous knowledge are drafted only inside the hold (TN-C03, TN-C07; ADR-0007 §D) and are NOT authored here; this record is the actor-neutral technical execution layer and must be co-designed with TN. Observable practices follow GBIF sensitive-data guidance (documented reason and review date; generalize only the distributed copy) [E: DC-029].'
