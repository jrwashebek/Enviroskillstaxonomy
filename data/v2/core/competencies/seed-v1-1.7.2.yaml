prefLabel:
  en: Plan assisted migration and managed relocation of species and genotypes
altLabel:
  en:
  - Assisted migration and managed relocation
definition:
  en: The capability to evaluate candidate species, populations and situations for assisted migration, seed transfer or translocation, weigh ecological, genetic and invasion risks against benefits, and design implementation and monitoring protocols that test outcomes.
statement:
  en: Evaluates candidate species, populations and sites for assisted migration, seed transfer or translocation; weighs ecological, genetic, disease and invasion risks against expected benefits under projected climates; designs implementation and monitoring protocols that test outcomes; and documents decisions for review.
