id: emst:core/CMP-A140WER
type: Competency
prefLabel:
  en: Operate small boats and work safely on water in aquatic, coastal and marine field settings
definition:
  en: Operating motorboats and small vessels for field work; planning around tides, currents, weather, ice and cold water; deploying and recovering sampling gear from vessels; wading safely; and managing person-overboard, capsize and other vessel emergencies. Boat operator certification is a credential gate. Excludes crewing vessels at sea and navigation of large vessels.
statement:
  en: Plan and run field work on water around tides, currents, weather and cold water; operate small boats; deploy and recover sampling gear from vessels; wade safely; and manage vessel emergencies such as capsize and person overboard.
