definition:
  en: Observes trainees and staff performing position tasks in the required context, rates the performance against written standards on an entrustment-supervision scale, gives corrective feedback, mentors through supervised repetitions, and documents qualification or entrustment decisions that a second evaluator would reproduce. Excludes designing the qualification system (the TX-D formation-design competency) and personnel supervision.
statement:
