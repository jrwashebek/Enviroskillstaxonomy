id: seed:FS-C09
type: Competency
prefLabel:
  en: Own and steward a public environmental technology product
altLabel:
  en:
  - Product management for permitting and case-management systems
  - Public digital service product ownership
  - Permitting technology product owner
definition:
  en: 'Owning a public-sector environmental technology product (a permitting or case-management system, a monitoring data portal or a public reporting service) over its life: researching how practitioners, applicants and the public use it, keeping a prioritized backlog and roadmap tied to programme outcomes, writing acceptance criteria, checking releases against data standards and records requirements, deciding what ships, and leading adoption and change with the staff who depend on it. Excludes procuring and accepting AI and analytics services (DC-CAND-20), governing enterprise data and AI portfolios (DC-CAND-21), designing decision-support products for one decision (DC-CAND-22) and engineering data pipelines (DC-CAND-04).'
statement:
  en: Researches how staff, applicants and the public use an environmental technology product, keeps a prioritized backlog and roadmap tied to programme outcomes, writes acceptance criteria, checks releases against data standards and records requirements, decides what ships, and leads adoption with the staff who depend on it, so that the system serves the programme's legal and public duties.
