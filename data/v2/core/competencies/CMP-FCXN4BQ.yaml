id: emst:core/CMP-FCXN4BQ
type: Competency
prefLabel:
  en: Interpret and question environmental data products in everyday work
altLabel:
  en:
  - Environmental data literacy
definition:
  en: The capability to read maps, charts, dashboards, model outputs and monitoring summaries correctly and to recognize their limits before relying on them. It covers what was measured, where, when, how and at what resolution. It excludes producing the analysis, which belongs to data-craft practice competencies.
statement:
  en: Reads environmental data products such as maps, charts, dashboards, model outputs and monitoring summaries correctly; identifies what was measured, where, when, by whom and at what resolution; recognizes the limits of a product before relying on it; and asks the questions that expose misuse, such as scale, sample, baseline and missing data.
