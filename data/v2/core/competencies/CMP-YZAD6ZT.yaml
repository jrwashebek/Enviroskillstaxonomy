editorialNote:
  en: 'WP-05 (A5 SC). Proportionate engagement design when participation is discretionary (SC verdict on 5.2.x); pairs with the v1 5.3.4 split A record (accessible, inclusive engagement). Under department procedures adopted in 2026, lower levels of review need no public involvement, so engagement becomes a judgment someone must make and defend [E: SC-038]. Receives v1 6.4.4 T1 (input process design). Government-to-government consultation is held content (TN-C02) and kept separate. Indicators adapted from SC-A-C06-1..4.'
