definition:
  en: The capability to decide when, with whom and how to engage the public and interested parties beyond what a procedure requires, to document why, and to close the loop with participants. Consultation owed to other governments is a distinct relationship and is not covered here.
statement:
  en: Decides when, with whom and how to engage the public and interested parties beyond legal minimums, based on legitimacy risk, the interests affected, community relationships and litigation exposure; documents the rationale; runs the engagement; and shows participants what their input changed.
