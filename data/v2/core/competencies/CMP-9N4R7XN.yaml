id: emst:core/CMP-9N4R7XN
type: Competency
prefLabel:
  en: Design and evaluate behaviour-change programmes for environmental outcomes
altLabel:
  en:
  - Social marketing for sustainability
  - Community-based social marketing
  - Environmental behaviour change
  - Environmental psychology and behaviour-change theory
definition:
  en: 'Designing, piloting and evaluating programmes that change specific behaviours with environmental consequences (water and energy use, waste sorting, wildlife feeding, spread of invasive species, fire-safe practices): selecting target behaviours, researching barriers and motivators with the audience, choosing behaviour-change tools grounded in theory, piloting with a comparison, and measuring behaviour rather than awareness. Behaviour-change theory is held as this competency''s knowledge statements (from v1 5.6.1). Excludes general social science research (v1 5.6.2), public information (v1 5.1.1) and environmental education (v1 5.4.1).'
statement:
  en: Selects target behaviours with environmental consequences, researches the audience's barriers and motivators, designs interventions with behaviour-change tools grounded in theory, pilots them with a comparison group, and measures behaviour rather than awareness before scaling, revising or stopping the programme.
