id: emst:core/CMP-X2Y7C07
type: Competency
prefLabel:
  en: Recognize and assess ecosystems that have crossed into novel states
definition:
  en: Judging from field evidence, reference conditions and records whether an ecosystem has crossed a threshold into a new state; assessing the function and value of novel assemblages; and advising whether restoration, intervention or managed transformation is feasible. Excludes climate projection modelling as such.
statement:
  en: Evaluate from field and historical evidence whether an ecosystem has moved beyond its historical range of variability, assess the ecological function and conservation value of novel species assemblages, and judge when restoration to historical conditions is feasible.
