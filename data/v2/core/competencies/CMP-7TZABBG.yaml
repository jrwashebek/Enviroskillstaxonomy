id: emst:core/CMP-7TZABBG
type: Competency
prefLabel:
  en: Work alongside landowners, permittees, volunteers and communities on the land
definition:
  en: 'Conducting joint field visits and reading sites together with landowners, permittees, ranchers, foresters, volunteers and community members; reconciling local observations with protocol data; explaining field findings and their limits face to face; and leading volunteers in field work. The field side of engagement: permits, agreements and legal duties that may follow are statecraft, and relations between governments are outside this competency.'
statement:
  en: Conduct joint field visits with landowners, permittees, volunteers and community members; read the site together and reconcile their observations with protocol data; explain field findings and their limits face to face; and lead volunteers safely in field work.
