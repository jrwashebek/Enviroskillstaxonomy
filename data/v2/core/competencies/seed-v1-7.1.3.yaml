  v1Title: Regulatory professional integrity
  v1Description: Maintaining independent professional judgment and transparent reporting practices when institutional pressures conflict with obligations to regulatory processes, the public, and ecological systems.
  levels:
  - v1Level: foundational
    mapsTo: L1
    v1Key: v1:7.1.3:foundational
    knowledge: Distinguishes professional obligations to employers from obligations to regulatory processes, the public, and ecological systems; recognizes when these obligations are in tension; understands the difference between acceptable professional discretion and inappropriate institutional pressure
    application: Identifies potential conflicts of interest in assigned work; follows established disclosure procedures with guidance
    knowledgeApplicationOrigin: database
    indicators:
    - v1Key: v1:7.1.3:foundational:I1
      n: 1
      text: Explains the distinction between an employer's legitimate direction of professional work and pressure that compromises regulatory or scientific integrity
      origin: database
    - v1Key: v1:7.1.3:foundational:I2
      n: 2
      text: Identifies common situations where institutional interests and regulatory obligations come into tension (timeline pressure on impact assessment findings, client interests in permitting outcomes, funder interests in monitoring results)
      origin: database
    - v1Key: v1:7.1.3:foundational:I3
      n: 3
      text: Locates relevant professional codes of ethics and scientific integrity policies applicable to their disciplinary context
      origin: database
    - v1Key: v1:7.1.3:foundational:I4
      n: 4
      text: Understands disclosure requirements for conflicts of interest in regulatory submissions and public documents
      origin: database
  - v1Level: intermediate
    mapsTo: L2
    v1Key: v1:7.1.3:intermediate
    knowledge: Applies professional ethics frameworks to specific regulatory contexts; understands reporting obligations when institutional misconduct is observed; navigates conflicts of interest with transparency
    application: Independently assesses and discloses conflicts of interest; documents institutional pressures affecting professional judgment; seeks guidance when obligations conflict
    knowledgeApplicationOrigin: database
    indicators:
    - v1Key: v1:7.1.3:intermediate:I1
      n: 1
      text: Applies disciplinary codes of ethics and NEPA scientific integrity requirements to specific contested situations
      origin: database
    - v1Key: v1:7.1.3:intermediate:I2
