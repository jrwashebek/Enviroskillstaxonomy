      origin: database
    - v1Key: v1:7.1.3:intermediate:I3
      n: 3
      text: Communicates uncertainty and dissenting findings honestly in regulatory submissions, even when findings are inconvenient to organizational interests
      origin: database
    - v1Key: v1:7.1.3:intermediate:I4
      n: 4
      text: Identifies escalation pathways when internal disclosure processes are inadequate to resolve integrity conflicts
      origin: database
  - v1Level: advanced
