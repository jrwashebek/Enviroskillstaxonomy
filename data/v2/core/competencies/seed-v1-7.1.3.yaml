definition:
  en: The capability to produce and report regulatory and scientific findings that represent the evidence, including uncertainty, contrary evidence and AI assistance, to disclose conflicts, and to use documented channels when pressure conflicts with professional obligations. Assessed through work products and records, never as a trait.
