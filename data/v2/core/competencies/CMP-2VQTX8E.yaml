definition:
  en: The capability to recognize that one's own cultural assumptions shape how one communicates and works, to seek and follow the norms and protocols of the people one works with, and to change conduct when told it caused harm, in meetings, site visits and teams. Relations owed to other governments and inclusive programme design are separate competencies.
statement:
  en: Asks about and follows the communication norms and protocols of the communities and colleagues one works with, adapts language and meeting practice to them, seeks guidance from the people a community recognizes as cultural advisers before engagement or site visits, and changes conduct when told it caused offence or harm.
