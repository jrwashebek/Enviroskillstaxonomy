prefLabel:
  en: Disturbance ecology
definition:
  en: The body of knowledge on how fires, floods, storms, droughts, insects and disease affect ecosystems, on disturbance regimes and their history, and on how systems resist, recover from or reorganize after disturbance.
statement:
  en: Knowledge of disturbance agents and regimes (frequency, severity, extent and seasonality), their history at a site, interactions among disturbances, and the resistance, recovery and reorganization of ecosystems after disturbance, as used by fire, restoration, hazards and monitoring work.
