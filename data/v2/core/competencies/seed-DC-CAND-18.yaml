prefLabel:
  en: Curate authoritative guidance and knowledge corpora for retrieval
altLabel:
  en:
  - Curate authoritative knowledge corpora for retrieval-augmented AI
  - Knowledge management systems
definition:
  en: The capability to select, version and maintain the documents, protocols, datasets and metadata that staff and AI assistants retrieve from, marking authority, currency and supersession, removing withdrawn guidance, testing retrieval quality and assigning ownership so that answers come from the current authoritative source.
statement:
  en: Selects, versions and maintains the documents, protocols, datasets and metadata that staff and AI assistants retrieve from; marks authority, currency and supersession; removes withdrawn guidance; tests retrieval quality against known questions; and assigns ownership so that assistants and searches answer from the current, authoritative source.
