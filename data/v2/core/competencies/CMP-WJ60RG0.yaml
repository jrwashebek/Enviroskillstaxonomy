definition:
  en: The capability to express one's own or another person's competencies and experience in the terms a different sector actor's hiring system credits (state class specifications, federal qualification standards and specialized-experience language, private job architectures), with evidence its assessors accept. Rating applicants inside a hiring system is a separate competency.
statement:
  en: Maps a person's competencies and experience to a target employer's classification, qualification or job-architecture terms; marks which are credited, which need evidence and which are gaps; rewrites the experience record against the target's requirements; assembles evidence assessors accept; and states the basis and uncertainty of each equivalence claimed.
