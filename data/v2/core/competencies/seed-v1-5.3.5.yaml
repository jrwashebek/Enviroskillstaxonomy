definition:
  en: 'The capability to build and keep working relationships with communities that bear the effects of environmental decisions, so that they shape priorities, analyses and actions over time: identifying and reaching the people affected, sharing information and decision timelines, supporting community-led action and keeping commitments. Distributional analysis and relations owed to other governments are separate competencies.'
statement:
  en: Identifies the communities that bear a decision's effects and who speaks for them, builds relationships before decisions are framed, shares information and timelines in usable forms, involves communities in setting priorities and reviewing analyses, supports community-led action, and keeps and reports on the commitments made.
