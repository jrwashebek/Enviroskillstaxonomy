      origin: database
    - v1Key: v1:7.2.3:foundational:I3
      n: 3
      text: Applies a structured decision checkpoint before accepting AI outputs in high-consequence contexts — naming the independent evidence they are drawing on
      origin: database
    - v1Key: v1:7.2.3:foundational:I4
      n: 4
      text: Recognizes when time pressure, organizational culture, or workflow design is creating conditions for automation bias to operate
