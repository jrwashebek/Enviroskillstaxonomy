    mapsTo: L1
    v1Key: v1:7.2.3:foundational
    knowledge: Understands automation bias as a professional risk — the tendency to defer to AI outputs even when independent judgment should override; understands automation skepticism as the symmetric failure; recognizes that calibration requires active effort and deteriorates without deliberate maintenance
    application: Identifies situations where they may be at risk of automation bias; applies explicit decision checkpoints before accepting AI outputs in high-consequence contexts
    knowledgeApplicationOrigin: database
    indicators:
