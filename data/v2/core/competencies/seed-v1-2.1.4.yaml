id: seed:v1-2.1.4
type: Competency
prefLabel:
  en: Conduct spatial analysis and modelling of environmental data
altLabel:
  en:
  - Spatial analysis and modeling
  - GIS analysis
definition:
  en: 'The capability to answer environmental questions with spatial data: choosing data models, coordinate reference systems and topology rules, running overlay, proximity, connectivity, suitability, terrain and surface analyses, and building spatial models whose assumptions and accuracy are stated. Operating a particular GIS product is L4 fluency.'
statement:
  en: 'Answers environmental questions with spatial data: chooses data models, coordinate reference systems and topology rules; runs overlay, proximity, connectivity, suitability, terrain and surface analyses; builds spatial models whose assumptions and positional and attribute accuracy are stated; and documents workflows so that results can be reproduced and defended.'
editorialNote:
  en: 'Rewritten by WP-04. Absorbs the durable core of v1 2.1.1 (spatial data models, reference systems, topology, query logic; GIS platforms to L4 seed:tool-gis-platforms) and v1 2.7.5 (terrain and surface modelling). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): rewrite → core | practice | WF-ASSESS (DC). Rationale: Durable share high; absorbs the durable core of 2.1.1 and 3D terrain modelling (2.7.5); tool names to L4 (DC disposition). Role verdicts considered: DC:change.'
