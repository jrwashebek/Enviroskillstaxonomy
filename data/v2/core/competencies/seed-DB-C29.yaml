id: seed:DB-C29
type: Competency
prefLabel:
  en: Communicate environmental and health risks under uncertainty
altLabel:
  en:
  - Risk and crisis communication
  - Public advisories and notices
definition:
  en: Designs and delivers risk and crisis communication (advisories, do-not-drink and boil-water notices, smoke and heat messages, cleanup and exposure updates) that is accurate, timely, actionable and understood by affected publics, states uncertainty plainly, is tested for comprehension, and reaches people in the languages they use. Excludes environmental education and interpretation, and the underlying risk assessment.
statement:
  en: Prepares and delivers risk and crisis messages that state what is known, what is uncertain and what people should do, tailored to affected audiences and their languages, tested for comprehension, coordinated with partner agencies, and updated as evidence changes.
