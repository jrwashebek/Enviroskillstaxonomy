id: seed:v1-4.1.1
type: Competency
prefLabel:
  en: Sample and assess vegetation using standardized field protocols
definition:
  en: Establishing plots and transects, identifying plants and estimating cover, density, structure and condition to a program's measurement-quality objectives, and judging when site conditions require the protocol to be adapted. Includes observer calibration and field validation of remote vegetation products. Excludes trend analysis (data craft) and identification as such (species identification).
statement:
  en: Establish vegetation plots, identify plants and estimate cover, density and condition to the program's measurement-quality objectives; adapt sampling when site conditions depart from protocol assumptions; and test remote-sensed vegetation products against plot data.
