id: emst:core/CMP-92513ZA
type: Competency
prefLabel:
  en: Calibrate field observers and run field measurement quality assurance
definition:
  en: Running observer calibration, hot, cold and blind check re-measurements and field audits; computing and interpreting agreement against measurement-quality tolerances; and retraining or reassigning observers, so that field data and condition scores reflect real change rather than observer differences. Includes calibrating assessors who score condition, surveys or credit metrics. Excludes reliability statistics as a discipline.
statement:
  en: Run observer calibration, blind check re-measurements and field audits; compute and interpret agreement against measurement-quality tolerances; and retrain or reassign observers and assessors, so that field data and condition scores reflect real change rather than observer differences.
