  en: 'WP-05 (A5 SC). Survivor: absorbs FS-C03 (AI provenance in the record) and SC-C05 (supervise AI-assisted drafting and comment analysis for legal defensibility); SC-C05''s legal-adequacy anchors survive as indicators here and in the SC enactment of AI-output validation (DC-CAND-13, WP-04) (ADR-0025). Receives the record half of v1 6.4.4 (split with DC-CAND-16). Under substantial deference the reasoned explanation is the main defense; about 0.4 percent of submissions on one 2025 docket were unique, so merged comment groups can hide the comment that matters [E: V2-02, SC-011]. Indicators adapted from SC-A-C02-1..4 and SC-A-C05-1..4.'
