id: seed:DB-C06
type: Competency
prefLabel:
  en: Protect operational technology at environmental utilities and facilities
altLabel:
  en:
  - Operational-technology cybersecurity for environmental systems
definition:
  en: 'The capability to keep the operational technology that runs environmental plants, monitoring networks and facilities secure and recoverable: knowing what is connected, controlling remote access and changes, recognizing and reporting anomalous control or sensor behaviour, and running incident response with manual fallback. Security products are L4.'
statement:
  en: 'Keeps operational technology at environmental utilities, monitoring networks and facilities secure and recoverable: maintains an inventory of connected assets and their network zones; follows and enforces remote-access, patching and change procedures; recognizes and reports anomalous control or sensor behaviour; and runs incident-response drills with tested manual fallback.'
