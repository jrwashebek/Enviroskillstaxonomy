definition:
  en: The capability of a supervisor or hiring lead to recruit, select, assign, develop and recognize staff by job-related criteria applied the same way to everyone; to find and remove recruitment and workplace barriers that are not job-related; to provide requested accommodations; and to check outcomes for any stage where the criteria were not applied consistently. Writing assessment content and general supervision are separate competencies.
statement:
  en: Recruits through sources that reach qualified applicants the unit has not reached, removes requirements and barriers that are not job-related, applies the same job-related criteria to every applicant and team member in selection, assignments, development and recognition, arranges requested accommodations, and reviews outcomes for any stage where criteria were applied inconsistently.
