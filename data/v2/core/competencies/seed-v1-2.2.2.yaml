id: seed:v1-2.2.2
type: Competency
prefLabel:
  en: Analyze environmental data statistically and interpret the results
altLabel:
  en:
  - Statistical analysis and interpretation
  - Time series analysis
definition:
  en: The capability to choose, apply and interpret statistical methods for environmental data, including designed comparisons, regression, mixed and spatial models, trend and time-series analysis, with honest treatment of assumptions, dependence, detection and uncertainty. Statistical software is L4.
statement:
  en: Chooses, applies and interprets statistical methods for environmental data, including designed comparisons, regression, mixed and spatial models, trend and time-series analysis; checks assumptions such as independence and detection; states effect sizes with uncertainty; and explains what the results do and do not support.
