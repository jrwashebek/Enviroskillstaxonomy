id: emst:core/CMP-A8ECZD7
type: Competency
prefLabel:
  en: Elicit, document and transfer tacit and institutional knowledge before people leave
altLabel:
  en:
  - Capture and transfer critical institutional and place-based knowledge before staff separate
  - Structured knowledge handover
  - Cross-generational knowledge exchange
  - Knowledge continuity
definition:
  en: Identifies knowledge held by one or a few people that the work depends on (site histories, decision rationales, relationships, local protocols, field cues), elicits it through structured interviews, field walk-throughs and annotated records, transfers it through paired work and planned handover, and verifies that successors can apply it, at separation, retirement, reassignment and when work moves between organizations. Excludes general records management and the curation of retrieval corpora for AI tools (a Data Craft practice competency).
statement:
  en: Identifies critical knowledge held by one or a few people, elicits it through structured interviews, field walk-throughs and annotated records, transfers it through paired work and planned handover, and verifies that successors can apply it before the holder leaves or the work moves to another organization.
