type: Competency
prefLabel:
  en: Read site history and reference conditions from landscape evidence
definition:
  en: Interpreting land-use legacies, disturbance history and reference conditions from field evidence (fire scars, stumps, soil horizons, legacy structures, vegetation patterns, channel features) and reconciling them with records and with knowledge that landowners and long-tenure practitioners choose to share. Knowledge held by others is recognized and attributed, never codified. Excludes paleoecological laboratory methods.
