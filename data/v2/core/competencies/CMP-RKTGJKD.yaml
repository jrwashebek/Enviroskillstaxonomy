definition:
  en: The capability to decide which level of environmental review a proposed action requires and to record that decision so it can be followed and defended. Covers exclusion screening, extraordinary-circumstance review, adoption of another agency's exclusion where allowed, significance determinations and acceleration options. Excludes conducting the review itself.
statement:
  en: Screens a proposed action against the deciding agency's exclusion categories and extraordinary-circumstance criteria, decides whether an excluded action, an assessment or a full impact statement is required, weighs available acceleration options, and documents the determination in a structured form that the responsible official and a reviewing court can follow.
