definition:
  en: The capability of a regulated organization to determine which mandatory disclosure and reporting regimes apply to it, to produce controlled, assurance-ready data and narrative, and to manage regulator, assurance-provider and investor relationships as regimes start, change or are enjoined. Reporting frameworks are L4 tools; regimes are L5 instruments.
statement:
  en: Determines which mandatory disclosure and reporting regimes apply to an organization across jurisdictions, builds controlled processes that produce assurance-ready data, prepares for external assurance, and manages regulator, assurance-provider and investor relationships as rules start, change or are enjoined.
