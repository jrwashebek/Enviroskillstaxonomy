id: emst:core/CMP-YS9PMG4
type: Competency
prefLabel:
  en: Verify greenhouse gas assertions and environmental claims independently
altLabel:
  en:
  - Greenhouse gas validation and verification
definition:
  en: 'The capability to plan and conduct independent validation and verification of greenhouse gas inventories, offset and removal projects and environmental claims against recognized standards: risk-based sampling, site visits, materiality thresholds, evidence evaluation and independence safeguards, ending in a reasoned opinion. Accredited-verifier status is a Credential.'
statement:
  en: 'Plans and conducts independent validation and verification of greenhouse gas inventories, offset and removal projects and environmental claims against recognized standards: assesses risk, sets materiality, samples evidence and sites, visits facilities or project areas, evaluates misstatements, maintains independence, and issues a reasoned opinion with its basis.'
editorialNote:
