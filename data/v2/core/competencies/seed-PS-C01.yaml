id: seed:PS-C01
type: Competency
prefLabel:
  en: Manage client and partner scope for environmental work
altLabel:
  en:
  - Manage client relationships and scope for environmental services
  - Statement-of-work management
  - Change-order management
definition:
  en: Defines what a client, sponsor or partner needs, negotiates scope, assumptions, exclusions and acceptance criteria, manages expectations, and controls scope changes through documented change orders or modifications, for environmental studies, permits, compliance services and partnership work. On the public side the same performance is enacted by contracting officers' technical representatives and agreement managers. Excludes pricing and proposal writing and delivery to budget and schedule (separate TX-F competencies).
statement:
  en: Defines the client's or partner's needs, negotiates scope, assumptions, exclusions and acceptance criteria, and controls changes through documented change orders or modifications, so that both parties agree what will be delivered, by when and at what cost, for environmental studies, permits, compliance and partnership work.
