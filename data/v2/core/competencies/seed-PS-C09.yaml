prefLabel:
  en: Build organizational and jurisdictional greenhouse gas inventories for disclosure and reporting
altLabel:
  en:
  - Build corporate greenhouse gas inventories across Scopes 1-3 for multiple disclosure regimes
  - Prepare greenhouse gas inventories for organizations and jurisdictions
definition:
  en: 'The capability to build greenhouse gas inventories for organizations and jurisdictions: setting boundaries, collecting activity data, selecting emission factors and estimation methods, compiling value-chain emissions, quantifying uncertainty, documenting data quality and controls, and mapping one inventory to several disclosure and reporting requirements. Accounting standards are L4; disclosure rules are L5.'
statement:
  en: 'Builds greenhouse gas inventories for organizations and jurisdictions: sets organizational and operational boundaries; collects activity data; selects emission factors and estimation methods; compiles value-chain emissions; quantifies uncertainty; documents data quality, controls and an audit trail; and maps one inventory to several disclosure and reporting requirements.'
editorialNote:
