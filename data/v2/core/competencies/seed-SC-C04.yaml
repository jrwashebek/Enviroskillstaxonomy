definition:
  en: The capability of the deciding agency to set the scope and standards for environmental documents that project sponsors or their contractors prepare, to evaluate their adequacy and objectivity, and to document its own independent evaluation before adopting them. Excludes preparing the document, which is the service-provider enactment of environmental impact review.
statement:
  en: Sets the scope, standards and independence safeguards for environmental documents prepared by project sponsors or their contractors, evaluates their adequacy and objectivity, requires corrections, and documents the agency's own independent evaluation before the agency adopts the document as its own.
