id: seed:DC-CAND-03
type: Competency
prefLabel:
  en: Design monitoring and sampling for valid environmental inference
altLabel:
  en:
  - Monitoring design
definition:
  en: The capability to specify monitoring questions, indicators, sampling frames, sample sizes and detection methods so that results support the inferences and decisions they are meant to inform, including power to detect change and handling of imperfect detection, across field crews, sensors, remote sensing, environmental DNA, acoustic and community-science methods.
statement:
  en: Specifies monitoring questions, indicators, sampling frames, sample sizes and detection methods, whether field crews, sensors, remote sensing, environmental DNA, acoustic recorders or community science, so that results support the inferences and decisions they inform; estimates power to detect change; plans for imperfect detection; and ties monitoring to plan requirements and decision triggers.
editorialNote:
  en: 'Survivor (candidate_disposition DC-CAND-03): absorbs C-LM-01 (plan-level monitoring design, plan-requirement anchors P-LM-08) and the design content of v1 2.2.2. FC secondary: indicator selection and site representativeness need field judgment. Monitoring is the largest structured data demand in land-management plans (3,843 monitoring components) [E: DC-035].'
