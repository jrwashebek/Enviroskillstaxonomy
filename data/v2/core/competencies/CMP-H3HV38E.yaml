  en: Lead field crews and transfer field judgment to novices
definition:
  en: 'Leading small field crews day to day (matching tasks to skill, briefings and after-action reviews, early checks of novice work) and deliberately transferring field judgment: making cues explicit, designing graduated exposure across sites and seasons, protecting unaided practice where aids compress learning, and deciding on evidence when a novice is ready for independent work. The field-craft enactment of formation of others (TX-D). Excludes personnel administration.'
statement:
