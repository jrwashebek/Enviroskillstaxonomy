type: Competency
prefLabel:
  en: Drive and operate field vehicles safely on unpaved roads and off road
definition:
  en: 'Operating four-wheel-drive trucks, utility vehicles and all-terrain vehicles on unpaved roads and off road for field work: pre-trip inspection, loading and securing equipment, reading road and terrain conditions, recovering stuck vehicles safely, towing trailers, and deciding when a route is unsafe. Driver licences and off-highway vehicle authorizations are gates. Excludes heavy equipment for ecological treatments (worklands module).'
statement:
  en: Inspect, load and drive field vehicles on unpaved roads and off road; read road, weather and terrain conditions; recover stuck vehicles safely; tow trailers; and turn back when a route is unsafe.
