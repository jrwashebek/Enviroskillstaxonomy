id: seed:DC-CAND-13
type: Competency
prefLabel:
  en: Validate AI-generated work products before professional use
altLabel:
  en:
  - Validate AI-generated environmental analyses before professional use
  - AI-output validation
definition:
  en: The capability to check AI-produced identifications, maps, classifications, summaries, regulatory analyses and drafts against independent evidence before they are used in professional work, at the volume the work produces, and to record what was checked and changed. It excludes designing review architectures and setting model risk tiers, which are data-craft specialist competencies.
statement:
  en: Checks AI-produced species identifications, maps, classifications, summaries, regulatory analyses and drafts against independent evidence such as field observation, source documents, applicable legal text and expert knowledge; uses structured sampling when volumes are large; and records what was checked, what was changed and the confidence the validation supports.
editorialNote:
  en: 'Candidate ID DC-CAND-13 (candidate_disposition.csv). TX-A universal floor: every role profile carries L1 on AI-output validation (ADR-0025 §1). Survivor of the validation cluster: absorbs v1 7.2.1, FS-C01 and FH-C15 (candidate_disposition merge-into DC-CAND-13). Craft enactments: FC (ecological plausibility and ground truth), DC (validation at volume), SC (legal sufficiency, record provenance, authorization of oversight; split part of v1 7.1.4).'
