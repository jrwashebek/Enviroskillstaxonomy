definition:
  en: The capability to assemble observation streams, process models, learned emulators or hybrids, data assimilation and update cycles into operational forecast or what-if systems; define their fitness for the decisions served; validate them continuously under changing conditions; manage versions, access and retirement; and communicate when the system should not be trusted.
statement:
