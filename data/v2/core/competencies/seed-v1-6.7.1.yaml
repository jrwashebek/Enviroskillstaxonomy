id: seed:v1-6.7.1
type: Competency
prefLabel:
  en: Assess human health risks from environmental exposures
altLabel:
  en:
  - Environmental health risk assessment
definition:
  en: The capability to evaluate potential health effects of environmental exposures to chemicals, pollutants and other hazards through hazard identification, exposure assessment, dose-response and risk characterization, with stated uncertainty, and to communicate findings to affected communities and decision-makers. Jurisdiction-specific methods and screening levels are supplied by enactments.
statement:
  en: 'Evaluates potential health effects of environmental exposures to chemicals, pollutants and other hazards: identifies hazards and exposure pathways, estimates exposures, applies dose-response information, characterizes risk with stated uncertainty and sensitive populations, and communicates findings to affected communities and decision-makers.'
editorialNote:
  en: 'Rewritten by WP-04 (DC lane: v1 craft primary DC, used only to route the seed; v1 tags are prior evidence, not v2 values). Carried (wording rewritten); recurs in remediation, air, chemicals and environmental health (v1_disposition 6.7.1). Required methods vary by jurisdiction and programme (jurisdictionVariable indicators). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): carry → core | practice | WF-ASSESS. Rationale: Human health risk assessment recurs in remediation, air, chemicals and environmental health (G-4). Role verdicts considered: none recorded.'
