id: seed:DC-CAND-20
type: Competency
prefLabel:
  en: Specify, evaluate and accept AI and analytics services in procurement
altLabel:
  en:
  - AI and analytics procurement
definition:
  en: The capability to write requirements and acceptance tests for AI and analytics services, require model and data documentation and public data-rights terms, evaluate vendor claims against local evidence, and monitor contracted performance through to exit. Contracting authority stays with the warranted official.
statement:
  en: Writes requirements and acceptance tests for AI and analytics services; requires model and data documentation, data-rights terms that bar training on public or partner data without consent, portability and exit provisions, performance monitoring and change notification; evaluates vendor claims against a local evaluation set; and recommends acceptance or rejection of deliverables against the tests.
editorialNote:
  en: 'DC specialist responsible-AI competency; primary work function WF-RESOURCE (candidate_disposition). Survivor: absorbs FS-C10. Federal acquisition memos are L5 instruments; documentation formats (model, system and data cards) are L4.'
