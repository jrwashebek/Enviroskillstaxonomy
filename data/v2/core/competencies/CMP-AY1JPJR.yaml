id: emst:core/CMP-AY1JPJR
type: Competency
prefLabel:
  en: Calibrate trust in AI and automation
altLabel:
  en:
  - Calibrating professional judgment in human-AI collaboration
definition:
  en: The capability to keep an accurate, evidence-based view of when specific AI and automated tools can be trusted, qualified or overridden in one's own and a team's work, avoiding both automation bias and unwarranted rejection, and to update that view from recorded outcomes. It excludes organizational evaluation programmes (evaluation sets and benchmarking).
statement:
  en: Maintains an evidence-based calibration of when to trust, qualify or override the outputs of specific AI and automated tools across operating conditions, avoiding both over-trust and unwarranted rejection; applies explicit decision checkpoints in high-consequence work; and updates that calibration from recorded outcomes of past trust decisions.
editorialNote:
  en: 'Rewritten by WP-04 (ADR-0025 §1 TX-A: ''Calibrate trust in AI and automation''). Operations enactment is the DB practice competency emst:core/CMP-Q825DY3 (supervise automated and AI-assisted process control). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): carry → core | transversal | TX-A. Rationale: Reliability profiling and documented override decisions; carried with observable anchors and an operations enactment (DB-C03) (DC, DB, IO, LC, CM, CA verdicts). Role verdicts considered: DC:carry|DB:carry|IO:carry|LC:carry|CM:carry|CA:carry.'
