editorialNote:
  en: 'WP-05 (A5 SC). Survivor: absorbs FS-C03 (AI provenance in the record) and SC-C05 (supervise AI-assisted drafting and comment analysis for legal defensibility); SC-C05''s legal-adequacy anchors survive as indicators here and in the SC enactment of AI-output validation (DC-CAND-13, WP-04) (ADR-0025). Receives the record half of v1 6.4.4 (split with DC-CAND-16). Under substantial deference the reasoned explanation is the main defense; about 0.4 percent of submissions on one 2025 docket were unique, so merged comment groups can hide the comment that matters [E: V2-02, SC-011]. Indicators adapted from SC-A-C02-1..4 and SC-A-C05-1..4. S2 close-out A (A5 SC; reviewer A4 DC, DC-CAND-07 boundary; ADR-0030 §3.1 M5): absorbs v1 3.3.5 (records management) and, through it, 2.5.2 (collaborative document management). Records integrity, retention, litigation holds and public-records disclosure attach to the decision record; the definition gains one clause. Generic filing-system design is referenced (G-8) and tool training goes to L4; the six re-pointed task seeds are rewritten to the durable record work. Protecting sensitive information inside data products stays with DC-CAND-07.'
