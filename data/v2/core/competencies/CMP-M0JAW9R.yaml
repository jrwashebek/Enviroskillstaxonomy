definition:
  en: The capability to document the reasons for a decision as it is made, including alternatives, boundaries, responses to substantive comments, consultation outcomes and the provenance of analyses (AI-assisted content included), so that a court, inspector general or successor can reconstruct why the decision was reasonable, and to keep those records intact, retained and disclosable under retention schedules, litigation holds and public-records laws.
statement:
