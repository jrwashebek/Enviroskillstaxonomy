prefLabel:
  en: Construct and maintain trails to sustainable design standards
definition:
  en: Laying out, constructing and maintaining trails and their drainage, tread, crossings and structures (including rock work and retaining walls) to sustainable design standards with hand and power tools, reading terrain, soils and water to prevent erosion and resource damage. Excludes trail system planning (parks and forest modules) and transportation engineering.
statement:
  en: Construct and maintain trail tread, drainage, crossings and rock structures to sustainable design standards, reading terrain, soils and water flow in place so that trails provide access without erosion or resource damage.
