definition:
  en: The capability to design public engagement, programmes, facilities and information so that every affected or eligible member of the public can find, reach, understand and take part in them, including people with disabilities and people with limited proficiency in the main language, and to check participation for groups the design is not reaching. Deciding when to engage beyond legal minimums is a separate competency.
statement:
  en: 'Designs engagement, services, facilities and information so that affected and eligible people can find, reach, understand and take part in them: meets accessibility standards, provides accommodations, interpretation and translation, chooses times, places and channels that fit the people affected, and checks participation for groups not being reached.'
