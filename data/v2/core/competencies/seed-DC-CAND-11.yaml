id: seed:DC-CAND-11
type: Competency
prefLabel:
  en: Quantify and communicate uncertainty for environmental decisions
altLabel:
  en:
  - Uncertainty communication
definition:
  en: The capability to characterize uncertainty from measurement, sampling, model structure, parameters, scenarios and AI error, and to express it in forms decision-makers can use, stating what would change the conclusion and keeping caveats under pressure to drop them.
statement:
  en: Characterizes uncertainty from measurement, sampling, model structure, parameters, scenarios and AI error; quantifies the dominant sources; expresses uncertainty in forms decision-makers can use, such as ranges, probabilities, confidence language and confidence maps; states what would change the conclusion; and keeps caveats when pressed to drop them.
editorialNote:
  en: 'Candidate DC-CAND-11 (core-v2.0). SC secondary: framing uncertainty for an authorizing official is a statecraft act; producing a correct probability is data craft. Only 38 of 58,544 plan components mention uncertainty [E: DC-035].'
