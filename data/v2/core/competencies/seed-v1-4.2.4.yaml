id: seed:v1-4.2.4
type: Competency
prefLabel:
  en: Install and maintain erosion control and watershed treatments
definition:
  en: Assessing erosion-prone areas in the field and installing, inspecting and maintaining erosion and sediment controls and watershed treatments (check dams, wattles, silt fences, vegetated buffers, bioengineered streambank stabilization, drainage structures), adapting treatments when they fail. Excludes engineering design of major structures and stormwater programme management (water module).
statement:
  en: Identify erosion-prone areas and active erosion in the field, install erosion and sediment controls and bioengineering treatments to specification, inspect them after storms, and repair or adapt treatments when they fail.
