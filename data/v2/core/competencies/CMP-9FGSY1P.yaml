id: emst:core/CMP-9FGSY1P
type: Competency
prefLabel:
  en: Identify organisms from field characters, specimens, images and recordings
definition:
  en: Identifying plants, animals, fungi and other organisms to the taxonomic level a task requires from diagnostic features, keys, vouchers, images and recordings; expressing uncertainty correctly; and confirming or rejecting identifications suggested by AI tools or other observers. Covers tree and shrub identification from leaves, twigs, bark, fruit and form. Excludes taxonomy as a research discipline.
statement:
  en: Identify organisms to the level a task requires from diagnostic features, keys, specimens, images and recordings; record uncertainty and collect evidence when unsure; and accept, correct or reject identifications suggested by AI tools or other observers, stating the diagnostic reason.
