editorialNote:
  en: 'WP-03 (FC) draft. Rewritten; absorbs LC-C-03 (regional plant and tree identification). Pairs with FC-C03 (adjudicating automated detections at volume). Formation-dependent: expertise is built in the field even where review is on screen (ADR-0005). Reference libraries may carry sensitive names or locations; community-held knowledge enters only with consent (route to TN). Protect suggested for Editorial Board (see WP-03 worklog). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): rewrite → core | practice | WF-ASSESS. Rationale: One of the most durable FC capabilities and the one AI tools most change: add adjudicating AI-suggested identifications (pairs with FC-C03), blind identification-test anchors; absorbs LC-C-03 (regional plant and tree keys); FS stress test suggests protect. Role verdicts considered: FC:change. Title and description were merged in the v1 database and are split here from the source text.'
