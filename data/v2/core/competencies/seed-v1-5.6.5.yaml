id: seed:v1-5.6.5
type: Competency
prefLabel:
  en: Conduct participatory and community-based environmental research
altLabel:
  en:
  - Participatory methods and community-based research
  - Community-based participatory research (CBPR)
  - Participatory mapping
  - Co-produced research
definition:
  en: 'Designing and carrying out environmental research and monitoring in partnership with community members who share in setting questions, choosing methods, collecting and interpreting data and deciding how findings are used: partnership and data agreements, research ethics review and consent, participatory methods such as participatory mapping and photo-based methods, building community data capacity, joint interpretation and returning findings in usable form. Excludes community-science data collection to a programme protocol (v1 5.4.4), conventional social science surveys (v1 5.6.2), collaborative decision processes (v1 5.2.3) and cumulative-burden analysis (DB-C52).'
statement:
  en: Builds a research partnership in which community members share in setting the questions, choosing methods, collecting and interpreting data and deciding how findings are used; agrees data ownership, access and consent terms before collection; builds community capacity to collect and analyze data; and returns findings in forms and languages the community can use.
