  en: Planning field plots and labelled samples, maintaining reference datasets with their metadata, provenance and access conditions, and running regional validation that establishes where Earth-observation and AI models are fit for use. Covers the reference-data lifecycle across seasons and products. Excludes model training and evaluation statistics as such (data craft) and single-product field checks (FC-C02).
