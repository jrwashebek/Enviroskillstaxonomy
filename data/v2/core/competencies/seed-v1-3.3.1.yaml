id: seed:v1-3.3.1
type: Competency
prefLabel:
  en: Supervise staff and volunteers in environmental work
altLabel:
  en:
  - Personnel management and supervision
  - Remote and hybrid team leadership
  - Volunteer programme management
  - First-line supervision
definition:
  en: 'Directing, developing and evaluating the people who do environmental work, whether permanent, seasonal or term staff, volunteers, or staff working remotely, in the field or in hybrid arrangements: setting work plans and performance expectations, assigning and checking work, giving and documenting feedback, addressing performance and conduct problems within personnel rules and any labour agreement, and planning each person''s development. Volunteer recruitment, scheduling, training and recognition are tasks of this competency in park, land-trust, wildlife and community-science settings. Excludes designing formation sequences (v1 7.2.2, TX-D), certifying task performance against position standards (IO-C01), leading a field crew''s daily work (FC-C20) and designing merit-based recruitment and selection (v1 5.3.4-B).'
statement:
  en: Sets work plans and performance expectations for staff and volunteers, assigns and checks their work, gives documented feedback, addresses performance and conduct problems within personnel rules and any labour agreement, gives remote, field and office staff equal information and assessment, and plans each person's development so that judgment-forming work is not skipped.
