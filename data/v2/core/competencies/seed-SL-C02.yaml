editorialNote:
  en: 'WP-05 (A5 SC; SL reviewed the state and local enactments). Survivor for permit and authorization writing: absorbs DB-C07, DB-C12 (air permitting part of v1 6.7.5) and C-LM-03 and the regulator half of v1 6.1.3. Regulator and resource-manager variants are actor enactments with authorityPosition; programme specifics (water discharge, air operating, waste, wetland fill, land-use authorizations) are module enactments (WP-06). v1 described this work from the applicant side; state postings describe the permit-writer side [E: SL-079, SL-088]. Mirror links: SC-C01 regulated-party enactment (applicant pathway) and DB-C26 (permittee compliance).'
