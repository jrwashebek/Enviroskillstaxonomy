definition:
  en: The capability of the authority that decides an application to evaluate it, derive and draft the limits, conditions and monitoring that implement the governing requirements, answer public comment, and issue, condition or deny the permit or authorization on a defensible record. Excludes the applicant's side of the process and the programme knowledge of each permit type, which module enactments carry.
statement:
  en: Evaluates applications against the applicable law, rules and technical standards; derives limits, conditions and monitoring requirements from the technical record; drafts the permit or authorization and its fact sheet or decision rationale; responds to comments; and issues, conditions or denies it on a record that withstands administrative and judicial review.
