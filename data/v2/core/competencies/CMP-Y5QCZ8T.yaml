id: emst:core/CMP-Y5QCZ8T
type: Competency
prefLabel:
  en: Plan for non-analog ecological futures
altLabel:
  en:
  - Non-analog futures planning
definition:
  en: The capability to recognize when future conditions are likely to lack historical precedent, such as novel climates or species combinations, and to design plans that remain robust and adaptable across such futures rather than optimized for one expected state.
statement:
  en: Recognizes when future ecological conditions are likely to be non-analog, such as novel climates or species combinations; designs plans that perform acceptably across divergent futures rather than one expected state; builds flexibility, monitoring triggers and adaptive capacity into long-term plans; and documents the assumptions that would invalidate them.
