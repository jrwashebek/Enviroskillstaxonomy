id: emst:core/CMP-BEN7KNR
type: Competency
prefLabel:
  en: Design human-in-the-loop review for AI-assisted environmental workflows
altLabel:
  en:
  - Human oversight design for AI-assisted work
definition:
  en: The capability to specify where people review, approve or override AI outputs in a workflow and to show that the review is substantive. It covers review rates by risk, confidence thresholds, escalation triggers, reviewer qualifications and independence, audit logs and review-quality measures. It excludes doing the validation (transversal floor) and authorizing the design (statecraft).
statement:
  en: 'Specifies where people review, approve or override AI outputs in an environmental workflow: risk-based review rates, confidence thresholds and escalation triggers, reviewer qualifications, independence from the tool''s producer and audit logs; measures whether review is substantive rather than perfunctory; and redesigns the workflow when review quality degrades.'
editorialNote:
  en: Candidate ID DC-CAND-14 (candidate_disposition.csv). DC specialist responsible-AI competency (ADR-0025 §2 layer 2). Distinct from DC-CAND-13 (doing validation) and DC-CAND-19 (deciding risk tier). Authorization of the design is the SC enactment of DC-CAND-13 (emst:core/ENA-SMWHBCW).
