id: emst:core/CMP-HMJ6TEJ
type: Competency
prefLabel:
  en: Analyze and interpret climate observations and projections for management decisions
altLabel:
  en:
  - Climate data analysis and interpretation
definition:
  en: The capability to obtain, process and interpret historical climate records and downscaled projections for a place, choosing scenarios, ensembles and downscaling methods suited to the decision, and to translate results into decision-relevant terms with their uncertainty. Specific climate data portals and model archives are L4.
statement:
  en: Obtains, processes and interprets historical climate records and downscaled projections for a management unit; chooses scenarios, ensembles and downscaling methods suited to the decision; analyzes trends and extremes; and translates results into decision-relevant variables with ranges and stated limits for managers and planners.
