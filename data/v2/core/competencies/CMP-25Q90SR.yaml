prefLabel:
  en: Conservation genetics and genomics
definition:
  en: The body of knowledge on genetic diversity, gene flow, population structure, inbreeding, adaptive variation and evolutionary potential, and on genetic, genomic, molecular-ecology and environmental-DNA evidence, as used in conservation and management decisions.
statement:
  en: Knowledge of genetic diversity, gene flow, population structure, effective population size, inbreeding and genetic load, adaptive variation and evolutionary potential, and of how genetic, genomic, molecular-ecology and environmental-DNA evidence is produced and interpreted for translocation, recovery, captive breeding and management-unit decisions.
