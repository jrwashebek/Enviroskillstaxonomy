  en: 'Plans management of ecosystems undergoing fundamental change: identifies trajectories and climate refugia; chooses, with stated evidence, whether to resist, accept or direct transformation at each site; sets goals for ecological function and value where historical conditions cannot be restored; and monitors whether the chosen strategy is working.'
