id: emst:core/CMP-6EYD4G1
type: Competency
prefLabel:
  en: Assess and manage model risk for consequential environmental decisions
altLabel:
  en:
  - Model risk management
definition:
  en: The capability to inventory models and AI systems that inform decisions, tier them by consequence, set proportional requirements for validation, documentation, independent review, monitoring and retirement, and decide when a model must not be used. Authorizing adoption stays with statecraft.
statement:
  en: Maintains an inventory of models and AI systems that inform environmental decisions; tiers them by consequence for payments, permits, enforcement, safety, rights and protected resources; sets proportional requirements for validation, documentation, independent review, monitoring and retirement; provides independent challenge to model owners; and decides when a model must not be used.
editorialNote:
  en: 'Candidate ID DC-CAND-19 (candidate_disposition.csv). DC specialist responsible-AI competency (ADR-0025 §2). Survivor: absorbs FS-C02 and the risk-tiering part of v1 7.1.4. The high-impact environmental archetypes are models that drive payments or enforcement [E: DC-001]. Policy instruments that define high-impact use live in the L5 registry.'
