definition:
  en: The capability to build a small set of plausible future conditions for a planning area or policy question, under varying ecological, social and economic drivers, and to compare how management or policy alternatives perform across them so that decision-makers see trade-offs and choices that hold up. Operational forecast systems and organizational horizon scanning are separate competencies.
statement:
  en: Defines the question, drivers and uncertainties for a planning area or policy choice; builds contrasting, plausible scenarios with stakeholders; models or estimates how alternatives perform under each; shows the trade-offs in maps and tables decision-makers can use; and states which alternatives perform acceptably across every scenario.
