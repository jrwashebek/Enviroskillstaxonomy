definition:
  en: The capability to run a regulatory program under authority delegated, approved or assumed from another level of government, or to oversee such a program, including the conditions on which the authority rests and the plan for its withdrawal or reversion. Covers state-to-local delegation and federal oversight of state programs.
statement:
  en: 'Administers a state or local program that holds delegated, primacy or assumed authority, or oversees one: meets and documents the conditions on which the authority rests, manages the oversight relationship and its reporting, keeps program rules at least as stringent as the authority requires, and plans for withdrawal or reversion of authority.'
