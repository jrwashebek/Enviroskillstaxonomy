id: emst:core/CMP-PKREZ0G
type: Competency
prefLabel:
  en: Build task-specific evaluation sets and benchmark AI tools before adoption
altLabel:
  en:
  - AI evaluation and benchmarking
definition:
  en: The capability to construct a representative, independently labelled reference set for a specific environmental task, measure candidate AI tools and the current human process against it, and document results so that adoption, procurement and monitoring decisions rest on local evidence. It includes designing task rubrics for evaluating AI on multi-step work.
statement:
  en: Constructs representative, independently labelled reference sets for specific environmental tasks; measures candidate AI tools and the current human process against them, including error by condition and citation accuracy; tests automated scoring against human scoring before relying on it; and documents results so that adoption, procurement and monitoring decisions rest on local evidence.
