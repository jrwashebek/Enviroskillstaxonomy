editorialNote:
  en: 'S2 close-out B (A6 DB; ADR-0030 §4 core residue). Survivor of DG-DB-C42: absorbs FH-C09 (incident roles as a collateral duty; the qualifications themselves are Credential gates, ADR-0003 T-8) and the incident command part of v1 4.3.1 (wildland firefighting stays in MOD-11). Operating within a standardized incident command structure is shared by fire, spill, flood and public-health response, so the task core recurs across modules; module enactments in hazards, forest and envhealth. Needed by R06-R08 (P1) and R26, R30 (P2). The position-qualification systems and their alignment dates are L5 instruments and Credential records, not text here. Basis [J]: DB and FH Phase 2 candidates and sources.'
