id: emst:core/CMP-35BT97W
type: Competency
prefLabel:
  en: Coordinate environmental response operations within incident command
altLabel:
  en:
  - Environmental emergency response
  - Incident command system (ICS) roles
  - Serve in incident roles as a collateral duty
definition:
  en: 'Performing an assigned environmental, technical-specialist, unit or command role inside a standardized incident command structure during wildfire, spill, flood, drinking water or public-health emergencies: taking a position, working to incident objectives by operational period, supplying environmental inputs to the incident action plan, keeping the unit log and resource status, building unified command across agencies, and handing over or demobilizing. Covers collateral-duty service by staff whose primary job is not response. Excludes suppression tactics (v1 4.3.1), field emergency communication and incident reporting (v1 4.4.5), public risk communication (DB-C29) and position qualifications, which are credential gates.'
statement:
  en: Takes an assigned position in an incident command structure during environmental emergencies, works to the incident objectives for each operational period, supplies environmental inputs to the incident action plan, keeps the unit log and resource status current, and hands the position over or demobilizes without loss of commitments, coordinating with cooperating agencies under unified command.
