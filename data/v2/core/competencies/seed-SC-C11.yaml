definition:
  en: The capability to judge how likely an instrument is to survive changes of administration, litigation and budget cycles, to choose instrument types and timing accordingly and to plan for reversal. A learnable judgment evidenced in written analyses and forecast records, not a trait.
statement:
  en: Judges how likely a rule, guidance document, handbook, agreement, permit or program is to survive changes of administration, litigation and budget cycles; chooses instrument types and timing accordingly; identifies coming decision windows; and prepares contingency plans for programs that rest on unstable instruments.
