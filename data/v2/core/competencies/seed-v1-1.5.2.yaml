prefLabel:
  en: Assess climate vulnerability of species, ecosystems, infrastructure and communities
altLabel:
  en:
  - Climate vulnerability assessment
definition:
  en: The capability to evaluate how climate change threatens species, ecosystems, infrastructure and communities by assessing exposure, sensitivity and adaptive capacity with an established framework, stating confidence, and to rank vulnerabilities so that adaptation can be prioritized. Named index tools are L4.
statement:
  en: 'Evaluates how climate change threatens species, ecosystems, infrastructure and communities: assesses exposure, sensitivity and adaptive capacity with an established framework; states the confidence of each rating and the evidence behind it; ranks vulnerabilities; and turns findings into prioritized recommendations for managers.'
editorialNote:
  en: 'Rewritten by WP-04 (DC lane: v1 craft primary DC, used only to route the seed; v1 tags are prior evidence, not v2 values). Carried (wording rewritten); vulnerability index tools moved to L4 (seed:tool-climate-vulnerability-indices). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): carry → core | practice | WF-ASSESS. Rationale: Vulnerability assessment recurs across water, forest, wildlife, hazards and infrastructure (G-4). Role verdicts considered: none recorded.'
