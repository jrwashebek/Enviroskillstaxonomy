id: seed:v1-4.5.1
type: Competency
prefLabel:
  en: Use and maintain hand tools safely for field work
definition:
  en: Selecting, using, sharpening, maintaining, transporting and storing non-powered hand tools for vegetation management, trail work, fireline construction, restoration and sampling, with safe body position, spacing and technique, including crosscut saw work. Crosscut sawyer certification is a credential gate. Excludes powered equipment.
statement:
  en: Select and use the right hand tool for vegetation, trail, fireline, restoration and sampling work with safe body position, spacing and technique; sharpen and maintain tools so they stay safe; and transport and store them safely.
