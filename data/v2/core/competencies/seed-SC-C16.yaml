definition:
  en: The capability to write the binding text of permits, agreements, rules, orders, policies and decision documents so that it is within authority, clear, measurable, enforceable and workable, and to test drafts before issue. Covers non-binding guidance as a lesser case.
statement:
  en: Writes permit conditions, agreement terms, rules, orders, policy language and decision documents that are within authority, clear, measurable, enforceable and workable for the people who must carry them out, and tests drafts against implementation, compliance-verification and legal-challenge scenarios before they are issued.
