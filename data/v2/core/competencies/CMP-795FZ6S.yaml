id: emst:core/CMP-795FZ6S
type: Competency
prefLabel:
  en: Conduct social science research on the human dimensions of environmental issues
altLabel:
  en:
  - Social science research methods
definition:
  en: The capability to design and carry out qualitative and quantitative social science research, such as surveys, interviews and focus groups, on the human dimensions of environmental issues, with sound sampling, ethical protections for participants, appropriate analysis and accessible reporting.
statement:
  en: Designs and carries out surveys, interviews, focus groups and other social science research on the human dimensions of environmental issues; samples respondents to support the intended inference; protects participants' consent and confidentiality; analyzes qualitative and quantitative data with appropriate methods; and reports findings accessibly with their limits.
