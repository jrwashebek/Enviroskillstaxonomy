editorialNote:
  en: 'S2 close-out B (A9 LM with FS; ADR-0030 §4 core residue). Horizon scanning is its own core practice, not a floor requirement (ADR-0025 §4), and was considered and not merged into v1 6.2.5 (ADR-0030 §3.1). Boundary: 6.2.5 builds scenarios for one policy or land-use decision; DC-CAND-12 runs forecast systems; this competency turns signals into workforce moves. Spans L3-L5 (strategy cluster). The signal method mirrors EMST''s own change-signal layer (ADR-0028: source, independence, signposts). Needed by R13 at the strategic level (P1) and R35 (P3). Basis [J]: FS Phase 2 candidate and horizon-scanning protocol.'
