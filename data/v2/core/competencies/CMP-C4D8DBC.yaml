id: emst:core/CMP-C4D8DBC
type: Competency
prefLabel:
  en: Scan horizons and translate change signals into workforce decisions
altLabel:
  en:
  - Strategic foresight for workforce planning
  - Horizon scanning
  - Weak-signal monitoring
definition:
  en: Monitoring technology, policy, labour-market and environmental change signals; maintaining scenarios and signposts; running structured foresight sessions with managers; and converting the results into dated workforce moves, both no-regret actions taken now and contingent actions with named triggers, each with an owner and a review date. Covers signal logging with source and independence, scenario maintenance and trigger monitoring. Excludes policy and land-use scenario analysis for a decision (v1 6.2.5), operational forecast and scenario systems (DC-CAND-12), planning for non-analog ecological futures (v1 1.7.5) and position-level staffing justification (FH-C14).
statement:
  en: 'Monitors technology, policy, labour-market and environmental change signals with their sources, maintains scenarios and signposts, runs foresight sessions with managers, and converts the results into workforce decisions: no-regret moves made now and contingent moves tied to named triggers, each with an owner and a review date, revisited when signposts move.'
