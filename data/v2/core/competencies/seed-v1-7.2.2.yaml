id: seed:v1-7.2.2
type: Competency
prefLabel:
  en: Design developmental work experiences that preserve the formation of professional judgment
altLabel:
  en:
  - Designing workflows for tacit knowledge formation in AI-augmented practice
  - Design AI-augmented apprenticeships
  - Design performance-based qualification for field and technical work
  - Design structured developmental field experiences
definition:
  en: Designs the sequence of supervised work, unaided practice, rotations, task-book assignments and qualification steps through which entry and developing staff form the judgment their role requires, including where AI or automation now performs tasks that once built it. Covers formation analysis of workflows, staged-exposure and by-hand rules, performance-based qualification design and evaluation of whether formation works. Excludes observing and certifying one person's performance (a separate TX-D competency) and leading a field crew.
statement:
  en: Analyzes which tasks in a workflow form judgment, then designs developmental experiences (supervised repetitions, unaided by-hand quotas, rotations, task books and qualification steps) so that entry and developing staff still form that judgment when AI or automation performs those tasks, and evaluates whether the design works.
