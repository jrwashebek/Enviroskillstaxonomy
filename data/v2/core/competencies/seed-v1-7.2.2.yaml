  v1Title: Designing workflows for tacit knowledge formation in AI-augmented practice
  v1Description: Structuring human roles, mentoring sequences, and deliberate practice opportunities within AI-augmented workflows to ensure that practitioners develop foundational tacit knowledge that AI tools are compressing at entry level.
  levels:
  - v1Level: foundational
    mapsTo: L1
    v1Key: v1:7.2.2:foundational
    knowledge: Understands that tacit knowledge forms through practice, not instruction alone; recognizes that when AI automates a task, the developmental value of performing that task is also lost unless deliberately preserved; understands the concept of career ladder destruction as a structural workforce concern
    application: Identifies tasks in their own workflow where AI automation has changed the learning pathway; articulates what a junior practitioner would no longer develop by following the AI-augmented version of a process
    knowledgeApplicationOrigin: database
    indicators:
    - v1Key: v1:7.2.2:foundational:I1
      n: 1
      text: Explains the difference between task completion and knowledge formation — why automating a task can eliminate developmental value even when outputs are produced
      origin: database
    - v1Key: v1:7.2.2:foundational:I2
      n: 2
      text: Identifies specific formation pathways at risk in AI-augmented workflows in their domain context
      origin: database
    - v1Key: v1:7.2.2:foundational:I3
      n: 3
      text: Recognizes the difference between nominal mentoring (assigning a mentor) and deliberate practice design (sequencing experiences to develop specific tacit knowledge)
      origin: database
    - v1Key: v1:7.2.2:foundational:I4
      n: 4
      text: Distinguishes between AI tools that compress incidental administrative overhead and AI tools that compress developmental content
      origin: database
