id: seed:v1-5.1.1
type: Competency
prefLabel:
  en: Communicate technical environmental information in writing and speech
altLabel:
  en:
  - Written communication for diverse audiences
  - Public speaking and presentation
  - Science communication and storytelling
  - Public information and media relations
  - Plain-language writing
  - Digital outreach
definition:
  en: 'Turning technical environmental information (findings, data, plans, rules and decisions) into accurate written, spoken and visual products for specialist and public audiences: plain-language summaries, reports, fact sheets, presentations, public-meeting remarks, news releases, media interviews, testimony and digital posts. Covers audience analysis, accuracy checks with subject experts, accessibility and translation, clearance, and answering public and media questions. Excludes risk and crisis messaging under uncertainty (DB-C29, TX-E), briefing decision-makers for authoritative decisions (SC-C18), designing public engagement (SC-C06) and interpretation (v1 5.1.3).'
statement:
  en: Analyzes the audience and purpose, then writes, presents and adapts technical environmental information into accurate, accessible products for specialist and public audiences, checks them with subject experts before release, and answers public and media questions without overstating certainty, so that readers and listeners can use the information correctly.
