id: seed:v1-5.4.4
type: Competency
prefLabel:
  en: Coordinate community-science data collection to programme data-quality standards
altLabel:
  en:
  - Citizen science coordination
definition:
  en: The capability to design and run programmes in which members of the public collect environmental data, with protocols, training, verification and data-quality controls that make the contributions usable for monitoring and management, while protecting participants and sensitive information.
statement:
  en: 'Designs and runs programmes in which members of the public collect environmental data: sets questions, protocols and training; verifies submissions and controls data quality; protects participants'' personal data and sensitive species locations; compiles and analyzes contributions with their known biases; and reports results back to participants.'
editorialNote:
  en: 'Rewritten by WP-04 (DC lane: v1 craft primary DC, used only to route the seed; v1 tags are prior evidence, not v2 values). Carried (wording rewritten); community-science platforms are L4 (seed:tool-inaturalist). v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): carry → core | practice | WF-ASSESS (X05). Rationale: Citizen science coordination with data-quality design. Role verdicts considered: none recorded.'
