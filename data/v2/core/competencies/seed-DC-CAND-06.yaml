definition:
  en: 'The capability to prepare environmental datasets for discovery and reuse by others: metadata and vocabulary standards, repositories, licences and persistent identifiers, documented fitness for use, sensitivity review before release and review of machine-generated metadata; including stewardship of the authoritative datasets that plans and decisions rely on.'
statement:
  en: 'Prepares environmental datasets for discovery and reuse: applies metadata and vocabulary standards; chooses repositories, licences and persistent identifiers; documents fitness for use; runs sensitivity review before release; reviews machine-generated metadata for accuracy; and stewards the authoritative datasets that plans and decisions rely on, including their versions and supersession.'
