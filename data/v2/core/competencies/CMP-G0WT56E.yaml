id: emst:core/CMP-G0WT56E
type: Competency
prefLabel:
  en: Assess ecosystem services with production-function models validated against observations
altLabel:
  en:
  - Ecosystem services assessment
definition:
  en: The capability to identify, quantify and map ecosystem services such as flood mitigation, water purification, carbon storage, pollination and recreation with production-function models, validate the models against observations, and communicate service benefits with their uncertainty. Named ecosystem-service model products are L4.
statement:
  en: Identifies, quantifies and maps ecosystem services such as flood mitigation, water purification, carbon storage, pollination and recreation with production-function models; validates model estimates against observations; states uncertainty and the beneficiaries assumed; and communicates service benefits in planning and outreach without overstating precision.
