prefLabel:
  en: Detect, treat and monitor invasive species in the field
definition:
  en: Running early-detection surveys at high-risk pathways, confirming detections in the field, and controlling invasive plants, animals and pathogens by mechanical, chemical and biological methods within integrated pest management, including rapid containment, non-target protection and treatment monitoring. Pesticide application is credential-gated. Excludes invasive-species policy and regulation.
statement:
  en: Survey high-risk pathways for new invasions, confirm detections in the field, and control established invasive plants, animals and pathogens with mechanical, chemical or biological methods within integrated pest management, protecting non-target species and adapting treatments from monitoring.
