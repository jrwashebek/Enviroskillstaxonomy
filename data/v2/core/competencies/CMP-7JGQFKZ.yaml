id: emst:core/CMP-7JGQFKZ
type: Competency
prefLabel:
  en: Use AI tools responsibly in everyday environmental work
altLabel:
  en:
  - Everyday AI literacy
definition:
  en: The capability to decide whether and how to use a general-purpose or embedded AI tool for a work task, direct it with adequate context, check its output before acting, protect sensitive information and disclose AI involvement, within the employer's rules. It excludes designing review systems and governing AI portfolios, which are data-craft specialist competencies.
statement:
  en: Decides whether and how to use a general-purpose or embedded AI tool for an environmental work task; gives it adequate context; checks outputs for accuracy, completeness and fitness before acting; keeps sensitive and controlled information out of unapproved tools; discloses AI involvement in work products; and follows the employer's AI rules.
editorialNote:
