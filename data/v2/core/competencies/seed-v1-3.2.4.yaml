definition:
  en: The capability to assess an environmental programme's mandate, capacity and conditions, set its mission, goals and measurable objectives, turn them into an implementation strategy with resources, milestones and owners, and lead the organizational and technological change the strategy needs while protecting staff capacity and the work that forms new staff. Generic strategic-planning techniques are referenced, not covered; horizon scanning is a separate competency.
statement:
  en: Assesses a programme's mandate, capacity and conditions; sets mission, goals and measurable objectives with staff and partners; writes the implementation strategy with resources, milestones and owners; and leads organizational and technological change, including AI adoption, sequencing change to staff capacity and keeping the work that forms new staff.
