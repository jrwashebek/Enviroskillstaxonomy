id: emst:core/CMP-CD9P70X
type: Competency
prefLabel:
  en: Manage physical assets and capital plans with risk-based asset management
altLabel:
  en:
  - Asset management
  - Equipment and fleet management
  - Facilities operations and maintenance
  - Capital improvement planning
definition:
  en: 'Keeping physical assets (treatment plants and pipe networks, roads and trails, buildings and field stations, fleets and field equipment) able to deliver a stated level of service at the lowest defensible life-cycle cost: inventory, condition and criticality assessment, likelihood and consequence-of-failure scoring, maintenance planning, repair, renewal and replacement decisions, and long-term capital and financial plans. Covers facility operation and maintenance and equipment management as contexts. Excludes operating treatment processes (DB-C01, DB-C02), protecting operational technology (DB-C06) and executing public budgets (SC-C10).'
statement:
  en: Maintains an asset inventory with condition and criticality, scores likelihood and consequence of failure, plans maintenance and renewal against stated levels of service, and builds capital and financial plans that justify repair, renewal or replacement timing and funding, so that infrastructure, facilities and equipment keep delivering service at the lowest defensible life-cycle cost.
