id: emst:core/CMP-8EAS8ZR
type: Competency
prefLabel:
  en: Record provenance and AI involvement in work products
altLabel:
  en:
  - Document data provenance and lineage for environmental evidence
definition:
  en: 'The capability to record and preserve where data and derived products came from: sources and versions, methods, transformations, models and AI systems involved, human review steps and responsible parties, so that findings can be traced, reproduced or corrected. Level 1 is part of the universal floor; levels 2 and above are data-craft practice.'
statement:
  en: Records, for own data and work products, the sources and versions, collection methods, transformations, models and AI systems involved, human review steps and responsible parties; builds lineage records for derived products; and designs provenance capture into workflows, so that any finding can be traced, reproduced or corrected.
editorialNote:
