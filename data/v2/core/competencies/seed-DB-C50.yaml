definition:
  en: The capability to identify historic properties a proposed action may affect, assess the effects, consult the parties the governing procedure names and resolve adverse effects in an implementable agreement. Determinations of cultural significance rest with the communities concerned and are not assessed by this competency.
statement:
  en: Identifies historic properties in a proposed action's area of potential effects, assesses whether the action would adversely affect them, consults preservation offices and other consulting parties, and resolves adverse effects through agreed measures recorded in a form the deciding agency can implement and monitor.
