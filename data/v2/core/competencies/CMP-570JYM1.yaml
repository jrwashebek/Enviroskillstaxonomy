type: Competency
prefLabel:
  en: Maintain and repair field equipment and vehicles
definition:
  en: Performing scheduled maintenance, field diagnosis and repair of field equipment, instruments and vehicles; improvising safe temporary repairs; keeping maintenance records and parts inventories; and tagging out unsafe equipment, so that equipment is safe and available when field work needs it. Excludes shop-level mechanics and fleet management.
statement:
  en: Perform scheduled maintenance on field equipment, instruments and vehicles; diagnose and repair faults in the field or shop within competence; tag out unsafe equipment; and keep maintenance records and parts inventories current.
