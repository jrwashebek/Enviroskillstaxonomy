id: emst:core/CMP-72R1NBG
type: Competency
prefLabel:
  en: Manage field sample custody and field quality control
definition:
  en: Planning, carrying out and documenting field QC (blanks, duplicates, splits, calibration logs), chain of custody and holding times for environmental samples, and recognizing and reporting field conditions that invalidate samples, so that results stay defensible from collection to report. Excludes laboratory QA and data validation after receipt (data craft).
statement:
  en: Plan and document field QC samples, calibration logs, chain of custody and holding times; recognize and report field conditions that invalidate samples; trace QC failures to their field causes; and defend field procedures when results are challenged.
