id: emst:core/CMP-T4GHAG0
type: Competency
prefLabel:
  en: Work safely on hazardous, industrial and energized field sites
definition:
  en: 'Recognizing and controlling chemical, physical and energy hazards during field work at contaminated, industrial, utility and construction sites: following site health and safety plans, selecting and using protective equipment, keeping confined-space, electrical and line-clearance limits, decontaminating, and responding to incidental discovery of hazardous materials with isolation and notification. Hazardous-waste operations training is a credential gate. Excludes remediation management (waste module) and emergency hazmat response.'
statement:
  en: Follow site health and safety plans at contaminated, industrial and energized sites; use the protective equipment and decontamination the plan requires; keep confined-space, electrical and line-clearance limits; and isolate, report and withdraw safely when hazardous materials are discovered unexpectedly.
