definition:
  en: The capability to characterize existing environmental and health burdens on the communities a decision affects, estimate how the decision changes those burdens and how its effects are distributed, and document the analysis in the form the applicable procedure requires. Excludes community engagement design and partnership building, which are separate competencies.
statement:
  en: Characterizes the existing environmental and health burdens on communities affected by a proposed decision, estimates how the decision adds to or reduces those burdens and how its effects are distributed, states the uncertainty in screening data and methods, and documents the analysis in the form the applicable review or permit procedure requires.
