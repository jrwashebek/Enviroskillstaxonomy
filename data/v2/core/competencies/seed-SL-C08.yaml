definition:
  en: The capability to scope, prepare or direct, and conclude the analysis of a proposed action's reasonably foreseeable environmental effects and alternatives under the review procedures that govern the deciding agency, so that the decision record shows the effects were considered. Excludes choosing the level of review, consultation on protected species and historic-property review, which are separate competencies.
statement:
  en: 'Scopes, prepares or directs, and concludes the environmental review of a proposed action under the procedures that govern the deciding agency: defines purpose, alternatives and effects boundaries, integrates interdisciplinary analysis, keeps within page and time limits, and documents how effects were considered in the decision.'
