definition:
  en: The capability to organize several agencies with authority over one action into agreed roles and one schedule, and to keep that schedule and its public record accurate. Covers role agreements, joint schedules, cooperating-agency decisions and jurisdiction disputes. Excludes oversight of delegated programs, which is a separate competency.
statement:
  en: Establishes and runs the roles, joint schedule and milestones among the lead, cooperating and participating agencies for a multi-agency action, resolves disputes about jurisdiction and timing, decides cooperating-agency requests with reasons, and keeps the shared schedule and public milestone data accurate.
