prefLabel:
  en: Toxicology and exposure pathways
definition:
  en: The body of knowledge on how toxic substances affect human and ecological health and the routes by which people and organisms are exposed to environmental contaminants in air, water, soil and food.
statement:
  en: Knowledge of toxicological principles (dose-response, thresholds, mixtures, bioaccumulation), exposure routes and pathways through air, water, soil and food, susceptible life stages and populations, and the evidence base behind toxicity values, as used by environmental health, remediation and chemicals work.
