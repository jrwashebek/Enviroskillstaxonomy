definition:
  en: The capability to identify every institution with authority over a proposed action and the governing procedure for each decision, and to sequence those decisions into a pathway a team can follow. Shared by regulators advising applicants and by applicants, sponsors and their consultants. Excludes deciding the authorizations themselves.
statement:
  en: Identifies every institution with authority over a proposed action, the legal basis and procedure version that govern each decision, which decisions are sequential or concurrent, the consultation triggers and the critical path, and produces an authority map and pathway plan the project team, applicant or agency can act on.
