definition:
  en: The capability to show, with workload, statutory and plan requirements, critical-skill risk and labour-market evidence, why a position or staffing level is needed, to choose between hiring and its alternatives, and to defend the case before hiring committees and budget offices. Ranking or selecting people for separation is excluded.
