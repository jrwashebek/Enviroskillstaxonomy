definition:
  en: The capability to design and run master and project agreements under which agencies, other governments and nonprofit partners share stewardship work across jurisdictional boundaries, within legal limits on delegating governmental functions, and to keep them working through turnover. Excludes contract and grant administration in general.
statement:
  en: 'Designs and runs master and project agreements under which agencies, other governments and nonprofit partners share stewardship work: scopes work within legal limits on delegating inherently governmental functions, sets roles, reporting, revenue retention and reinvestment, and keeps agreements working through staff turnover and changes of administration.'
