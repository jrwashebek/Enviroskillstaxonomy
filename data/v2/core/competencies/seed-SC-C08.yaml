editorialNote:
  en: 'WP-05 (A5 SC). Survivor: absorbs FS-C14 and CC-CM-03 and v1 6.5.3 and 6.5.4 (merged). Agreement authority is expanding: 540 agreements in FY2025 (426 with states, 50 with counties), county revenue retention through FY2028, recreation agreements new, a state statute extending state authority, and a bill for 20-year agreements [E: SC-030, SC-031, SC-034, SC-032]. Agreements with Tribal governments (and co-stewardship content) route through TN-C04 under the hold. Indicators adapted from SC-A-C08-1..4. L5 indicators await SME confirmation.'
