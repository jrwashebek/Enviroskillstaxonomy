id: seed:v1-4.4.1-B
type: Competency
prefLabel:
  en: Apply safety practices and stop-work authority across field, facility and incident settings
altLabel:
  en:
  - Safety culture
  - Stop-work and turn-down authority
  - Learning from incidents
definition:
  en: 'Applies an organization''s safety-culture practices in everyday environmental work: recognizing and reporting hazards and near misses, exercising and honouring stop-work and turn-down authority, briefing and debriefing safety, and learning from incidents without blame, in field, facility and incident settings. Excludes the technical assessment and control of hazards for specific field operations (field risk management, a Field Craft practice competency) and the administration of occupational-safety programmes.'
statement:
  en: Recognizes, reports and acts on hazards and near misses, exercises and honours stop-work authority, runs safety briefings and after-action reviews, and builds a reporting culture in which colleagues raise concerns and learn from incidents, across field, facility and incident settings.
