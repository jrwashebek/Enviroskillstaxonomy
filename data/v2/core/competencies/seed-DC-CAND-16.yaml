id: seed:DC-CAND-16
type: Competency
prefLabel:
  en: Analyze regulatory, planning and public-comment text at scale with traceable citations
altLabel:
  en:
  - Analyze regulatory, planning and public-comment text with LLMs, with traceable citations
  - LLM-assisted text analysis
definition:
  en: The capability to extract, classify and summarize content from plans, environmental documents, permits, consultation documents and public comments with machine assistance, so that every extracted statement traces to a source passage and omission and fabrication rates are measured. Legal sufficiency judgments stay with the responsible official (statecraft).
statement:
  en: Uses machine-assisted extraction, classification and summarization on plans, environmental documents, permits, consultation documents and public comments; requires every extracted statement to trace to a source passage; measures omission and fabrication rates on a sample; documents limits for the responsible official; and maintains reusable pipelines through model changes, leaving the legal sufficiency judgment with the official.
editorialNote:
