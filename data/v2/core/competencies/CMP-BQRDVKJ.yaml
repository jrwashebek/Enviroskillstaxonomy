id: emst:core/CMP-BQRDVKJ
type: Competency
prefLabel:
  en: Deploy, maintain and verify field sensor networks
definition:
  en: Siting, installing, powering, securing, servicing and verifying autonomous field instruments (acoustic recorders, camera traps, water-quality sondes, weather and soil stations, low-cost air sensors) so that continuous data stay valid at the point of measurement, and diagnosing drift, fouling, damage and siting bias in place. Excludes network data pipelines and streaming systems (data craft) and the instrument products themselves (tools layer).
statement:
  en: Site, install, service and verify autonomous field instruments so that continuous data stay valid at the point of measurement; diagnose drift, fouling, damage and siting bias in place, run side-by-side checks against reference measurements, and decide when a manual visit or sample is needed.
