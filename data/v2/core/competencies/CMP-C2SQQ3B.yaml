prefLabel:
  en: Ecosystem dynamics and processes
definition:
  en: The body of knowledge on how energy, water and nutrients move through ecosystems, how species interact through food webs and other interdependencies, and how communities change through succession after disturbance. It underpins assessment, restoration and monitoring work across crafts.
statement:
  en: Knowledge of energy flow and nutrient cycling, species interactions and interdependencies, food-web structure, and ecological succession after disturbance, as used to interpret ecosystem condition and to plan restoration, monitoring and management.
