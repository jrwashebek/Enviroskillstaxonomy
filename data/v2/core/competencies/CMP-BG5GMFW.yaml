definition:
  en: 'The capability to design and operate the data path from deployed sensors, telemetry, cameras and recorders to analysis-ready data: ingest, time synchronization, automated quality checks and anomaly flags, gap handling, storage, versioning and alerting, including edge processing where bandwidth is limited. Field deployment, siting and calibration stay field craft.'
statement:
  en: 'Designs and operates the data path from deployed sensors, telemetry, cameras and recorders to analysis-ready data: ingest, time synchronization, automated quality checks and anomaly flags, gap handling, storage, versioning and alerting, including processing at the edge where bandwidth is limited; and documents the pipeline so that data remain traceable.'
