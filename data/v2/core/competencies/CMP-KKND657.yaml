id: emst:core/CMP-KKND657
type: Competency
prefLabel:
  en: Deliver environmental projects to budget, schedule and quality
altLabel:
  en:
  - Deliver billable environmental projects to budget, schedule and quality
  - Project planning and scheduling
  - Project risk management
  - Project budgeting and cost control
definition:
  en: Plans and phases project work, builds and tracks the schedule and budget (including labour hours and estimate at completion), manages project risks and subcontractors, runs quality review before deliverables leave, and reports and invoices against the agreement, for billable services and for grant-funded and cost-recovery projects. Excludes public budget formulation and appropriations (a Statecraft practice competency), legal administration of contracts and agreements, and specific project-management software (tools layer).
statement:
  en: Plans and phases project work, sets and tracks the schedule and budget through estimate at completion, manages risks, subcontractors and seasonal or regulatory windows, runs quality review before deliverables are released, and reports progress and costs against the agreement for billable, grant-funded and cost-recovery projects.
