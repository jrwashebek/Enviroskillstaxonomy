definition:
  en: The capability to develop adaptation strategies and actions for species, ecosystems, infrastructure and communities, to evaluate options against climate risk and uncertainty, and to integrate climate risk into management plans, infrastructure design and capital decisions. Decision-support software is L4.
statement:
  en: Develops adaptation strategies and actions for species, ecosystems, infrastructure and communities; evaluates options against climate risk, cost and uncertainty; integrates climate risk into management plans, infrastructure design criteria and capital decisions; and sets monitoring triggers for revisiting choices as conditions change.
