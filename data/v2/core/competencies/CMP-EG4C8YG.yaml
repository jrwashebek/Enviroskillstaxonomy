definition:
  en: The capability, as a subject-matter expert, supervisor or hiring lead, to turn a technical position's duties into a documented job analysis and into job-related assessment content (proficiency benchmarks, crediting criteria, structured-interview questions with rating anchors and work samples), and to rate applicants consistently against them. Designing and validating assessment methods is the selection specialist's work and is referenced, not covered.
statement:
  en: Rates a position's tasks and competencies with other subject-matter experts and documents the job analysis; writes proficiency benchmarks, crediting criteria, structured-interview questions with rating anchors and work samples tied to it; rates applicants consistently against those criteria; and reviews AI-drafted assessment content before it is adopted.
