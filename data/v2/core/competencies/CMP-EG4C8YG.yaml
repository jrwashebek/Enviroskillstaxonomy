editorialNote:
  en: 'S2 close-out A (A7 FH; reviewer A8 IO). Survivor: absorbs IO-C02 (serve as a subject-matter expert in merit-based hiring assessments; candidate_disposition.csv). Federal hiring now needs position-specific technical assessments based on a job analysis, and self-assessment no longer ranks applicants (from 2025-09-30), so line practitioners write and rate assessment content; in FY2025 91 percent of delegated-examining announcements still relied on self-report only, and few agencies employ selection specialists [E: FH-023, FH-002, FH-017, V1-09]. Job analysis remains required after OPM removed the uniform-guidelines references from its hiring rules on 2026-07-31 [E: IO-022]; ''UGESP compliance'' is a register do-not-say form. AI may draft job analyses and questions only under job-analysis requirements and human adoption [E: FH-015]. An EMST profile is not a job analysis: SMEs adapt and rate it for the position (hr_use_cases.md (b)). Distinct from CC-CM-02 (career translation for candidates; ADR-0030 §3.1) and from v1 5.3.4-B (merit-based practice by the selecting official).'
