id: emst:core/CMP-HSPFCPF
type: Competency
prefLabel:
  en: Record field observations with protocol fidelity and data integrity
definition:
  en: Recording complete, accurate and documented field observations in any medium; applying protocol rules and metadata under adverse conditions; flagging conditions that compromise data; designing field forms with their users; and recovering records when devices fail. Excludes database administration and data pipelines (data craft) and specific apps and devices (tools layer).
statement:
  en: Record complete, accurate and documented observations in any medium, applying protocol rules and metadata under adverse conditions; flag conditions that compromise data; check records before hand-off; and recover the record when a device fails.
