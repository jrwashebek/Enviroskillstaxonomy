prefLabel:
  en: Develop proposals and grant applications for environmental work
altLabel:
  en:
  - Develop business and write winning proposals for environmental work
  - Grant writing
  - Capture planning
definition:
  en: Decides whether to pursue a funding or contract opportunity, plans the response, writes the technical approach, assembles qualifications and past performance, and prepares a compliant budget and price for requests for proposals, task orders, grants and cooperative agreements. Covers private business development and public, non-profit and local-government grant seeking. Excludes delivering the funded work and negotiating the resulting agreement's legal terms.
statement:
  en: Makes documented go/no-go decisions on funding and contract opportunities, plans the response, writes a technical approach that answers the evaluation criteria, assembles qualifications and past performance, and prepares a compliant budget and price for proposals, task orders, grants and cooperative agreements.
