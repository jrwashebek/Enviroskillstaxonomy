id: emst:core/CMP-8FWZT6S
type: Competency
prefLabel:
  en: Assess environmental impacts across product life cycles to guide circular design
altLabel:
  en:
  - Product lifecycle assessment and design
definition:
  en: The capability to conduct life-cycle assessment of products, materials and services to an accepted method, with stated system boundaries, functional units, inventory data quality and impact methods, and to use the results to guide design for durability, repair, disassembly and material recovery. LCA software and inventory databases are L4.
statement:
  en: Conducts life-cycle assessments of products, materials and services with stated goal, scope, system boundaries and functional unit; documents inventory data quality and impact methods; tests sensitivity of conclusions; and uses results to guide design for durability, repair, disassembly and material recovery, including traceability of materials across the chain.
editorialNote:
