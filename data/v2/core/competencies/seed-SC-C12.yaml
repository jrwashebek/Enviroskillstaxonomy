definition:
  en: The capability to detect changes in rules, guidance, court decisions and legislation, judge which programs, decisions and staff they affect, and turn them into dated operating guidance so that work in progress follows the governing version. The human counterpart of the L5 instrument registry. Excludes legislative advocacy.
statement:
  en: Monitors rules, guidance, court decisions and legislation, with automated tracking where available; judges which changes affect which programs, decisions, procedures and staff; issues dated change notices; and updates procedures, templates and training so that work in progress follows the governing version.
