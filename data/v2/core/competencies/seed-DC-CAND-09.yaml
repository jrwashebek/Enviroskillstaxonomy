id: seed:DC-CAND-09
type: Competency
prefLabel:
  en: Evaluate model fitness-for-purpose and validate against independent evidence
altLabel:
  en:
  - Model evaluation
  - AI model interpretation and explainability
definition:
  en: 'The capability to judge whether a statistical, process, learned or AI model is fit for a stated decision: checking assumptions and domain of applicability, designing independent validation, quantifying error by condition, detecting use outside the model''s envelope, interpreting what drives predictions and documenting limits.'
statement:
  en: 'Judges whether a statistical, process, learned or AI model is fit for a stated decision: checks assumptions and domain of applicability; designs independent validation with blocked hold-outs or field reference data; quantifies error by condition; detects use outside the model''s envelope; explains which inputs drive predictions; and documents the limits.'
editorialNote:
  en: 'Candidate DC-CAND-09 (core-v2.0): DC enactment of the validation floor at model level; absorbs v1 2.6.5 interpretability content (model-risk content in DC-CAND-19). FC secondary for ecological models: out-of-distribution failure is usually first seen in the field.'
