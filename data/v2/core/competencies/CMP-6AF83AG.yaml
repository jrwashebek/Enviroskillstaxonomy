  en: Carrying out restoration treatments on the ground (native planting and seeding, invasive removal, soil amendment, habitat features, process-based and low-tech structures such as beaver dam analogues and post-assisted log structures) in wildland, rural and urban settings; operating restoration equipment; reading site response; and adapting treatments. Excludes restoration planning and permitting as such and heavy-equipment work (worklands module).
