id: seed:FC-C16
type: Competency
prefLabel:
  en: Collect trace-level and genetic environmental samples without contamination
definition:
  en: 'Applying clean sampling methods for trace metals, emerging contaminants and environmental DNA: choosing sites, timing and replication for detection, running field and equipment blanks, preventing cross-contamination from gear and people, and preserving and shipping samples within holding times. Excludes assay and bioinformatic interpretation (knowledge area) and laboratory analysis; the genetic method itself is an L4 method.'
