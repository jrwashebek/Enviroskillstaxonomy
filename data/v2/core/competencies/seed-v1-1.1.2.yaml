type: Competency
prefLabel:
  en: Assess and monitor biodiversity across species and habitats
definition:
  en: 'Designing, running and interpreting biodiversity inventories and monitoring across taxa and habitats, from field protocols through long-term trend analysis to reporting findings for conservation decisions. An integrative practice: field, data and statecraft contributions are rated per task rather than labelled on the competency. Excludes single-taxon identification and statistical methods as such.'
statement:
  en: Design and run biodiversity inventories and monitoring across taxa and habitats, combine field, passive-detector and genetic evidence, analyse long-term change against objectives, and report findings and their uncertainty in a form conservation decision-makers can act on.
