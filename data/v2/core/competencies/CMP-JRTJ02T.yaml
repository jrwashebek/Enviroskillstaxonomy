id: emst:core/CMP-JRTJ02T
type: Competency
prefLabel:
  en: Build, calibrate and validate predictive and simulation models of environmental systems
altLabel:
  en:
  - Predictive modeling and simulation
definition:
  en: The capability to build, calibrate, validate and run process, statistical and hybrid models that predict or simulate environmental systems under alternative conditions and scenarios, with sensitivity analysis and honest uncertainty. Named model products are L4; forecast systems run operationally are a separate competency.
statement:
  en: Builds, calibrates, validates and runs process-based, statistical and hybrid models that predict or simulate environmental systems, such as fire spread, hydrology, populations and vegetation, under alternative conditions and scenarios; conducts sensitivity and uncertainty analysis; tests performance under novel conditions; and presents outputs with their limits to decision-makers.
editorialNote:
  en: 'Rewritten by WP-04; absorbs v1 2.6.3 (predictive analytics); operational forecasting and early-warning systems are shared with DC-CAND-12. v1 disposition (ADR-0011; docs/decisions/v1_disposition.csv): rewrite → core | practice | WF-PLAN (DC). Rationale: Durable share high; calibration, validation, sensitivity and scenario design; absorbs 2.6.3 (DC disposition). Role verdicts considered: DC:change.'
