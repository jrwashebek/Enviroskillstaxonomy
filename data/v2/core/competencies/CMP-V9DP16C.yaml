prefLabel:
  en: Provide first aid and emergency medical care in remote field settings
definition:
  en: Assessing injuries and illnesses and giving first aid and wilderness emergency care where definitive care is distant; stabilizing and monitoring patients; deciding on and coordinating evacuation; and maintaining medical kits. First aid and wilderness medicine certifications are credential gates, not proficiency. Excludes clinical medicine.
statement:
  en: Assess injured or ill people in remote field settings, give first aid and wilderness emergency care within the scope of training, monitor and stabilize patients, decide whether and how to evacuate, and coordinate evacuation with responders.
