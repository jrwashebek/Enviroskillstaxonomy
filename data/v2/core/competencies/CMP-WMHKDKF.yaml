prefLabel:
  en: Assess species habitat requirements and habitat condition
definition:
  en: Determining what conditions species need through field study of habitat use, behaviour and condition, evaluating habitat suitability across sites and landscapes, and turning results into habitat recommendations and planning inputs. Excludes geospatial software operation (tools layer) and live capture and handling.
statement:
  en: Document species' habitat use and behaviour in the field, assess habitat condition and suitability at site and landscape scale, test suitability models against field observations, and recommend habitat measures for planning and management.
