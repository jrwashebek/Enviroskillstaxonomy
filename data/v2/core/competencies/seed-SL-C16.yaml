definition:
  en: The capability to perform, seal or certify only the work one's licence, registration or certification permits, to exercise or work under responsible charge as licensing rules require, and to certify AI-assisted deliverables only after personal verification. The credential itself is a gate recorded on tasks and roles, not part of this competency.
statement:
  en: Performs, seals or certifies only the work that one's licence, registration or certification permits; works under or exercises responsible charge as the licensing rules require; refers work outside scope; and certifies AI-assisted deliverables only after personally verifying them to the professional standard of care.
