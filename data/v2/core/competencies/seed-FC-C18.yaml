id: seed:FC-C18
type: Competency
prefLabel:
  en: Navigate and travel safely in remote terrain with and without digital aids
definition:
  en: Planning routes and travelling off trail by map and compass, satellite positioning and digital maps; recording accurate field locations; recognizing and recovering from positioning or device failure; assessing terrain, weather and water-crossing hazards; and taking part in search operations as a specialization. Specific receivers and apps are L4. Excludes aviation navigation.
statement:
  en: Plan routes and travel off trail by map and compass as well as satellite positioning, record field locations to the required accuracy, recognize and recover from positioning or device failure, and assess terrain, weather and water-crossing hazards; take part in search operations when assigned.
