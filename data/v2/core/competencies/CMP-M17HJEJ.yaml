id: emst:core/CMP-M17HJEJ
type: Competency
prefLabel:
  en: Measure water quality and survey aquatic communities in the field
definition:
  en: Measuring physical and chemical water properties in place with calibrated field instruments, collecting representative water samples, and surveying aquatic communities (macroinvertebrates, fish, algae, habitat) to protocol, including judging when flow, mixing or disturbance invalidate a sample. Excludes trace-level clean sampling and sample custody (separate competencies), laboratory analysis and compliance determinations.
statement:
  en: Measure water quality in place with calibrated instruments, collect samples that represent the condition of interest, and survey aquatic communities to protocol; recognize when flow, mixing, disturbance or holding times invalidate a measurement, and resample or flag it.
