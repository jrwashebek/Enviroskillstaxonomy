prefLabel:
  en: Investigate and manage emerging contaminants across media
altLabel:
  en:
  - PFAS and other emerging contaminants
definition:
  en: 'The capability to plan and interpret investigations of contaminants whose health criteria, regulatory standards and analytical methods are still evolving: identifying sources and pathways across water, soil, air and waste, respecting analytical method limits, communicating risk while criteria change, and selecting interim response and treatment.'
statement:
  en: 'Plans and interprets investigations of contaminants whose criteria, standards and analytical methods are still evolving: identifies sources and pathways across water, soil, air and waste; chooses sampling and analytical methods within their detection limits; communicates risk while criteria change; and selects interim response and treatment options with stated uncertainty.'
