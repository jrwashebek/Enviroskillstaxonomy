id: seed:v1-4.1.4
type: Competency
prefLabel:
  en: Describe, test and sample soils in the field
definition:
  en: Describing soil profiles and horizons in standard terms, estimating properties by field tests (texture by feel, structure, colour, redoximorphic features, infiltration, compaction), collecting samples for laboratory analysis, and relating field evidence to hydrology, erosion risk, productivity and soil health. Excludes soil science as a knowledge area and digital soil mapping (data craft).
statement:
  en: Describe soil profiles in standard terms, estimate soil properties by field tests and collect samples for laboratory analysis; relate diagnostic features to hydrology, erosion and soil health, and move sampling locations or depths to capture real site variation.
