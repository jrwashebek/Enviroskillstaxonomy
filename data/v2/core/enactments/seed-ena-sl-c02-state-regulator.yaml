authorityBasis:
  en: 'State statute and rules; for delegated or authorized federal programmes (water discharge permits, air operating permits, hazardous waste permits, assumed dredge-and-fill permits) also the federal authorization. Delegated constraints: state requirements at least as stringent as the federal minimum; federal review of and objection to draft permits; withdrawal or reversion of authority.'
principal:
  en: The agency director or bureau chief who signs permits; the permit appeal board.
accountabilityVenue:
  en: State environmental hearing or permit appeal boards; state courts; federal objection and programme oversight.
