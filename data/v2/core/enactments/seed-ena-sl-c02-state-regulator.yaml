note:
  en: 'SL review: the state permit writer is the modal state regulatory job (PA NPDES permit writer; MI EGLE permit analysts; TX Environmental Protection Specialist III) [E: SL-079, SL-076, SL-050]. Florida''s assumed 404 programme reverted to the Corps in 2026, showing that delegated authority is contingent [E: SC-021].'
