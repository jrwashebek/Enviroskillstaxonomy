note:
  en: 'FC enactment of the TX-A floor competency on validating AI-generated work products before professional use (ADR-0025 §2). The field-craft contribution is ecological plausibility and field ground truth: practitioners test AI outputs (species identifications, habitat and condition maps, detections, drafted field forms and hazard analyses) against what they observe on site and against place, season, range and site history; decide when a field check is needed; and reject or escalate outputs that conflict with field evidence. Validation at volume (sampling design, error estimation) is the DC enactment; legal sufficiency and provenance in the record is the SC enactment. Field ground-truth programmes are FC-C02; adjudication of automated detections at volume is FC-C03.'
