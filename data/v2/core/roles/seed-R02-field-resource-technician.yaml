id: seed:R02-field-resource-technician
type: RoleProfile
prefLabel:
  en: Field resource technician
definition:
  en: Entry and journey field role that collects vegetation, wildlife, water and soil data to protocol, identifies organisms, keeps sample custody and records with integrity, and checks remote and AI-generated products against the ground. It is the largest field entry role and the main formation step for identification and measurement judgment.
functionStatement:
  en: Collect and record defensible field observations and samples to protocol, and verify automated and remote products against what is on the ground.
primaryWorkFunction: WF-ASSESS
