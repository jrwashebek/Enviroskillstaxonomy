prefLabel:
  en: Restoration and land stewardship project lead
definition:
  en: 'Project role that plans, permits, delivers and monitors ecological restoration and land stewardship projects: reading site history and reference conditions, adapting treatments to site response, designing monitoring, working with landowners and partners, and managing contracts, budgets and authorizations.'
