id: seed:R04-geospatial-remote-sensing-analyst
type: RoleProfile
prefLabel:
  en: Geospatial and remote sensing analyst
definition:
  en: Analyst role that maps and monitors environmental conditions from imagery and spatial data, builds and validates detection and spatial models, designs maps for decisions, and states accuracy and uncertainty. Pretrained Earth-observation models change the method layer; validation, transfer testing and fitness-for-purpose judgments grow.
functionStatement:
  en: Turn spatial and remotely sensed data into validated map and model products whose accuracy and limits are stated for the decision they serve.
