prefLabel:
  en: Environmental permit writer
definition:
  en: Regulatory role that reviews permit applications for completeness, derives limits and conditions from technical standards and the record, drafts enforceable permits and fact sheets, negotiates conditions, answers comments and administers issued permits, often within a delegated programme. Drafting software compresses production; review of drafted conditions grows.
functionStatement:
  en: Turn an application and the governing standards into permit conditions that are measurable, enforceable and traceable to their legal and technical basis.
