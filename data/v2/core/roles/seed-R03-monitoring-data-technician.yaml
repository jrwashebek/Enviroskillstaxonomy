prefLabel:
  en: Monitoring and data technician
definition:
  en: Field-to-data role that installs, services and verifies sensor networks, collects samples under custody, and quality-assures monitoring data from collection to release. Work is shifting from manual collection toward verification of automated streams and adjudication of automated flags.
