id: seed:R13-resource-program-manager
type: RoleProfile
prefLabel:
  en: Natural resource and environmental programme manager
definition:
  en: Management role that plans and justifies programme budgets, briefs decision-makers, manages land or regulatory programme plans and agreements, tracks instrument and policy change, and protects the programme's capacity to form and keep skilled staff, including how AI tools are governed.
