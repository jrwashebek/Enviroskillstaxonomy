id: seed:R12-environmental-compliance-inspector
type: RoleProfile
prefLabel:
  en: Environmental compliance inspector
definition:
  en: Regulatory field role that plans and conducts compliance inspections, collects evidence under custody, writes findings of fact, selects the response the enforcement policy sets, supports cases and gives compliance assistance. Monitoring data and automated flags increasingly target inspections; on-site inspection and evidence stay human.
functionStatement:
  en: Establish, with defensible evidence, whether regulated facilities and sites meet their permits and rules, and start the response the enforcement policy requires.
primaryWorkFunction: WF-ENFORCE
