id: seed:R10-environmental-review-specialist
type: RoleProfile
prefLabel:
  en: Environmental review specialist
definition:
  en: Role that determines the level of environmental review for proposed actions, prepares or directs effects analyses, coordinates cooperating agencies and consultations, builds the administrative record and writes decision documents under the governing agency procedures. AI drafting compresses production; verification, record integrity and litigation resilience grow.
functionStatement:
  en: Establish, document and defend what a proposed action's effects are and which review it requires, so that the deciding official acts on a defensible record.
