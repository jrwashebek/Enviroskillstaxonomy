id: seed:lc-pw-cor1-field-technician-to-geospatial-analyst
type: Pathway
prefLabel:
  en: 'Exploratory pathway: field resource technician to geospatial and remote sensing analyst'
definition:
  en: Reskills a journey-level field technician into a geospatial and remote sensing analyst role, teaching only the role-profile delta (spatial analysis, image analysis, data QC, validation and decision support) and keeping the learner's field ground truth as a defined 20-30% field component (ADR-0026 R6; LC-PW-03 branch A). Exploratory.
