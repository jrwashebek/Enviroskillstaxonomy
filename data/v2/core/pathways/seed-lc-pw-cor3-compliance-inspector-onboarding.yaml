id: seed:lc-pw-cor3-compliance-inspector-onboarding
type: Pathway
prefLabel:
  en: 'Exploratory pathway: onboarding a new environmental compliance inspector to independent inspection'
definition:
  en: 'Takes a new hire from entry to journey level in the compliance inspector role over about twelve months: safety, independence, field sampling, shadowed then observed inspections, enforcement documentation, public contact and AI-output validation (LC-PW-01 adapted). Exploratory.'
