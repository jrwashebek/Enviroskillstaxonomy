assessmentPlan:
  en: 'Each CLO is assessed with the methods its indicators list; field-craft outcomes are assessed at least once in the field, statecraft outcomes in a live or simulated stakeholder or legal-administrative setting, data-craft outcomes on real data with a reproducible product (LC template R4-R5). Assisted-mode outcomes include a seeded-error validation drill. Supervisor formation plan required: the learner''s supervisor works to seed:v1-7.2.2 at L2 or above and a named mentor or evaluator to seed:IO-C01 at L3 (ADR-0026 R7). Training use only; never a selection instrument (IO).'
sequence:
- step: 1
  tasks:
  - seed:lc-txc-report-near-miss
  - seed:sc-plan-inspection
  - seed:sc-disclose-assignment-interests
  cloOutcomes:
  - competency: seed:v1-4.4.1-B
    level: L1
  - competency: seed:SL-C03
    level: L1
  - competency: seed:PS-C18
    level: L1
  roleLevel: entry
  note:
    en: Facility safety, inspection planning and independence.
- step: 2
  tasks:
  - seed:v1-1.2.4-T1
  - seed:v1-4.1.3-T1
  - seed:fc-coc-complete
  cloOutcomes:
  - competency: seed:v1-4.1.3
    level: L1
  - competency: seed:FC-C24
    level: L1
  formationProvisions:
  - task: seed:v1-1.2.4-T1
    responses:
    - observed-wbl
    quota:
      count: 5
      unit: observed sampling events
    releaseCriterion: zero custody defects
    mentorRequired: true
  roleLevel: entry
  note:
    en: Field sampling with custody; supervised repetitions before any automated QC is credited.
- step: 3
  tasks:
  - seed:v1-6.1.2-T1
  - seed:sc-collect-inspection-evidence
  - seed:sc-write-inspection-report
  - seed:v1-2.2.3-T2
  cloOutcomes:
  - competency: seed:SL-C03
    level: L2
  - competency: seed:v1-2.2.3
    level: L1
  formationProvisions:
  - task: seed:v1-6.1.2-T1
    responses:
    - observed-wbl
    quota:
      count: 15
      unit: 'inspections: 10 shadowed, then 5 observed'
    releaseCriterion: evaluator sign-off (IO-C01 regulatory-inspector enactment)
    mentorRequired: true
  - task: seed:v1-2.2.3-T2
    responses:
    - by-hand-quota
    quota:
      count: 1
      unit: manual audit of a facility's monitoring reports
    releaseCriterion: audit reviewed before automated screening is credited
    mentorRequired: true
  roleLevel: entry
  note:
    en: Shadow 10 inspections, then lead 5 under observation; inspection reports reviewed by a senior inspector.
- step: 4
  tasks:
  - seed:lc-txe-answer-public-questions
  - seed:sc-answer-compliance-questions
  cloOutcomes:
  - competency: seed:DB-C29
    level: L1
  - competency: seed:SL-C10
    level: L1
  roleLevel: entry
  note:
    en: Public contact and compliance assistance.
- step: 5
  tasks:
  - seed:v1-7.2.1-T2
  - seed:v1-7.1.3-T1
  cloOutcomes:
  - competency: seed:DC-CAND-13
    level: L1
  - competency: seed:v1-7.1.3
    level: L1
  formationProvisions:
  - task: seed:v1-7.2.1-T2
    responses:
    - validation-drill
    quota:
      count: 1
      unit: seeded-error AI compliance summary
    releaseCriterion: every error that changes a compliance conclusion flagged
    mentorRequired: true
  roleLevel: journey
  note:
    en: 'TX-A floor: every role profile carries L1 on data interpretation, responsible AI use and AI-output validation (ADR-0025).'
- step: 6
  tasks:
  - seed:v1-6.1.5-T2
  - seed:sc-select-enforcement-response
  cloOutcomes:
  - competency: seed:SL-C04
    level: L2
  roleLevel: journey
  note:
    en: Enforcement documentation; capstone end-to-end inspection file at month 11.
