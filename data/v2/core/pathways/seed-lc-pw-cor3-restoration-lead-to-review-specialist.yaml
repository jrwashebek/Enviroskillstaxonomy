prefLabel:
  en: 'Exploratory pathway: restoration project lead to environmental review specialist (field to statecraft bridge)'
definition:
  en: 'Moves a restoration project lead into environmental review: mapping authorizations, setting the level of review, preparing and checking analyses, coordinating agencies and the public, analyzing comments and defending the record. It is the field-to-statecraft collaboration bridge kit (P-CM-06). Exploratory.'
