  - seed:v1-7.1.3-T2
  cloOutcomes:
  - competency: seed:PS-C18
    level: L2
  - competency: seed:v1-7.1.3
    level: L2
  roleLevel: journey
  note:
    en: Independence across the regulator-regulated boundary.
