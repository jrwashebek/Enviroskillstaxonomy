- step: 2
  tasks:
  - seed:sc-draft-permit-fact-sheet
  - seed:sc-update-procedure-version
  cloOutcomes:
  - competency: seed:SC-C16
    level: L2
  - competency: seed:SC-C12
    level: L2
  formationProvisions:
  - task: seed:sc-draft-permit-fact-sheet
    responses:
    - by-hand-quota
    quota:
      count: 2
      unit: permits' conditions and fact sheets drafted unaided
    releaseCriterion: each condition traceable to its basis; senior writer accepts
    mentorRequired: true
  roleLevel: journey
  note:
    en: Enforceable conditions and current procedures; by-hand drafting before AI-drafted permits are reviewed.
- step: 3
  tasks:
  - seed:sc-review-ai-drafted-permit
  - seed:sc-verify-ai-draft-instrument
  cloOutcomes:
  - competency: seed:DC-CAND-13
    level: L2
  formationProvisions:
  - task: seed:sc-review-ai-drafted-permit
    responses:
    - validation-drill
    quota:
      count: 1
      unit: seeded-error AI-drafted permit
    releaseCriterion: every condition lacking a basis corrected
    mentorRequired: true
  roleLevel: journey
  note:
    en: Reviewing AI-drafted permits, credited after the step 2 quota.
- step: 4
  tasks:
  - seed:sc-respond-permit-comments
  - seed:v1-6.1.3-T1
  cloOutcomes:
