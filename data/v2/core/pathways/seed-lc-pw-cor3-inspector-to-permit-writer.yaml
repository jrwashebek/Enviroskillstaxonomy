id: seed:lc-pw-cor3-inspector-to-permit-writer
type: Pathway
prefLabel:
  en: 'Exploratory pathway: compliance inspector to environmental permit writer'
definition:
  en: 'Upskills a journey-level inspector into permit writing: completeness review, deriving limits, drafting enforceable conditions and fact sheets, reviewing AI-drafted permits, responding to comments and guarding independence. Mirrors the pre-registered state pathway from water-quality specialist to permit writer. Exploratory.'
