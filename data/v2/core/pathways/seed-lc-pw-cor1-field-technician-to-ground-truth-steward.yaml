id: seed:lc-pw-cor1-field-technician-to-ground-truth-steward
type: Pathway
prefLabel:
  en: 'Exploratory pathway: field resource technician to ground-truth and validation steward (emerging role)'
definition:
  en: 'Upskills a journey-level field technician into the emerging ground-truth and validation steward role: designing and collecting field reference data, calibrating observers, judging the fitness of remote and AI products, and transferring that judgment to others. The target role is emerging, with the counter-signal that validation may be absorbed into vendor services (mvp_role_set.csv). Exploratory.'
notation:
- scheme: mvp-corridor
  value: COR-1
fromVariant: seed:R02-field-resource-technician
toVariant: seed:R05-ground-truth-validation-steward
