  - competency: seed:DC-CAND-03
    level: L2
  formationProvisions:
  - task: seed:fc-qa-blind-check
    responses:
    - observed-wbl
    quota:
      count: 1
      unit: blind re-measurement of a crew sample
    releaseCriterion: differences computed against tolerances
    mentorRequired: true
  roleLevel: journey
