prefLabel:
  en: 'Exploratory pathway: conservation corps member to field resource technician (entry)'
definition:
  en: 'Moves a conservation corps member or alumnus into an entry field resource technician role by building field safety, protocol data collection, identification and the data and AI floor through supervised field work. Exploratory: not validated against observed moves (ADR-0023).'
