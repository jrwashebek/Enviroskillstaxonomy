- competency: seed:DC-CAND-05
  level: L1
assessmentPlan:
  en: 'Each CLO is assessed with the methods its indicators list; field-craft outcomes are assessed at least once in the field, statecraft outcomes in a live or simulated stakeholder or legal-administrative setting, data-craft outcomes on real data with a reproducible product (LC template R4-R5). Assisted-mode outcomes include a seeded-error validation drill. Supervisor formation plan required: the learner''s supervisor works to seed:v1-7.2.2 at L2 or above and a named mentor or evaluator to seed:IO-C01 at L3 (ADR-0026 R7). Training use only; never a selection instrument (IO).'
sequence:
- step: 1
  tasks:
  - seed:v1-2.3.1-T1
  - seed:fc-sensor-service
  - seed:fc-sensor-sidebyside
  - seed:v1-4.1.3-T3
  cloOutcomes:
  - competency: seed:FC-C01
    level: L1
  - competency: seed:FC-C01
    level: L2
  - competency: seed:FC-C24
    level: L2
  formationProvisions:
  - task: seed:v1-2.3.1-T1
    responses:
    - observed-wbl
    quota:
      count: 3
      unit: sensor installations, observed
    releaseCriterion: installation records complete; evaluator sign-off
    mentorRequired: true
  - task: seed:v1-4.1.3-T3
    responses:
    - by-hand-quota
    quota:
      count: 1
      unit: manual meter reading at every service visit
    releaseCriterion: logged drift within method tolerance
    mentorRequired: true
  roleLevel: journey
  note:
    en: Sensor deployment and servicing, observed in the field.
- step: 2
  tasks:
  - seed:dc-223-apply-checks
  - seed:dc-223-review-flags
  - seed:v1-2.6.4-T2
  - seed:dc-04-versioning
  cloOutcomes:
  - competency: seed:v1-2.2.3
    level: L1
  - competency: seed:v1-2.2.3
    level: L2
  - competency: seed:DC-CAND-04
    level: L2
  formationProvisions:
  - task: seed:v1-2.6.4-T2
    responses:
    - by-hand-quota
    quota:
      count: 1
      unit: month of automated flags reviewed by hand
    releaseCriterion: false-flag and missed-error rates reported
    mentorRequired: true
  roleLevel: journey
  note:
    en: Data verification and pipeline quality; automated flags are credited only after the by-hand review.
- step: 3
  tasks:
  - seed:v1-4.1.3-T1
  - seed:v1-1.2.4-T1
  - seed:fc-sensor-manual-visit
  cloOutcomes:
  - competency: seed:v1-4.1.3
    level: L2
  - competency: seed:DC-CAND-13
    level: L2
  formationProvisions:
  - task: seed:v1-1.2.4-T1
    responses:
    - observed-wbl
    quota:
      count: 5
      unit: observed grab-sampling events
    releaseCriterion: zero custody defects
    mentorRequired: true
  roleLevel: journey
  note:
    en: Reference measurements and the decision to make an unscheduled manual visit.
- step: 4
  tasks:
  - seed:dc-11-retain-uncertainty
  - seed:dc-02-disclose-use
  cloOutcomes:
  - competency: seed:DC-CAND-11
    level: L1
  - competency: seed:DC-CAND-05
    level: L1
  roleLevel: journey
  note:
    en: 'TX-A floor: every role profile carries L1 on data interpretation, responsible AI use and AI-output validation (ADR-0025).'
durationAndCost:
  hours: 160
  months: 6
  costNote: '[J] Sensor and meter access plus mentor time; state-approved continuing-education hours may count where programmes allow.'
