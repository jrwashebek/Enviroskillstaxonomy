id: seed:lc-pw-cor1-field-technician-to-monitoring-data-technician
type: Pathway
prefLabel:
  en: 'Exploratory pathway: field resource technician to monitoring and data technician'
definition:
  en: Upskills a field technician into the monitoring and data technician role, shifting work from collection to sensor deployment, data verification and pipeline quality while keeping manual reference measurements as a standing check against sensors. Exploratory.
notation:
- scheme: mvp-corridor
  value: COR-1
fromVariant: seed:R02-field-resource-technician
toVariant: seed:R03-monitoring-data-technician
pathwayType: upskill
