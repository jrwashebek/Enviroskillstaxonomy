mapping_set_version: 0.1.0-draft
mapping_set_title: X3b EMST roles and retired v1 families to SOC 2018 detailed occupations
mapping_set_description: 'Agent-drafted candidate mappings (review_status=candidate in `other`); no human reviewer yet. Subjects are MVP role profile keys from docs/decisions/mvp_role_set.csv (seed:<role_key>), to be re-keyed to RoleVariant IDs when WP-08 authors them (CR-IA-001); `applies_to` in `other` names the variant or level slice. Predicate rules: closeMatch = core work largely interchangeable for statistics and navigation; broadMatch = the role is a specialisation of a broader occupation; narrowMatch = the occupation is one slice of the role; relatedMatch = partial overlap or feeder/destination; skos:closeMatch with predicate_modifier Not and object sssom:NoTermFound = no SOC occupation adequately covers the role (no NoTermFound row asserts a positive predicate; ADR-0032) (reason in comment). Held variants are not mapped (ADR-0007 §D). v1 family rows (EMSTv1fam) record the verified v1 errors as predicate_modifier Not and the ADR-0022 §5 additions; the family sheet is retired as an anchor. Not for classification, selection or RIF decisions. Rows with mapping_justification semapv:MappingChaining are derived from the O*NET-SOC set; `via` names the intermediate code and weakest_match_type the weaker hop.'
