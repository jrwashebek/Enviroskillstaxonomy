mapping_set_title: X9 (ECQ part) EMST competencies to OPM Executive Core Qualifications (five-ECQ framework, 2025-10-01)
mapping_set_description: 'Agent-drafted candidate mappings to the 15 competencies of the current five ECQs (names verified on OPM''s page 2026-10-23). Object IDs OPMECQ:ECQn-Cm are EMST keys (OPM assigns none); legend in pipelines/crosswalks/reference/opm_ecq_2025-10-01.csv; ecq_parent in `other`. broadMatch = the EMST competency is a domain or practitioner-level enactment of the ECQ competency; relatedMatch = partial overlap. Retired ECQ names (e.g. Partnering, Influencing/Negotiating, Political Savvy) are never targets: such cases are NoTermFound with the reason. Technical Skill (ECQ3-C1) is intentionally not enumerated. Not for SES qualification or rating decisions.'
