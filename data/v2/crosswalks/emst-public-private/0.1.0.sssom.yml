mapping_set_title: 'X11 seed: public <-> private role translations with friction fields (TR-01...TR-38)'
mapping_set_description: 'Seed of the public-private translation set from PS''s Phase 2 translation rows, keyed to MVP role variants. emst:mirrorRole marks pairs with inverted authority position (regulator <-> regulated party or consultant preparer). Friction fields in `other`: friction_posture_change, friction_licensure_gap, friction_pay_direction (''not assessed'' where PS gave no pay evidence). TR rows outside the MVP role set (e.g. TR-13 safety, TR-14 cultural resources, TR-15 realty) are not seeded; TR-14 touches government-to-government consultation and is left for TN review. see_also names the TR row.'
