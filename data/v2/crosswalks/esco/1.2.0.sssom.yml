mapping_set_title: X7 EMST v2 competencies to ESCO skills (reviewed subset; ESCO v1.2.0 pinned, v1.2.1 gap)
mapping_set_description: 'Re-run of the Phase 2 EMST v1 -> ESCO v1.2.0 prototype on EMST v2 competency records (live, not held). Candidates from the emst_linker hybrid index; decisions by an LLM reviewer (review_status=llm-reviewed-candidate; no human reviewer yet). Rejected candidates are kept with predicate_modifier Not so they do not resurface; skos:closeMatch sssom:NoTermFound rows record ESCO gaps (reason in comment). VERSION GAP: ESCO v1.2.1 (Dec 2025) is current; its files were not reachable, so objects are pinned to the v1.2.0 skill URIs in esco-skill-extractor 0.1.18 (wheel sha256 ec6e5daa7d3247634a7950faf33ad9d1ca47fa2d7a09b95677f25a6f91f77af0); re-pin via the upstream diff. Navigation-grade at most until human review (ADR-0022 §4); no claim of ESCO alignment.'
