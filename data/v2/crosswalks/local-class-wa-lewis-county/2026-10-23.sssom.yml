mapping_set_title: 'X5 EMST role variants to Lewis County (WA) classes: county environmental health'
mapping_set_description: Agent-drafted candidate mappings from MVP role variants (seed:<role_key>/<sector_actor>, CR-IA-001) to native class codes; class grain, with position overrides only for the PA pilot (ADR-0022 X5; SL disagreement 6). role_level in `other` names the EMST role level the class corresponds to; register_record names the dated StateClassRecord (data/v2/registers/state_classes/) or 'pending'. Native state crosswalks (TX military crosswalk, PA federal-title equivalencies) are candidate gold sets. Not a classification, qualification or selection decision.
