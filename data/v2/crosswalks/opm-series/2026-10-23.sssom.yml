mapping_set_id: https://w3id.org/emst/crosswalks/opm-series/2026-10-23
mapping_set_version: 0.1.0-draft
mapping_set_title: X4 EMST roles to OPM occupational series (federal variants)
mapping_set_description: Agent-drafted candidate mappings from MVP role profiles (seed:<role_key>; federal variant implied, re-key to RoleVariant IDs per CR-IA-001) to the EMST OPM series register (data/v2/registers/opm_series/, status as of 2026-10-23). Series proposed for realignment in OPM's Phase One list carry target_series_status=proposed-realignment and proposed_successor in `other`; they are never shown as realigned. Predicates as in X3 (closeMatch interchangeable; broadMatch role is a specialisation within a broad series; narrowMatch the series is one slice of the role; relatedMatch partial overlap, feeder or destination; Not for disambiguation). Not a classification basis, not a job analysis, not for RIF or rating decisions.
